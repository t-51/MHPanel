<div class="tab-pane" id="tab-protocols">
    <section style="display: flex; flex-direction: column; gap: 20px;">
        <!-- Header -->
        <div class="section-header" style="margin-bottom: 0;">
            <div>
                <h2 class="section-title" style="margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="server" style="color: var(--color-primary); width: 22px; height: 22px;"></i>
                    <span data-i18n="proto_page_title">مدیریت پروتکل‌های ارتباطی و VPN</span>
                </h2>
                <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" data-i18n="proto_page_subtitle">
                    پایش لحظه‌ای، تغییر پورت، مدیریت سرویس‌ها و تنظیمات اختصاصی هر پروتکل
                </p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button type="button" class="btn btn-primary btn-sm" onclick="openBatchInstallModal()" style="width: auto; padding: 7px 16px; display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="download-cloud" style="width: 14px; height: 14px;"></i> <span data-i18n="proto_batch_install">نصب گروهی پروتکل‌ها</span>
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fetchProtocols()" style="width: auto; padding: 7px 14px; display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> <span data-i18n="proto_refresh_status">بروزرسانی وضعیت</span>
                </button>
            </div>
        </div>

        <!-- Filter tabs for protocols -->
        <div class="proto-filter-scroll-container">
            <button type="button" class="btn proto-tab-filter-btn active" data-proto-filter="all" onclick="filterProtocols('all', this)" data-i18n="proto_filter_all">
                همه پروتکل‌ها
            </button>
            <button type="button" class="btn btn-secondary proto-tab-filter-btn" data-proto-filter="native" onclick="filterProtocols('native', this)" data-i18n="proto_filter_native">
                تانل‌های نیتیو (IKEv2, Cisco, L2TP, SSTP)
            </button>
            <button type="button" class="btn btn-secondary proto-tab-filter-btn" data-proto-filter="crypto" onclick="filterProtocols('crypto', this)" data-i18n="proto_filter_crypto">
                تانل‌های مدرن (OpenVPN, WireGuard, SSH)
            </button>
            <button type="button" class="btn btn-secondary proto-tab-filter-btn" data-proto-filter="proxy" onclick="filterProtocols('proxy', this)" data-i18n="proto_filter_proxy">
                پروکسی‌ها (MTProto, Shadowsocks, HTTP/SOCKS)
            </button>
        </div>

        <div class="protocols-grid" id="protocols-container">
            <!-- Dynamic protocol cards inject here -->
        </div>
    </section>
</div>
