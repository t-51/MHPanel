        "elem_tab_amneziawg_7": "🛡️ این پروتکل با پنهان‌سازی هدرهای دست‌دهی (Handshake Obfuscation) و تزریق بسته‌های فیک تصادفی (Junk Packets)، سیستم‌های DPI اپراتورها (ایرانسل، همراه اول، مخابرات) را دور می‌زند. در کلاینت‌های رسمی <strong>Amnezia VPN</strong> در اندروید، iOS، ویندوز و لینوکس قابل استفاده است.",

        "elem_tab_ikev2_11": "اگر از دامنه اختصاصی استفاده می‌کنید (مانند <code>mhpanel.kigaping.com</code>)، آن را در فیلد زیر وارد کنید تا سرتفیکیت معتبر برای آن صادر شده و در شناسه‌ی سرور تنظیم گردد.",

        "elem_tab_system_68": "الگوریتم ازدحام <strong>Google BBR</strong> همراه با صف‌بندی هوشمند <strong>Fair Queuing (FQ)</strong> باعث کاهش شدید پینگ، پرش پکت (Packet Loss) و افزایش چشمگیر سرعت دانلود/آپلود در شبکه ایران می‌شود.",
        "elem_tab_system_69": "<i data-lucide=\"check-circle\" style=\"width:13px; height:13px; vertical-align:middle; color:#059669; margin-left:4px;\"></i> <span data-i18n=\"awg_parameters\">پارامترهای</span> <code>tcp_fastopen = 3</code>، <code>tcp_slow_start_after_idle = 0</code> و بافرهای شبکه به صورت دائمی در هسته لینوکس ذخیره و فعال خواهند شد.",

        "elem_tab_tunnels_71": "<strong data-i18n=\"tunnels_how_dns_tunnel_works\">نحوه کارکرد تونل DNS:</strong> یک رکورد NS اختصاصی (مثلاً <code>t.example.com</code>) به آی‌پی این سرور اشاره می‌کند. کلاینت داده‌های خود را داخل ساب‌دامین‌های تصادفی کوئری‌های DNS استاندارد به سرور می‌فرستد و پاسخ‌ها در قالب TXT Record دریافت می‌شوند؛ در نتیجه فایروال هیچ اثری از ارتباط VPN یا پروکسی مشاهده نمی‌کند.",
        "elem_tab_tunnels_72": "<div style=\"font-weight: 700; color: #4338ca; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#4f46e5;\"></i>\n<span data-i18n=\"tunnels_gre_ipip_l2tp_ovpn_wg\">تونل‌های استاندارد میکروتیک (GRE, IPIP, L2TP, OVPN, WG):</span>\n</div>\n                    مستقیماً در روتربوردهای میکروتیک قابل استفاده هستند. برای شبکه‌های پایدار و دیتاسنترهایی که پکت‌های IP Protocol 47 (GRE) یا 4 (IPIP) مسدود نیستند، بالاترین سرعت ترانزیت و کمترین لود پردازشی را دارند.",
        "elem_tab_tunnels_73": "<div style=\"font-weight: 700; color: #047857; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#059669;\"></i>\n<span data-i18n=\"tunnels_websocket_tls_tunnels_gost_wstunnel\">تونل‌های وب‌سوکت و TLS (GOST, WSTunnel, RTT, Chisel):</span>\n</div>\n                    ترافیک تونل را به وب‌سوکت رمزنگاری‌شده (WSS) یا TLS استاندارد شبیه وب‌سایت‌های عادی تغییر می‌دهند. می‌توان آن‌ها را از پشت CDN کلودفلر یا با SNI دامنه‌های مجاز عبور داد تا سیستم فیلترینگ DPI قادر به شناسایی ماهیت ترافیک نباشد.",
        "elem_tab_tunnels_74": "<div style=\"font-weight: 700; color: #b45309; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#d97706;\"></i>\n<span data-i18n=\"tunnels_converter_udp_packets_fake_tcp\">مبدل پکت‌های UDP به Fake TCP (UDP2Raw, Phantun):</span>\n</div>\n                    در شبکه‌هایی که اپراتورها پکت‌های UDP و پروتکل‌های WireGuard، AmneziaWG و TUIC را مسدود یا دچار پکت‌لاس شدید می‌کنند، پکت‌های UDP را داخل هندشیک جعلی TCP قرار داده و مانع از مسدودسازی آن‌ها می‌شوند.",
        "elem_tab_tunnels_75": "<div style=\"font-weight: 700; color: #0369a1; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#0284c7;\"></i>\n<span data-i18n=\"tunnels_mikrotik_router_linux_port_forwarding\">روتربورد میکروتیک به لینوکس با پورت فوروارد:</span>\n</div>\n                    می‌توانید سرور خارج را با یکی از ابزارهای ضد فیلتر (مثل GOST یا RTT) به سرور ایران متصل کنید، و سپس از سرور ایران به روتربورد میکروتیک با GRE یا L2TP ترافیک را تحویل دهید تا کاربران بدون مشکل به اینترنت آزاد برسند.",
        "elem_tab_wireguard_76": "💡 <strong data-i18n=\"wg_help\">راهنما:</strong> پس از اجرای دستور فوق در سیستم یا گوشی کلاینت، کافیست در فایل کانفیگ وایرگارد خط <code>Endpoint = 127.0.0.1:51820</code> قرار دهید. تمام ترافیک وایرگارد از CDN کلودفلر به صورت امن عبور می‌کند.",

        "auto_strong_sni_strong_code_ssh_kig": "<strong>SNI:</strong> Definitely <code>ssh.kigaping.com</code>",
        "auto_anyconnect_strong_block_untrus": "In the AnyConnect client, in the settings section (gear), uncheck the <strong>Block Untrusted Servers</strong> option so you don't get a security error (you don't need to do this if you use Let's Encrypt).",
        "auto_code_npu_code": "When connecting, the username and password are the same as Radius Panel centralized accounts (such as <code>NPU</code> user).",
        "auto_strong_settings_vpn_device_man": "Go to <strong>Settings -> VPN & Device Management -> VPN</strong> (on Mac: System Settings -> VPN).",
        "auto_strong_add_vpn_configuration_s": "Click <strong>Add VPN Configuration</strong> and set the protocol type to <strong>L2TP</strong>.",
        "auto_strong_server_strong_ip_code_i": "In the <strong>Server</strong> section, enter the public IP address of the <code id=\"l2tp-guide-ios-ip\">SERVER_IP</code> server.",
        "auto_strong_account_strong_strong_p": "In the <strong>Account</strong> section, enter the Radius user name and in the <strong>Password</strong> section, enter the user's password.",
        "auto_strong_secret_strong_code_id_l": "In the <strong>Secret</strong> section, put the shared key <code id=\"l2tp-guide-ios-psk\">VpnSecret123</code>.",
        "auto_strong_settings_connections_mo": "On older Androids: Go to <strong>Settings -> Connections -> More connection settings -> VPN</strong>. Tap Add VPN and select <strong>L2TP/IPSec PSK</strong> as the type.",
        "auto_strong_ipsec_pre_shared_key_st": "In the <strong>IPSec pre-shared key</strong> section, enter the <code id=\"l2tp-guide-android-psk\">VpnSecret123</code> key value.",
        "auto_l2tp_strong_ikev2_strong_stron": "In Android 12 and later: due to the removal of native L2TP by Google, it is recommended to use the <strong>IKEv2</strong> protocol in this panel, which is 100% compatible with all Android versions, or use the <strong>VpnCilla</strong> application.",
        "elem_modals_1": "<strong data-i18n=\"modal_item_25\">💡 Setup Guide:</strong> The above commands include downloading the official binary, building a persistent Systemd service, and starting it automatically after a server reboot.",
        "elem_modals_2": "Selected tunnel: <strong id=\"scripts-modal-tun-name\" style=\"color:#0f172a; font-family:'JetBrains Mono';\">--</strong>\n                    (<span id=\"scripts-modal-tun-type\" style=\"color:#4f46e5; font-weight:700;\">--</span>)",
        "elem_modals_3": "<strong data-i18n=\"modal_item_27\">💡 How to use in Mikrotik:</strong> Just open the WinBox software, enter the <strong>New Terminal</strong> menu and paste the above codes to automatically create the interface, IP, firewall and NAT of the router.",
        "elem_modals_4": "<strong data-i18n=\"login_title\">MH Panel</strong> is an enterprise open source project developed for setting up, managing and optimizing a variety of modern VPN protocols, Linux bi-directional anti-filtering tunnels, port 443 multiplexer, FreeRADIUS authentication system and automatic generation of MikroTik router configuration codes (v6 and v7).",
        "elem_modals_5": "Current status: <strong data-i18n=\"checking_status\" id=\"twofa-current-status\">Checking...</strong>",
        "elem_modals_6": "Scan the following barcode with <strong>Google Authenticator</strong> or <strong>Microsoft Authenticator</strong>:",
        "elem_tab_amneziawg_7": "🛡️ This protocol bypasses DPI systems of operators (Irancell, First Mobile, Telecom) by hiding handshake headers (Handshake Obfuscation) and injecting random fake packets (Junk Packets). It can be used in the official <strong>Amnezia VPN</strong> clients on Android, iOS, Windows and Linux.",
        "elem_tab_dns_tunnels_8": "To connect in client software (such as <strong>HTTP Custom</strong> and <strong>NapsternetV</strong> in Android), just enter the NS domain and the above public key along with the desired DoH. For Windows and Linux:",
        "elem_tab_dns_tunnels_9": "<i data-lucide=\"zap\" style=\"width:14px; height:14px; color:#f59e0b; vertical-align:middle; margin-left:4px;\"></i> <span data-i18n=\"col_proto\">protocol</span> <strong>Slipstream</strong> uses multi-path QUIC architecture, whose header is 60% smaller than DNSTT and has dedicated congestion control for DNS servers are rate-limited.",
        "elem_tab_ikev2_10": "In the IKEv2 protocol, all operating systems (Windows, iPhone, Mac and Android) check <strong data-i18n=\"ikev2_validity_trust_server_s_root\">the validity and trust of the server root certificate (Root CA)</strong> before sending the username and password. If the certificate is not installed or not trusted, the connection will be blocked before the login stage (such as <code>13801</code> error on Windows or <code>User Authentication Failed</code> error on iPhone).\n                    For the convenience of users, <strong data-i18n=\"ikev2_item_6\">windows auto startup script</strong> and <strong data-i18n=\"ikev2_auto_apple_profile\">apple auto profile</strong> are placed at the bottom of the page.",
        "elem_tab_ikev2_11": "If you use a dedicated domain (such as <code>mhpanel.kigaping.com</code>), enter it in the field below so that a valid certificate is issued for it and set in the server ID.",
        "elem_tab_ikev2_12": "In order to avoid error <strong>Error 13801</strong> and DH Group compatibility, the following file automatically installs the CA certificate in the trusted Windows repository (Trusted Root) and prepares the VPN connection:",
        "elem_tab_ikev2_13": "After downloading, right-click on the file and select <code>Run with PowerShell</code>.",
        "elem_tab_ikev2_14": "<strong data-i18n=\"ikev2_item_3\">⚠️ Mandatory action on iPhone after installation:</strong><br/>\n                            1. Go to <code>Settings -> General -> About</code>.<br/>\n                            2. Open <code>Certificate Trust Settings</code>.<br/>\n                            3. Turn on the <code>MH Panel IKEv2 Root CA</code> switch.",
        "elem_tab_ikev2_15": "On Android with the official <strong>StrongSwan</strong> app or built-in VPN settings for Android 12+:",
        "elem_tab_ikev2_16": "Server address: <strong id=\"android-server-display\">212.227.143.16</strong> | Method: EAP",
        "elem_tab_ikev2_17": "If <strong>EAP-RADIUS</strong> mode is enabled, global RADIUS users also have access to IKEv2 automatically. You can also create local accounts and download user-specific certificates (.p12).",
        "elem_tab_l2tp_18": "With this feature enabled, all the users you created in the <strong data-i18n=\"l2tp_internal_freeradius\">Internal FreeRADIUS</strong> tab of the panel can connect to the L2TP protocol without the need to create a new user or double settings.",
        "elem_tab_l2tp_19": "<strong data-i18n=\"l2tp_windows_important_point_fixing_error\">Important point of Windows (Fixing Error 789 / 809):</strong>\n                    If the server or user is behind NAT, Windows will block the L2TP connection according to Microsoft's default standard. The powershell command above automatically applies the <code>AssumeUDPEncapsulationContextOnSendRule = 2</code> registry value so that the connection is established immediately.",
        "elem_tab_mtproto_20": "Fake TLS Telegram anti-filter proxy with official sponsor channel support (<span style=\"color:#0284c7; font-weight:600;\">@MTProxybot</span>) along with SAX and web proxies connected to worldwide FreeRADIUS",
        "elem_tab_mtproto_21": "Message the bot <code>@MTProxybot</code> in Telegram and send the command <code>/newproxy</code>.",
        "elem_tab_mtproto_22": "Send the <code>vpn.kigaping.com:4433</code> address (or IP) and the Hex Secret key to the bot.",
        "elem_tab_mtproto_23": "Choose a proxy in the robot with the command <code>/myproxies</code> and link your channel with <code>Set promotion</code>!",
        "elem_tab_multiplexer_24": "All the active protocols in the section below will respond simultaneously on <strong data-i18n=\"mpx_item_5\">all the ports in the list below</strong>. If, for example, port 443 is blocked or filtered, users can connect with the same domain on alternate ports (such as 2087, 2096, or 9443) without any changes to the server.",
        "elem_tab_ocserv_25": "When enabled, filtering scanners and any requests sent without a private key will receive a <strong data-i18n=\"ocserv_401_404_normal_web_page\">401 or 404 (Normal Web Page)</strong> error and the Cisco identity will remain completely hidden. The connection is established only by adding the secret address.",
        "elem_tab_ocserv_26": "<strong data-i18n=\"ocserv_special_advice_irancell_mobile_first\">Special advice for Irancell and Mobile First operators:</strong> In conditions of severe internet disruption, operators drop or throttle UDP packets. With <strong data-i18n=\"ocserv_uncheck_this_option\">unchecking this option</strong>, OCServ will switch to pure TCP mode and all traffic will be transferred over the standard TLS 1.3 secure platform and the filter breaker will stay connected much more stably.",
        "elem_tab_ocserv_27": "To connect with the official application <strong>Cisco AnyConnect / Cisco Secure Client</strong> in all operating systems, enter the following address without any prefix or extension in the software:",
        "elem_tab_ocserv_28": "• <strong data-i18n=\"ocserv_main_address_suggested\">Main address (suggested ⚡):</strong> <code>vpn.kigaping.com</code> or <code>vpn.kigaping.com:443</code> (it works on standard port 443, has a valid Let's Encrypt global certificate and is completely open to all Iranian operators).<br/>\n                    • <strong data-i18n=\"ocserv_anti_filtering_mode\">Anti-filtering mode:</strong> AnyConnect traffic passes through port 443 as standard HTTPS (TLS 1.3) secure web traffic and is untraceable.<br/>\n                    • <strong data-i18n=\"ocserv_note\">Note:</strong> There is no need to enter the port in Cisco AnyConnect; Just enter <code>vpn.kigaping.com</code>.",
        "elem_tab_openvpn_29": "In this system, both protocols <strong data-i18n=\"ovpn_udp_fast_gaming_streaming\">UDP (fast for gaming and streaming)</strong> and <strong data-i18n=\"ovpn_tcp_stable_disruption_blocking_time\">TCP (stable for disruption and blocking time)</strong> are simultaneously active on the server. All users are authenticated directly from the <strong>FreeRADIUS</strong> global database (including the default <code>NPU</code> user) without needing to be redefined, and the full <code>.ovpn</code> file including the server keys is available directly at the bottom of the page.",
        "elem_tab_openvpn_30": "If you are using a custom domain such as <code>kigaping.com</code>, enter it and apply to update the server ID.",
        "elem_tab_openvpn_32": "Install the official application <strong>OpenVPN Connect</strong> from Google Play or App Store and import the downloaded <code>.ovpn</code> file into it:",
        "elem_tab_openvpn_33": "<span data-i18n=\"ovpn_2_we_use\">2. Enter username</span> <code>NPU</code> and password <code>56226500</code> and click Connect.",
        "elem_tab_openvpn_34": "On Windows with the official software <strong>OpenVPN GUI</strong> and on Mac OS with <strong>Tunnelblick</strong> software:",
        "elem_tab_openvpn_35": "<span data-i18n=\"ovpn_item_21\">1. Place the <code>.ovpn</code> file in the <code>config</code> folder of the client.",
        "elem_tab_openvpn_36": "Single-line execution without the need for a graphical interface with the <code>openvpn</code> package:",
        "elem_tab_openvpn_37": "Direct management of OpenVPN and FreeRADIUS accounts. Creating a new user, controlling consumption and directly downloading the ready <code>.ovpn</code> file without the need to go to the public section of users.",
        "elem_tab_openvpn_addons_38": "<span data-i18n=\"ovpn_addon_item_5\">This key is actually placed in the client config file as</span> <code>scramble obfuscate <key></code>.",
        "elem_tab_openvpn_addons_39": "<span data-i18n=\"ovpn_addon_server_port\">📍 Server port:</span> <strong>UDP 4000</strong> ➔ Destination port: <strong>1194</strong>",
        "elem_tab_openvpn_addons_40": "<span data-i18n=\"ovpn_addon_item_4\">⚡ Default recovery ratio:</span> <strong>fec 20:10</strong> (33% additional traffic to compensate for packet loss)",
        "elem_tab_radar_41": "International average: <strong id=\"radar-avg-global-ping\" style=\"font-family:'JetBrains Mono';\">--</strong> ms",
        "elem_tab_radar_42": "Click the \"<span data-i18n=\"radar_btn_scan\">run comprehensive radar scan</span>\" button to check the status of Iranian operators.",
        "elem_tab_radius_43": "<span class=\"status-dot active\"></span> FreeRADIUS service is active and ready",
        "elem_tab_radius_44": "<span class=\"status-dot active\"></span> Connected",
        "elem_tab_ssh_45": "Suitable for connecting from Cloudflare, Arvancloud and ports 80 and 443 with <code>/ssh</code> and <code>/ws</code> paths.",
        "elem_tab_ssh_46": "User access: <strong data-i18n=\"ssh_saks_5_safe_without_shell\">Sax 5 safe (without root shell)</strong>",
        "elem_tab_ssh_47": "On port 443, due to the simultaneous sharing of several protocols (Cisco AnyConnect, Panel Websites, SSH and OpenVPN), traffic separation is done with <strong data-i18n=\"ssh_sni_domain_name_inside_ssl\">SNI (domain name inside SSL packet)</strong>. The main domain <code>vpn.kigaping.com</code> on port 443 is dedicated to the Cisco protocol (Cisco AnyConnect); So if you enter the SNI value of <code>vpn.kigaping.com</code> in the SSH client and connect to 443, the traffic will go to the Cisco server and give an authentication error (or 401)!",
        "elem_tab_ssh_48": "<strong data-i18n=\"ssh_protocol_type\">Protocol type:</strong> SSH (with SSL / TLS option enabled)",
        "elem_tab_ssh_49": "<strong data-i18n=\"ssh_port\">Port:</strong> <code>9443</code> or <code>2087</code> (cloudflare secure port)",
        "elem_tab_ssh_50": "<strong data-i18n=\"ssh_item_7\">Username and password:</strong> account created in the panel (or NPU / 123456)",
        "elem_tab_ssh_51": "<strong data-i18n=\"ssh_host_server\">Host (server):</strong> <code>vpn.kigaping.com</code> or <code>212.227.143.16</code>",
        "elem_tab_ssh_52": "<strong data-i18n=\"ssh_ssl_tls\">SSL/TLS tick:</strong> on (enabled)",
        "elem_tab_ssh_53": "<strong data-i18n=\"wg_port_2\">Port:</strong> <code>80</code> (without SSL) or <code>443</code> (with SSL) or <code>8088</code>",
        "elem_tab_ssh_54": "<strong data-i18n=\"ssh_path\">Path:</strong> <code>/ssh</code> or <code>/ws</code>",
        "elem_tab_ssh_55": "<strong data-i18n=\"ssh_ports\">Ports:</strong> <code>22</code> (standard) or <code>2053</code> (cloudflare) or <code>443</code>",
        "elem_tab_ssh_56": "<strong data-i18n=\"ssh_ssl_tls\">SSL/TLS tick:</strong> off (disabled)",
        "elem_tab_ssl_57": "Certificate path on server: <code id=\"ssl-cert-path\" style=\"background:#f1f5f9; padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono'; color:#334155;\">/etc/vpnpanel/ssl/panel.crt</code>",
        "elem_tab_ssl_58": "If you migrated from a Mikrotik router to this server, enter the <strong>Root CA</strong> certificate, server certificate and private key in the boxes below. With this, the digital identity of the server is exactly preserved and all your previous users and clients (for example, in <strong data-i18n=\"ssl_sstp_cisco_openvpn_ikev2\">SSTP, Cisco, OpenVPN or IKEv2</strong>) will connect immediately without the need to download a new file or change their devices.",
        "elem_tab_ssl_59": "Mikrotik CA Root Certificate (ca.crt): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_60": "Mikrotik server certificate (server.crt): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_61": "Server private key (server.key): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_62": "Server certificate text / Fullchain: <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_63": "Server Private Key: <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_64": "If you are not using a domain and want to connect to the panel directly by IP address, this option will generate a valid certificate with <strong>IP SAN (Subject Alternative Name)</strong> capability. After downloading the Root CA file and adding it to your device, the green lock icon will be displayed without any warning.",
        "elem_tab_ssl_65": "If the security certificate is already on the server, enter the absolute path to the <code>.crt</code> and <code>.key</code> files:",
        "elem_tab_system_66": "<span class=\"status-dot active\"></span> Checking...",
        "elem_tab_system_68": "Google BBR crowding algorithm together with fair queuing (FQ) reduces ping, packet loss and significantly increases download/upload speed in Iranian network.",
        "elem_tab_system_69": "<i data-lucide=\"check-circle\" style=\"width:13px; height:13px; vertical-align:middle; color:#059669; margin-left:4px;\"></i> <span data-i18n=\"awg_parameters\">parameters</span> <code>tcp_fastopen = 3</code>, <code>tcp_slow_start_after_idle = 0</code> and network buffers They will be permanently stored and activated in the Linux kernel.",
        "elem_tab_system_70": "This username and password are automatically registered and synchronized in <strong>FreeRADIUS</strong> core, <strong data-i18n=\"sys_cisco_ocserv\">Cisco service (OCServ)</strong>, <strong>IKEv2</strong>, <strong>L2TP</strong> and <strong>SSTP</strong> so that clients can connect with these specifications without having to define them separately in each protocol.",
        "elem_tab_tunnels_71": "<strong data-i18n=\"tunnels_how_dns_tunnel_works\">How DNS tunnel works:</strong> A dedicated NS record (eg <code>t.example.com</code>) points to this server's IP. The client sends its data to the server in random subdomains of standard DNS queries, and the answers are received in TXT Record format; As a result, the firewall does not see any trace of the VPN or proxy connection.",
        "elem_tab_tunnels_72": "<div style=\"font-weight: 700; color: #4338ca; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#4f46e5;\"></i>\n<span data-i18n=\"tunnels_gre_ipip_l2tp_ovpn_wg\">Standard Mikrotik tunnels (GRE, IPIP, L2TP, OVPN, WG):</span>\n</div>\n                    They can be used directly in Mikrotik routers. For stable networks and data centers where IP Protocol 47 (GRE) or 4 (IPIP) packets are not blocked, they have the highest transit speed and the lowest processing load.",
        "elem_tab_tunnels_73": "<div style=\"font-weight: 700; color: #047857; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#059669;\"></i>\n<span data-i18n=\"tunnels_websocket_tls_tunnels_gost_wstunnel\">Websocket and TLS tunnels (GOST, WSTunnel, RTT, Chisel):</span>\n</div>\n                    They switch tunnel traffic to standard WebSocket Encrypted (WSS) or TLS similar to normal websites. They can be passed behind a Cloudflare CDN or with the SNI of authorized domains so that the DPI filtering system is unable to identify the nature of the traffic.",
        "elem_tab_tunnels_74": "<div style=\"font-weight: 700; color: #b45309; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#d97706;\"></i>\n<span data-i18n=\"tunnels_converter_udp_packets_fake_tcp\">UDP packets converter to Fake TCP (UDP2Raw, Phantun):</span>\n</div>\n                    In networks where operators block or suffer severe packet loss of UDP packets and WireGuard, AmneziaWG and TUIC protocols put UDP packets inside a fake TCP handshake and prevent them from being blocked.",
        "elem_tab_tunnels_75": "<div style=\"font-weight: 700; color: #0369a1; margin-bottom: 4px; display:flex; align-items:center; gap:6px;\">\n<i data-lucide=\"check\" style=\"width:14px; height:14px; color:#0284c7;\"></i>\n<span data-i18n=\"tunnels_mikrotik_router_linux_port_forwarding\">Mikrotik router to Linux with port forwarding:</span>\n</div>\n                    You can connect the foreign server to the Iranian server with one of the anti-filter tools (such as GOST or RTT), and then deliver the traffic from the Iranian server to the Mikrotik router with GRE or L2TP so that users can access the free Internet without problems.",
        "elem_tab_wireguard_76": "💡 <strong data-i18n=\"wg_help\">Guide:</strong> After executing the above command in the client's system or phone, just put the line <code>Endpoint = 127.0.0.1:51820</code> in the Wireguard config file. All Wireguard traffic passes through Cloudflare's CDN securely.",

        "elem_modals_1": "<strong data-i18n=\"modal_item_25\">💡 Руководство по установке:</strong> Приведенные выше команды включают загрузку официального двоичного файла, создание постоянной службы Systemd и ее автоматический запуск после перезагрузки сервера.",
        "elem_modals_2": "Выбранный туннель: <strong id=\"scripts-modal-tun-name\" style=\"color:#0f172a; font-family:'JetBrains Mono';\">--</strong>\n                    (<span id=\"scripts-modal-tun-type\" style=\"color:#4f46e5; font-weight:700;\">--</span>)",
        "elem_modals_3": "<strong data-i18n=\"modal_item_27\">💡 Как использовать в Mikrotik:</strong> Просто откройте программное обеспечение WinBox, войдите в меню <strong>Новый терминал</strong> и вставьте приведенные выше коды, чтобы автоматически создать интерфейс, IP, брандмауэр и NAT маршрутизатора.",
        "elem_modals_4": "<strong data-i18n=\"login_title\">MH Panel</strong> — это корпоративный проект с открытым исходным кодом, разработанный для настройки, управления и оптимизации различных современных протоколов VPN, двунаправленных туннелей антифильтрации Linux, мультиплексора порта 443, системы аутентификации FreeRADIUS и автоматического создания кодов конфигурации маршрутизатора MikroTik (v6 и v7).",
        "elem_modals_5": "Текущий статус: <strong data-i18n=\"checking_status\" id=\"twofa-current-status\">Проверка...</strong>",
        "elem_modals_6": "Отсканируйте следующий штрих-код с помощью <strong>Google Authenticator</strong> или <strong>Microsoft Authenticator</strong>:",
        "elem_tab_amneziawg_7": "🛡️ Этот протокол обходит системы DPI операторов (Irancell, First Mobile, Telecom), скрывая заголовки рукопожатия (Handshake Obfuscation) и внедряя случайные поддельные пакеты (Junk Packets). Его можно использовать в официальных клиентах <strong>Amnezia VPN</strong> на Android, iOS, Windows и Linux.",
        "elem_tab_dns_tunnels_8": "Чтобы подключиться с помощью клиентского программного обеспечения (например, <strong>HTTP Custom</strong> и <strong>NapsternetV</strong> в Android), просто введите домен NS и указанный выше открытый ключ вместе с желаемым DoH. Для Windows и Linux:",
        "elem_tab_dns_tunnels_9": "<i data-lucid=\"zap\" style=\"width:14px; height:14px; color:#f59e0b;verter-align:middle;margin-left:4px;\"></i> <span data-i18n=\"col_proto\">протокол</span> <strong>Slipstream</strong> использует многопутевую архитектуру QUIC, заголовок которой на 60 % меньше, чем DNSTT, и имеет специальный контроль перегрузки для DNS-серверов ограничены по скорости.",
        "elem_tab_ikev2_10": "В протоколе IKEv2 все операционные системы (Windows, iPhone, Mac и Android) проверяют <strong data-i18n=\"ikev2_validity_trust_server_s_root\">действительность и надежность корневого сертификата сервера (Root CA)</strong> перед отправкой имени пользователя и пароля. Если сертификат не установлен или не является доверенным, соединение будет заблокировано перед этапом входа в систему (например, ошибка <code>13801</code> в Windows или ошибка <code>Ошибка аутентификации пользователя</code> на iPhone).\n                    Для удобства пользователей <strong data-i18n=\"ikev2_item_6\">скрипт автозапуска Windows</strong> и <strong data-i18n=\"ikev2_auto_apple_profile\">автопрофиль Apple</strong> размещены внизу страницы.",
        "elem_tab_ikev2_11": "Если вы используете выделенный домен (например, <code>mhpanel.kigaping.com</code>), введите его в поле ниже, чтобы для него был выдан действительный сертификат и установлен в идентификаторе сервера.",
        "elem_tab_ikev2_12": "Чтобы избежать ошибки <strong>Ошибка 13801</strong> и совместимости группы DH, следующий файл автоматически устанавливает сертификат CA в доверенный репозиторий Windows (доверенный корень) и подготавливает VPN-соединение:",
        "elem_tab_ikev2_13": "После загрузки щелкните файл правой кнопкой мыши и выберите <code>Запустить с помощью PowerShell</code>.",
        "elem_tab_ikev2_14": "<strong data-i18n=\"ikev2_item_3\">⚠️ Обязательное действие на iPhone после установки:</strong><br/>\n                            1. Перейдите в <code>Настройки -> Общие -> О программе</code>.<br/>\n                            2. Откройте <code>Настройки доверия сертификата</code>.<br/>\n                            3. Включите переключатель <code>MH Panel IKEv2 Root CA</code>.",
        "elem_tab_ikev2_15": "На Android с официальным приложением <strong>StrongSwan</strong> или встроенными настройками VPN для Android 12 и более поздних версий:",

        "elem_tab_ikev2_17": "Если включен режим <strong>EAP-RADIUS</strong>, глобальные пользователи RADIUS также автоматически получают доступ к IKEv2. Вы также можете создавать локальные учетные записи и загружать сертификаты для конкретных пользователей (.p12).",
        "elem_tab_l2tp_18": "Если эта функция включена, все пользователи, которых вы создали на вкладке <strong data-i18n=\"l2tp_internal_freeradius\">Внутренний FreeRADIUS</strong> панели, смогут подключаться к протоколу L2TP без необходимости создания нового пользователя или двойной настройки.",
        "elem_tab_l2tp_19": "<strong data-i18n=\"l2tp_windows_important_point_fixing_error\">Важный момент Windows (исправление ошибки 789/809):</strong>\n                    Если сервер или пользователь находится за NAT, Windows заблокирует соединение L2TP в соответствии со стандартом Microsoft по умолчанию. Приведенная выше команда powershell автоматически применяет значение реестра <code>AssumeUDPEncapsulationContextOnSendRule = 2</code>, чтобы соединение было установлено немедленно.",
        "elem_tab_mtproto_20": "Поддельный прокси-сервер с защитой от фильтрации TLS Telegram с официальной поддержкой спонсорских каналов (<span style=\"color:#0284c7; font-weight:600;\">@MTProxybot</span>), а также SAX и веб-прокси, подключенными к FreeRADIUS по всему миру.",
        "elem_tab_mtproto_21": "Напишите боту <code>@MTProxybot</code> в Telegram и отправьте команду <code>/newproxy</code>.",
        "elem_tab_mtproto_22": "Отправьте боту адрес <code>vpn.kigaping.com:4433</code> (или IP) и шестнадцатеричный секретный ключ.",
        "elem_tab_mtproto_23": "Выберите прокси в роботе командой <code>/myproxies</code> и привяжите свой канал с помощью <code>Установить продвижение</code>!",
        "elem_tab_multiplexer_24": "Все активные протоколы в разделе ниже будут отвечать одновременно на <strong data-i18n=\"mpx_item_5\">всех портах в списке ниже</strong>. Если, например, порт 443 заблокирован или отфильтрован, пользователи могут подключаться к тому же домену через альтернативные порты (например, 2087, 2096 или 9443) без каких-либо изменений на сервере.",
        "elem_tab_ocserv_25": "Если этот параметр включен, фильтрующие сканеры и любые запросы, отправленные без закрытого ключа, получат ошибку <strong data-i18n=\"ocserv_401_404_normal_web_page\">401 или 404 (обычная веб-страница)</strong>, а идентификатор Cisco останется полностью скрытым. Соединение устанавливается только путем добавления секретного адреса.",
        "elem_tab_ocserv_26": "<strong data-i18n=\"ocserv_special_advice_irancell_mobile_first\">Специальный совет для операторов Irancell и Mobile First:</strong> В условиях серьезных сбоев в работе Интернета операторы отбрасывают или ограничивают UDP-пакеты. Если <strong data-i18n=\"ocserv_uncheck_this_option\">снять этот флажок</strong>, OCServ переключится в чистый режим TCP, и весь трафик будет передаваться через стандартную безопасную платформу TLS 1.3, а прерыватель фильтра будет оставаться подключенным гораздо более стабильно.",
        "elem_tab_ocserv_27": "Чтобы подключиться к официальному приложению <strong>Cisco AnyConnect/Cisco Secure Client</strong> во всех операционных системах, введите следующий адрес без какого-либо префикса или расширения в программном обеспечении:",
        "elem_tab_ocserv_28": "• <strong data-i18n=\"ocserv_main_address_suggested\">Основной адрес (рекомендуется ⚡):</strong> <code>vpn.kigaping.com</code> или <code>vpn.kigaping.com:443</code> (он работает через стандартный порт 443, имеет действующий глобальный сертификат Let's Encrypt и полностью открыт для всех иранских операторов).<br/>\n                    • <strong data-i18n=\"ocserv_anti_filtering_mode\">Режим антифильтрации:</strong> трафик AnyConnect проходит через порт 443 как стандартный защищенный веб-трафик HTTPS (TLS 1.3) и не отслеживается.<br/>\n                    • <strong data-i18n=\"ocserv_note\">Примечание.</strong> Нет необходимости вводить порт в Cisco AnyConnect; Просто введите <code>vpn.kigaping.com</code>.",
        "elem_tab_openvpn_29": "В этой системе на сервере одновременно активны оба протокола: <strong data-i18n=\"ovpn_udp_fast_gaming_streaming\">UDP (быстрый для игр и потоковой передачи)</strong> и <strong data-i18n=\"ovpn_tcp_stable_disruption_blocking_time\">TCP (стабильный по времени сбоев и блокировки)</strong>. Все пользователи аутентифицируются непосредственно из глобальной базы данных <strong>FreeRADIUS</strong> (включая пользователя <code>NPU</code> по умолчанию) без необходимости переопределения, а полный файл <code>.ovpn</code>, включая ключи сервера, доступен непосредственно внизу страницы.",
        "elem_tab_openvpn_30": "Если вы используете собственный домен, например <code>kigaping.com</code>, введите его и подайте заявку на обновление идентификатора сервера.",
        "elem_tab_openvpn_32": "Установите официальное приложение <strong>OpenVPN Connect</strong> из Google Play или App Store и импортируйте в него скачанный файл <code>.ovpn</code>:",
        "elem_tab_openvpn_33": "<span data-i18n=\"ovpn_2_we_use\">2. Введите имя пользователя</span> <code>NPU</code> и пароль <code>56226500</code> и нажмите «Подключиться».",
        "elem_tab_openvpn_34": "В Windows с официальным программным обеспечением <strong>OpenVPN GUI</strong> и в Mac OS с программным обеспечением <strong>Tunnelblick</strong>:",
        "elem_tab_openvpn_35": "<span data-i18n=\"ovpn_item_21\">1. Поместите файл <code>.ovpn</code> в папку <code>config</code> клиента.",
        "elem_tab_openvpn_36": "Однострочное выполнение без необходимости графического интерфейса с пакетом <code>openvpn</code>:",
        "elem_tab_openvpn_37": "Прямое управление учетными записями OpenVPN и FreeRADIUS. Создание нового пользователя, контроль потребления и прямая загрузка готового файла <code>.ovpn</code> без необходимости заходить в публичный раздел пользователей.",

        "elem_tab_radius_43": "<span class=\"status-dot active\"></span> Служба FreeRADIUS активна и готова",

        "elem_tab_ssh_45": "Подходит для подключения из Cloudflare, Arvancloud и портов 80 и 443 с путями <code>/ssh</code> и <code>/ws</code>.",
        "elem_tab_ssh_46": "Доступ пользователя: <strong data-i18n=\"ssh_saks_5_safe_without_shell\">Sax 5 безопасно (без корневой оболочки)</strong>",
        "elem_tab_ssh_47": "На порту 443 из-за одновременного использования нескольких протоколов (Cisco AnyConnect, Panel Websites, SSH и OpenVPN) разделение трафика осуществляется с помощью <strong data-i18n=\"ssh_sni_domain_name_inside_ssl\">SNI (имя домена внутри SSL-пакета)</strong>. Основной домен <code>vpn.kigaping.com</code> на порту 443 выделен для протокола Cisco (Cisco AnyConnect); Поэтому, если вы введете значение SNI <code>vpn.kigaping.com</code> в SSH-клиенте и подключитесь к 443, трафик пойдет на сервер Cisco и выдаст ошибку аутентификации (или 401)!",

        "elem_tab_ssh_51": "<strong data-i18n=\"ssh_host_server\">Хост (сервер):</strong> <code>vpn.kigaping.com</code> или <code>212.227.143.16</code>",
        "elem_tab_ssh_52": "<strong data-i18n=\"ssh_ssl_tls\">Отметка SSL/TLS:</strong> включена (включена)",
        "elem_tab_ssh_53": "<strong data-i18n=\"wg_port_2\">Порт:</strong> <code>80</code> (без SSL) или <code>443</code> (с SSL) или <code>8088</code>",
        "elem_tab_ssh_54": "<strong data-i18n=\"ssh_path\">Путь:</strong> <code>/ssh</code> или <code>/ws</code>",
        "elem_tab_ssh_55": "<strong data-i18n=\"ssh_ports\">Порты:</strong> <code>22</code> (стандартный) или <code>2053</code> (cloudflare) или <code>443</code>",
        "elem_tab_ssh_56": "<strong data-i18n=\"ssh_ssl_tls\">Отметка SSL/TLS:</strong> выключена (отключена)",
        "elem_tab_ssl_57": "Путь сертификата на сервере: <code id=\"ssl-cert-path\" style=\"background:#f1f5f9; padding:2px 6px; border-radius:4px; font-family:'JetBrains Mono'; color:#334155;\">/etc/vpnpanel/ssl/panel.crt</code>",
        "elem_tab_ssl_58": "Если вы мигрировали с маршрутизатора Mikrotik на этот сервер, введите сертификат <strong>Root CA</strong>, сертификат сервера и закрытый ключ в полях ниже. При этом цифровая идентичность сервера точно сохраняется, и все ваши предыдущие пользователи и клиенты (например, в <strong data-i18n=\"ssl_sstp_cisco_openvpn_ikev2\">SSTP, Cisco, OpenVPN или IKEv2</strong>) подключатся сразу без необходимости загружать новый файл или менять свои устройства.",
        "elem_tab_ssl_59": "Корневой сертификат центра сертификации Mikrotik (ca.crt): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_60": "Сертификат сервера Mikrotik (server.crt): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_61": "Закрытый ключ сервера (server.key): <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_62": "Текст сертификата сервера / Fullchain: <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_63": "Закрытый ключ сервера: <span style=\"color:#ef4444;\">*</span>",
        "elem_tab_ssl_64": "Если вы не используете домен и хотите подключиться к панели напрямую по IP-адресу, эта опция создаст действительный сертификат с возможностью <strong>IP SAN (альтернативное имя субъекта)</strong>. После загрузки файла корневого центра сертификации и добавления его на ваше устройство значок зеленого замка будет отображаться без какого-либо предупреждения.",
        "elem_tab_ssl_65": "Если сертификат безопасности уже находится на сервере, введите абсолютный путь к файлам <code>.crt</code> и <code>.key</code>:",
        "elem_tab_system_66": "<span class=\"status-dot active\"></span> Проверка...",
        "elem_tab_system_68": "Алгоритм группировки Google BBR вместе с справедливой организацией очередей (FQ) снижает пинг, потерю пакетов и значительно увеличивает скорость загрузки/выгрузки в иранской сети.",
        "elem_tab_system_69": "<i data-lucid=\"check-circle\" style=\"width:13px; height:13px;вертикальное выравнивание:middle; цвет:#059669;margin-left:4px;\"></i> <span data-i18n=\"awg_parameters\">параметры</span> <code>tcp_fastopen = 3</code>, <code>tcp_slow_start_after_idle = 0</code> и сетевые буферы. Они будут постоянно храниться и активироваться в ядре Linux.",
        "elem_tab_system_70": "Это имя пользователя и пароль автоматически регистрируются и синхронизируются в ядре <strong>FreeRADIUS</strong>, <strong data-i18n=\"sys_cisco_ocserv\">службе Cisco (OCServ)</strong>, <strong>IKEv2</strong>, <strong>L2TP</strong> и <strong>SSTP</strong>, чтобы клиенты могли подключаться с этими спецификациями без необходимости определять их отдельно в каждом протоколе.",
        "elem_tab_tunnels_71": "<strong data-i18n=\"tunnels_how_dns_tunnel_works\">Как работает DNS-туннель:</strong> Выделенная запись NS (например, <code>t.example.com</code>) указывает на IP-адрес этого сервера. Клиент отправляет свои данные на сервер в случайных поддоменах стандартных DNS-запросов, а ответы получает в формате TXT Record; В результате брандмауэр не видит никаких следов VPN или прокси-подключения.",
        "elem_tab_tunnels_72": "<div style=\"font-weight: 700; цвет: #4338ca; маржа-дно: 4 пикселя; дисплей: flex; выравнивание-элементы: центр; разрыв: 6 пикселей;\">\n<i data-lucid=\"check\" style=\"width:14px; height:14px; color:#4f46e5;\"></i>\n<span data-i18n=\"tunnels_gre_ipip_l2tp_ovpn_wg\">Стандартные туннели Mikrotik (GRE, IPIP, L2TP, OVPN, WG):</span>\n</div>\n                    Их можно использовать непосредственно в роутерах Mikrotik. Для стабильных сетей и центров обработки данных, где пакеты IP-протокола 47 (GRE) или 4 (IPIP) не блокируются, они имеют самую высокую скорость передачи и самую низкую нагрузку на обработку.",
        "elem_tab_tunnels_73": "<div style=\"font-weight: 700; цвет: #047857; маржа-дно: 4 пикселя; дисплей: flex; выравнивание-элементы: центр; разрыв: 6 пикселей;\">\n<i data-lucid=\"check\" style=\"width:14px; height:14px; color:#059669;\"></i>\n<span data-i18n=\"tunnels_websocket_tls_tunnels_gost_wstunnel\">Туннели Websocket и TLS (ГОСТ, WSTunnel, RTT, Chisel):</span>\n</div>\n                    Они переключают туннельный трафик на стандартное шифрование WebSocket (WSS) или TLS, аналогично обычным веб-сайтам. Их можно передавать через CDN Cloudflare или с помощью SNI авторизованных доменов, чтобы система фильтрации DPI не могла определить характер трафика.",
        "elem_tab_tunnels_74": "<div style=\"font-weight: 700; цвет: #b45309; маржа-дно: 4 пикселя; дисплей: flex; выравнивание-элементы: центр; разрыв: 6 пикселей;\">\n<i data-lucid=\"check\" style=\"width:14px; height:14px; color:#d97706;\"></i>\n<span data-i18n=\"tunnels_converter_udp_packets_fake_tcp\">Конвертер пакетов UDP в поддельный TCP (UDP2Raw, Phantun):</span>\n</div>\n                    В сетях, где операторы блокируют или серьезно теряют пакеты UDP и протоколы WireGuard, AmneziaWG и TUIC, помещают пакеты UDP в фальшивое TCP-квитирование и предотвращают их блокировку.",
        "elem_tab_tunnels_75": "<div style=\"font-weight: 700; цвет: #0369a1; маржа-дно: 4 пикселя; дисплей: flex; выравнивание-элементы: центр; разрыв: 6 пикселей;\">\n<i data-lucid=\"check\" style=\"width:14px; height:14px; color:#0284c7;\"></i>\n<span data-i18n=\"tunnels_mikrotik_router_linux_port_forwarding\">Маршрутизатор Mikrotik для Linux с переадресацией портов:</span>\n</div>\n                    Вы можете подключить чужой сервер к иранскому серверу с помощью одного из инструментов антифильтрации (например, ГОСТ или RTT), а затем доставить трафик с иранского сервера на маршрутизатор Mikrotik с помощью GRE или L2TP, чтобы пользователи могли без проблем получить доступ к бесплатному Интернету.",
        "elem_tab_wireguard_76": "💡 <strong data-i18n=\"wg_help\">Руководство:</strong> После выполнения указанной выше команды в системе или телефоне клиента просто добавьте строку <code>Endpoint = 127.0.0.1:51820</code> в файл конфигурации Wireguard. Весь трафик Wireguard безопасно проходит через CDN Cloudflare.",

    // Build ultra-fast bidirectional lookup maps
    window._i18nMaps = { fa: new Map(), en: new Map(), ru: new Map() };
    const trans = window.I18N_TRANSLATIONS || {};
    for (const [l, d] of Object.entries(trans)) {
        const m = window._i18nMaps[l];
        for (const [k, v] of Object.entries(d)) {
            if (typeof v === "string") {
                m.set(v, k);
                const norm = v.trim().replace(/\u200c/g, " ").replace(/\s+/g, " ");
                if (norm !== v) m.set(norm, k);
            }
        }
    }
})();

window.t = function(keyOrText, fallback = "") {
    if (!keyOrText) return "";
    const lang = localStorage.getItem("panel_language") || "fa";
    const dict = (window.I18N_TRANSLATIONS && window.I18N_TRANSLATIONS[lang]) || {};
    const faDict = (window.I18N_TRANSLATIONS && window.I18N_TRANSLATIONS.fa) || {};
    const enDict = (window.I18N_TRANSLATIONS && window.I18N_TRANSLATIONS.en) || {};
    const maps = window._i18nMaps || {};

    // 1. Direct key match in target dictionary
    if (dict[keyOrText] !== undefined) return dict[keyOrText];

    const clean = typeof keyOrText === "string" ? keyOrText.trim() : keyOrText;
    const norm = typeof keyOrText === "string" ? clean.replace(/\u200c/g, " ").replace(/\s+/g, " ") : keyOrText;

    if (lang === "fa") {
        // If English text was passed in Persian mode, reverse lookup in EN map
        const enMap = maps.en;
        let k = enMap ? (enMap.get(clean) || enMap.get(norm)) : null;
        if (k && faDict[k]) return faDict[k];
        if (faDict[keyOrText] !== undefined) return faDict[keyOrText];
        return fallback || keyOrText;
    }

    // Target is EN or RU:
    // If Persian text was passed, reverse lookup in FA map
    const faMap = maps.fa;
    let k = faMap ? (faMap.get(clean) || faMap.get(norm)) : null;
    if (k && dict[k]) return dict[k];
    if (k && enDict[k]) return enDict[k];

    // If English text was passed in Russian mode
    if (lang === "ru") {
        const enMap = maps.en;
        let ek = enMap ? (enMap.get(clean) || enMap.get(norm)) : null;
        if (ek && dict[ek]) return dict[ek];
    }

    // Direct key match in English fallback
    if (enDict[keyOrText] !== undefined) return enDict[keyOrText];

    return fallback || keyOrText;
};
