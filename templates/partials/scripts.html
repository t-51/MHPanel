    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // --- Dark / Light Theme Engine ---
    function initTheme() {
        const savedTheme = localStorage.getItem("panel_theme") || "dark";
        applyTheme(savedTheme);
    }

    function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
            document.documentElement.classList.add("dark-mode");
            if (document.body) document.body.classList.add("dark-mode");
        } else {
            document.documentElement.classList.remove("dark-mode");
            if (document.body) document.body.classList.remove("dark-mode");
        }
        localStorage.setItem("panel_theme", theme);

        const headerIcon = document.getElementById("header-theme-icon");
        if (headerIcon) {
            headerIcon.setAttribute("data-lucide", theme === "dark" ? "sun" : "moon");
        }
        const loginIcon = document.getElementById("login-theme-icon");
        if (loginIcon) {
            loginIcon.setAttribute("data-lucide", theme === "dark" ? "sun" : "moon");
        }
        if (typeof updateChartsTheme === "function") {
            updateChartsTheme(theme);
        }
        if (typeof lucide !== "undefined") {
            lucide.createIcons();
        }
    }

    function toggleTheme() {
        const cur = document.documentElement.getAttribute("data-theme") || (document.documentElement.classList.contains("dark-mode") ? "dark" : "light");
        const next = cur === "dark" ? "light" : "dark";
        applyTheme(next);
    }

    function updateChartsTheme(theme) {
        const isDark = (theme === "dark");
        const tickColor = isDark ? "#94a3b8" : "#475569";
        const gridColor = isDark ? "rgba(255, 255, 255, 0.08)" : "rgba(226, 232, 240, 0.8)";
        const labelColor = isDark ? "#f8fafc" : "#0f172a";

        [usageChart, bandwidthChart].forEach(chart => {
            if (!chart) return;
            if (chart.options && chart.options.scales && chart.options.scales.y) {
                if (chart.options.scales.y.ticks) chart.options.scales.y.ticks.color = tickColor;
                if (chart.options.scales.y.grid) chart.options.scales.y.grid.color = gridColor;
            }
            if (chart.options && chart.options.plugins && chart.options.plugins.legend && chart.options.plugins.legend.labels) {
                chart.options.plugins.legend.labels.color = labelColor;
            }
            chart.update();
        });
    }

            if (bandwidthChart.data.datasets[1]) bandwidthChart.data.datasets[1].label = tTx;
            bandwidthChart.update();
        }
    }

    let _isTranslating = false;

    function translateDom(root, lang) {
        if (!root || lang === "fa") return;
        const dict = (window.I18N_TRANSLATIONS && window.I18N_TRANSLATIONS[lang]) || {};
        const replacements = DYNAMIC_REPLACEMENTS[lang] || [];

        if (root.querySelectorAll) {
            root.querySelectorAll("[data-i18n]").forEach(el => {
                const k = el.getAttribute("data-i18n");
                if (dict[k]) {
                    if (el.children.length === 0) {
                        if (el.textContent !== dict[k]) el.textContent = dict[k];
                    } else {
                        const textSpan = el.querySelector(".i18n-text") || el.querySelector("span:not([class*='icon']):not([class*='dot']):not([class*='badge'])");
                        if (textSpan) {
                            if (textSpan.textContent !== dict[k]) textSpan.textContent = dict[k];
                        } else {
                            for (let node of el.childNodes) {
                                if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0) {
                                    if (node.textContent !== (" " + dict[k])) {
                                        node.textContent = " " + dict[k];
                                    }
                                    break;
                                }
                            }
                        }
                    }
                }
            });

            root.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const k = el.getAttribute("data-i18n-placeholder");
                if (dict[k] && el.placeholder !== dict[k]) el.placeholder = dict[k];
            });

            root.querySelectorAll("[data-i18n-title]").forEach(el => {
                const k = el.getAttribute("data-i18n-title");
                if (dict[k] && el.title !== dict[k]) el.title = dict[k];
            });
        }

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
        let node;
        const textNodes = [];
        while (node = walker.nextNode()) {
            const p = node.parentElement;
            if (!p || ['SCRIPT', 'STYLE', 'CODE', 'PRE', 'TEXTAREA'].includes(p.tagName)) continue;
            if (p.hasAttribute('data-i18n') || p.hasAttribute('data-i18n-html')) continue;
            const txt = node.textContent;
            if (txt && /[\u0600-\u06FF]/.test(txt)) {
                textNodes.push(node);
            }
        }

        for (let tn of textNodes) {
            let content = tn.textContent;
            const clean = content.trim();

            if (typeof window.t === "function") {
                const fullTrans = window.t(clean);
                if (fullTrans && fullTrans !== clean) {
                    tn.textContent = content.replace(clean, fullTrans);
                    continue;
                }
            }

            let updated = content;
            for (const [re, rep] of replacements) {
                updated = updated.replace(re, rep);
            }
            if (updated !== content) {
                tn.textContent = updated;
            }
        }
    }

    let _transObserverTimeout = null;
    const i18nObserver = new MutationObserver((mutations) => {
        if (_isTranslating) return;
        const currentLang = localStorage.getItem("panel_language") || "fa";
        if (currentLang === "fa") return;
        let hasNewNodes = false;
        for (const m of mutations) {
            if (m.addedNodes && m.addedNodes.length > 0) {
                for (let i = 0; i < m.addedNodes.length; i++) {
                    const node = m.addedNodes[i];
                    if (node.nodeType === Node.ELEMENT_NODE || (node.nodeType === Node.TEXT_NODE && /[\u0600-\u06FF]/.test(node.textContent))) {
                        hasNewNodes = true;
                        break;
                    }
                }
            }
            if (hasNewNodes) break;
        }
        if (hasNewNodes) {
            clearTimeout(_transObserverTimeout);
            _transObserverTimeout = setTimeout(() => {
                if (_isTranslating) return;
                _isTranslating = true;
                try {
                    const mainEl = document.querySelector(".main-content") || document.body;
                    translateDom(mainEl, currentLang);
                    document.querySelectorAll(".modal.active, .modal-box, .toast").forEach(el => translateDom(el, currentLang));
                } catch (e) {
                    console.error("Translation observer error:", e);
                } finally {
                    _isTranslating = false;
                }
            }, 60);
        }
    });

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
            const mc = document.querySelector(".main-content") || document.body;
            if (mc) i18nObserver.observe(mc, { childList: true, subtree: true });
        });
    } else {
        const mc = document.querySelector(".main-content") || document.body;
        if (mc) i18nObserver.observe(mc, { childList: true, subtree: true });
    }

    function applyLanguage(lang) {
        if (!I18N_TRANSLATIONS[lang]) lang = "fa";
        _isTranslating = true;
        try {
            document.documentElement.dir = (lang === "fa" ? "rtl" : "ltr");
            document.documentElement.lang = lang;

            // Sync all language selectors
            ["lang-select", "login-lang-select", "settings-lang-select"].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = lang;
            });

            // Sync header language pills
            document.querySelectorAll(".lang-pill").forEach(pill => {
                if (pill.getAttribute("data-lang") === lang) {
                    pill.classList.add("active");
                } else {
                    pill.classList.remove("active");
                }
            });

            // Sync visual settings language choice buttons
            document.querySelectorAll(".lang-choice-btn").forEach(btn => {
                if (btn.getAttribute("data-lang") === lang) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });

            const dict = I18N_TRANSLATIONS[lang];
            // HTML elements
            document.querySelectorAll("[data-i18n-html]").forEach(el => {
                const key = el.getAttribute("data-i18n-html");
                if (dict && dict[key]) {
                    el.innerHTML = dict[key];
                }
            });

            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (dict[key]) {
                    if (el.children.length === 0) {
                        el.textContent = dict[key];
                    } else {
                        const textSpan = el.querySelector(".i18n-text") || el.querySelector("span:not([class*='icon']):not([class*='dot']):not([class*='badge'])");
                        if (textSpan) {
                            textSpan.textContent = dict[key];
                        } else {
                            // preserve icon child nodes, update text node
                            let replaced = false;
                            for (let node of el.childNodes) {
                                if (node.nodeType === Node.TEXT_NODE && node.textContent.trim().length > 0) {
                                    node.textContent = " " + dict[key];
                                    replaced = true;
                                    break;
                                }
                            }
                            if (!replaced) el.textContent = dict[key];
                        }
                    }
                }
            });

            // Placeholders and Titles
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (dict[key]) el.placeholder = dict[key];
            });
            document.querySelectorAll("[data-i18n-title]").forEach(el => {
                const key = el.getAttribute("data-i18n-title");
                if (dict[key]) el.title = dict[key];
            });

            // Dynamic chart & component re-renders
            if (typeof updateChartsLanguage === "function") {
                updateChartsLanguage(lang);
            }
            if (typeof renderProtocolsCards === "function" && typeof loadedProtocolsData !== "undefined" && loadedProtocolsData.length) {
                renderProtocolsCards();
            }
            if (typeof renderSecLogsFiltered === "function") {
                renderSecLogsFiltered();
            }
            if (typeof latestStats !== "undefined" && latestStats) {
                if (typeof updateHardwareSpecs === "function" && latestStats.system_info) updateHardwareSpecs(latestStats.system_info);
                if (typeof updatePerCoreWorkload === "function" && latestStats.system_info && latestStats.system_info.cpu) updatePerCoreWorkload(latestStats.system_info.cpu);
                if (typeof updateProtocolTraffic === "function" && latestStats.protocol_traffic) updateProtocolTraffic(latestStats.protocol_traffic);
            }

            if (typeof renderSSLStatus === "function" && window.lastSSLData) {
                renderSSLStatus(window.lastSSLData);
            }

            if (lang !== "fa") {
                translateDom(document.querySelector(".main-content") || document.body, lang);
                document.querySelectorAll(".modal.active, .modal-box, .toast").forEach(el => translateDom(el, lang));
            } else {
                const activeTab = localStorage.getItem("active_tab") || "overview";
                if (activeTab === "ssh" && typeof fetchSshClients === "function") fetchSshClients();
                else if (activeTab === "openvpn" && typeof fetchOvpnClients === "function") fetchOvpnClients();
                else if (activeTab === "wireguard" && typeof fetchWireGuardClients === "function") fetchWireGuardClients();
                else if (activeTab === "amneziawg" && typeof fetchAmneziaWGClients === "function") fetchAmneziaWGClients();
                else if (activeTab === "radius" && typeof fetchRadiusUsers === "function") fetchRadiusUsers();
                else if (activeTab === "mtproto" && typeof fetchMtprotoInstances === "function") fetchMtprotoInstances();
                else if (activeTab === "tuic" && typeof fetchTuicConfig === "function") fetchTuicConfig();

    // Toast Helper
    function showToast(message, type = "info") {
        const toast = document.getElementById("toast-notify");
        const icon = document.getElementById("toast-icon");
        const text = document.getElementById("toast-message");
        
        toast.className = "toast active " + type;
        const transMsg = (typeof window.t === "function") ? window.t(message, message) : message;
        text.innerText = transMsg;
        
        let iconName = "info";
        if (type === "success") iconName = "check-circle";
        if (type === "error") iconName = "alert-triangle";
        
        if (typeof lucide !== 'undefined') {
            icon.setAttribute("data-lucide", iconName);
            lucide.createIcons();
        }

        setTimeout(() => {
            toast.classList.remove("active");
        }, 4000);
    }

    function toggleLoading(show, text = "Loading...") {
        const overlay = document.getElementById("loading-overlay");
        const overlayText = document.getElementById("loading-text");
        overlayText.innerText = (text && typeof window.t === "function") ? window.t(text, text) : (text || "Loading...");

    // Handle Login
    const loginForm = document.getElementById("login-form");
    if (loginForm) {
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById("username-input");
            const passwordInput = document.getElementById("password-input");
            const errDiv = document.getElementById("login-error");
            const loginBtn = document.getElementById("login-btn");
            
            const username = (usernameInput?.value || "").trim();
            const password = passwordInput?.value || "";

            if (!username || !password) {
                if (errDiv) {
                    errDiv.innerText = "لطفاً نام کاربری و رمز عبور را وارد فرمایید.";
                    errDiv.style.display = "block";
                }
                return;
            }

            if (errDiv) errDiv.style.display = "none";
            const originalBtnHtml = loginBtn ? loginBtn.innerHTML : "";
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i data-lucide="loader-2" class="btn-icon spin" style="width:16px; height:16px;"></i> <span>در حال بررسی و ورود...</span>';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
            
            const totpInput = document.getElementById("totp-input");
            const totpCode = (totpInput?.value || "").trim();

            const payload = { username, password };
            if (totpCode) {
                payload.totp_code = totpCode;
            }
            
            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(() => ({}));

                if (res.ok && data.require_2fa) {
                    const twofaGroup = document.getElementById("login-2fa-group");
                    if (twofaGroup) twofaGroup.style.display = "block";
                    if (totpInput) {
                        totpInput.focus();
                    }
                    if (errDiv) {
                        errDiv.innerText = "کد ۶ رقمی نرم‌افزار Authenticator را وارد نمایید.";
                        errDiv.style.color = "var(--color-primary)";
                        errDiv.style.display = "block";
                    }
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<i data-lucide="shield-check" class="btn-icon" style="width:16px; height:16px;"></i> <span>تایید کد و ورود</span>';
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                    return;
                }

                if (res.ok && data.success) {
                    if (loginBtn) {
                        loginBtn.innerHTML = '<i data-lucide="check" class="btn-icon" style="width:16px; height:16px;"></i> <span>ورود موفق!</span>';
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                    setTimeout(() => {
                        window.location.reload();
                    }, 200);
                } else {
                    if (errDiv) {
                        errDiv.innerText = data.error || "نام کاربری یا رمز عبور اشتباه است.";
                        errDiv.style.color = "var(--color-rose)";
                        errDiv.style.display = "block";
                    }
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnHtml;
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    }
                }
            } catch (err) {
                if (errDiv) {
                    errDiv.innerText = "خطا در برقراری ارتباط با سرور: " + (err.message || "");
                    errDiv.style.display = "block";
                }
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnHtml;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
                showToast("خطا در برقراری ارتباط با سرور", "error");
            }
        });
    }

    // Helper format bytes
    function formatBytes(bytes, decimals = 2) {
        if (!bytes || bytes <= 0) return '0 B';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function copyToClipboard(text, successMsg = "کپی شد") {
        if (typeof window.t === "function") successMsg = window.t(successMsg);
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg, "success");
            }).catch(() => {
                fallbackCopy(text, successMsg);
            });
        } else {
            fallbackCopy(text, successMsg);
        }
    }

    function fallbackCopy(text, successMsg) {
        const el = document.createElement("textarea");
        el.value = text;
        document.body.appendChild(el);
        el.select();
        try {
            document.execCommand("copy");
            showToast(successMsg, "success");
        } catch(e) {}
        document.body.removeChild(el);
    }

    // Update Hardware & OS Specs
    function updateHardwareSpecs(info) {
        if (!info) return;
        const os = info.os || {};
        const cpu = info.cpu || {};
        const ram = info.ram || {};
        const lang = localStorage.getItem("panel_language") || "fa";

        const osEl = document.getElementById("spec-os-val");
        if (osEl && os.distro) osEl.innerText = os.distro;

        const kernelEl = document.getElementById("spec-kernel-val");
        const kLabel = (lang === "fa" ? "کرنل" : (lang === "ru" ? "Ядро" : "Kernel"));
        if (kernelEl && os.kernel) kernelEl.innerText = `${kLabel}: ${os.kernel} | ${os.arch || "x86_64"}`;

        const uptimeEl = document.getElementById("spec-uptime-val");
        if (uptimeEl && os.uptime) uptimeEl.innerText = os.uptime;

        const coresEl = document.getElementById("spec-cores-val");
        if (coresEl) {
            coresEl.removeAttribute("data-i18n");

            const logi = cpu.logical_cores || phys;
            const cStr = (lang === "fa" ? `${logi} هسته پردازشی (${phys} هسته فیزیکی)` : (lang === "ru" ? `${logi} лог. ядер (${phys} физ. ядер)` : `${logi} Logical Cores (${phys} Physical)`));

        }

        const modelEl = document.getElementById("spec-model-val");
        if (modelEl && cpu.model) modelEl.innerText = cpu.model;

        const freqEl = document.getElementById("spec-freq-val");
        if (freqEl && cpu.freq_ghz) freqEl.innerText = cpu.freq_ghz;

        const bogoEl = document.getElementById("spec-bogo-val");
        if (bogoEl && cpu.bogomips) bogoEl.innerText = `BogoMIPS: ${cpu.bogomips}`;

        const ramTotalEl = document.getElementById("spec-ram-total-val");
        if (ramTotalEl && ram.total) {
            const totGb = (ram.total / (1024 ** 3)).toFixed(1);
            ramTotalEl.innerText = `${totGb} GB (${ram.percent || 0}%)`;
        }

        const ramStatusEl = document.getElementById("spec-ram-status-val");
        if (ramStatusEl) {
            ramStatusEl.removeAttribute("data-i18n");
            const usedGb = (ram.used / (1024 ** 3)).toFixed(1);
            const availGb = (ram.available / (1024 ** 3)).toFixed(1);
            const rUsed = (lang === "fa" ? "مصرفی" : (lang === "ru" ? "Использовано" : "Used"));

    function updateSecurityLogs(secData) {
        if (!secData) return;
        const lang = localStorage.getItem("panel_language") || "fa";
        const locale = (lang === "fa" ? "fa-IR" : (lang === "ru" ? "ru-RU" : "en-US"));
        
        const totBannedEl = document.getElementById("sec-total-banned-val");
        if (totBannedEl && secData.total_banned !== undefined) {
            totBannedEl.innerText = Number(secData.total_banned).toLocaleString(locale);
        }

        const curBannedEl = document.getElementById("sec-current-banned-val");
        if (curBannedEl && secData.currently_banned !== undefined) {
            curBannedEl.innerText = Number(secData.currently_banned).toLocaleString(locale);
        }

        const failEl = document.getElementById("sec-failed-attempts-val");
        if (failEl && secData.total_failed !== undefined) {
            failEl.innerText = Number(secData.total_failed).toLocaleString(locale);
        }

        if (secData.events && Array.isArray(secData.events)) {
            window.allSecEvents = secData.events;
            renderSecLogsFiltered();
        }
    }

    function renderSecLogsFiltered() {
        const streamEl = document.getElementById("sec-log-stream");
        if (!streamEl) return;
        const lang = localStorage.getItem("panel_language") || "fa";

        let filtered = window.allSecEvents;
        if (window.currentSecFilter === "ban") {
            filtered = window.allSecEvents.filter(e => e.type === "ban");
        } else if (window.currentSecFilter === "threat") {
            filtered = window.allSecEvents.filter(e => e.type === "threat" || e.type === "auth_fail");
        }

        const tEmptySec = (lang === "fa" ? "هیچ رویدادی در این فیلتر ثبت نشده است. سپر امنیتی بدون مشکل در حال فعالیت است." : (lang === "ru" ? "В этом фильтре нет событий. Защита работает в штатном режиме." : "No security events recorded in this filter. Shield is operating normally."));

        if (!filtered || filtered.length === 0) {
            streamEl.innerHTML = `<div style="color: #64748b; text-align: center; padding: 30px 0;">${tEmptySec}</div>`;
            return;
        }

        const tAttackBlocked = (lang === "fa" ? "حمله تخریبی مسدود شد" : (lang === "ru" ? "Атака заблокирована" : "Attack Blocked"));
        const tThreatDetected = (lang === "fa" ? "تلاش نفوذ رصد شد" : (lang === "ru" ? "Попытка вторжения" : "Intrusion Detected"));
        const tFailedAuth = (lang === "fa" ? "تلاش ناموفق ورود" : (lang === "ru" ? "Неудачный вход" : "Failed Login"));
        const tCopyIp = (lang === "fa" ? "کپی آی‌پی" : (lang === "ru" ? "Копировать IP" : "Copy IP"));

        let html = "";
        filtered.forEach(ev => {
            let tagBadge = "";
            if (ev.type === "ban") {
                tagBadge = `<span class="sec-tag sec-tag-critical"><i data-lucide="shield-alert" style="width:12px; height:12px;"></i> ${tAttackBlocked}</span>`;
            } else if (ev.type === "threat") {
                tagBadge = `<span class="sec-tag sec-tag-warning"><i data-lucide="alert-triangle" style="width:12px; height:12px;"></i> ${tThreatDetected}</span>`;
            } else {
                tagBadge = `<span class="sec-tag sec-tag-info"><i data-lucide="info" style="width:12px; height:12px;"></i> ${tFailedAuth}</span>`;
            }

            const ipChip = ev.ip ? `
                <span class="sec-ip-chip" onclick="copyToClipboard('${ev.ip}', '${ev.ip}')" title="${tCopyIp}">
                    <i data-lucide="copy" style="width:10px; height:10px;"></i>
                    ${ev.ip}
                </span>
            ` : "";

            html += `
                <div class="sec-event-row">
                    <div class="sec-event-main">
                        ${tagBadge}
                        ${ipChip}
                        <span class="sec-event-desc" title="${ev.message || ""}">${ev.message || ev.title}</span>
                    </div>
                    <span class="sec-event-time">${ev.time}</span>
                </div>
            `;
        });

        streamEl.innerHTML = html;
        if (typeof lucide !== "undefined") lucide.createIcons();
    }

    // Fetch metrics stats
    async function fetchStats() {
        try {
            const res = await fetch("/api/stats");
            if (!res.ok) return;
            const data = await res.json();
            latestStats = data;
            
            document.getElementById("cpu-val").innerText = Math.round(data.cpu) + " %";
            
            const ramUsedGb = (data.ram.used / (1024 ** 3)).toFixed(1);
            const ramTotalGb = (data.ram.total / (1024 ** 3)).toFixed(1);
            document.getElementById("ram-val").innerText = data.ram.percent + " %";
            document.getElementById("ram-meta").innerText = `${ramUsedGb} GB / ${ramTotalGb} GB`;
            
            const diskUsedGb = (data.disk.used / (1024 ** 3)).toFixed(1);
            const diskTotalGb = (data.disk.total / (1024 ** 3)).toFixed(1);
            document.getElementById("disk-val").innerText = data.disk.percent + " %";
            document.getElementById("disk-meta").innerText = `${diskUsedGb} GB / ${diskTotalGb} GB`;
            
            const currentRecv = data.network.bytes_recv;
            const currentSent = data.network.bytes_sent;
            
            let rxSpeed = 0;
            let txSpeed = 0;
            if (prevRecv > 0) {
                rxSpeed = Math.max(0, (currentRecv - prevRecv) / 2048);
                txSpeed = Math.max(0, (currentSent - prevSent) / 2048);
            }
            prevRecv = currentRecv;
            prevSent = currentSent;
            
            document.getElementById("net-speed-val").innerText = `Rx: ${rxSpeed.toFixed(1)} KB/s | Tx: ${txSpeed.toFixed(1)} KB/s`;
            
            const totalRxGb = (currentRecv / (1024 ** 3)).toFixed(2);
            const totalTxGb = (currentSent / (1024 ** 3)).toFixed(2);
            document.getElementById("net-total-val").innerText = `Rx Total: ${totalRxGb} GB | Tx Total: ${totalTxGb} GB`;

            // Update charts if loaded
            if (usageChart) {
                usageChart.data.datasets[0].data.shift();
                usageChart.data.datasets[0].data.push(data.cpu);
                usageChart.data.datasets[1].data.shift();
                usageChart.data.datasets[1].data.push(data.ram.percent);
                usageChart.update();
            }
            
            if (bandwidthChart) {
                bandwidthChart.data.datasets[0].data.shift();
                bandwidthChart.data.datasets[0].data.push(rxSpeed);
                bandwidthChart.data.datasets[1].data.shift();
                bandwidthChart.data.datasets[1].data.push(txSpeed);
                bandwidthChart.update();
            }

            // Update Enhanced Overview Widgets
            if (data.system_info) {
                updateHardwareSpecs(data.system_info);
                updatePerCoreWorkload(data.system_info.cpu);
            }
            if (data.protocol_traffic) {
                updateProtocolTraffic(data.protocol_traffic);
            }
            if (data.security) {
                updateSecurityLogs(data.security);
            }
        } catch (err) {
            console.error(err);
        }
    }

    // Universal Action Confirmation Modal Handlers
    let confirmModalAction = null;

    function openConfirmModal({ title, subtitle, message, isDanger = false, confirmText = "تایید و ادامه", cancelText = "انصراف (رد)", onConfirm }) {
        const modal = document.getElementById("action-confirm-modal");
        if (!modal) {
            if (confirm(message.replace(/<[^>]*>?/gm, ''))) {
                if (typeof onConfirm === 'function') onConfirm();
            }
            return;
        }

        const titleEl = document.getElementById("confirm-modal-title");
        const subtitleEl = document.getElementById("confirm-modal-subtitle");
        const bodyEl = document.getElementById("confirm-modal-body");
        const iconWrap = document.getElementById("confirm-modal-icon-wrap");
        const icon = document.getElementById("confirm-modal-icon");
        const okBtn = document.getElementById("confirm-modal-ok-btn");
        const cancelBtn = document.getElementById("confirm-modal-cancel-btn");

        if (titleEl) titleEl.innerText = title ? (window.t ? window.t(title, title) : title) : (window.t ? window.t("تایید عملیات") : "تایید عملیات");
        if (subtitleEl) subtitleEl.innerText = subtitle ? (window.t ? window.t(subtitle, subtitle) : subtitle) : "";
        if (bodyEl) bodyEl.innerHTML = (window.t ? window.t(message, message) : message);
        if (cancelBtn) cancelBtn.innerText = cancelText ? (window.t ? window.t(cancelText, cancelText) : cancelText) : "";
        if (okBtn) okBtn.innerText = confirmText ? (window.t ? window.t(confirmText, confirmText) : confirmText) : "";

        if (isDanger) {
            if (iconWrap) iconWrap.style.background = "rgba(239, 68, 68, 0.12)";
            if (icon) {
                icon.style.color = "#dc2626";
                icon.setAttribute("data-lucide", "alert-triangle");
            }
            if (okBtn) {
                okBtn.style.background = "#dc2626";
                okBtn.style.borderColor = "#dc2626";
                okBtn.style.color = "#ffffff";
                okBtn.innerText = confirmText ? (window.t ? window.t(confirmText, confirmText) : confirmText) : "";
            }
        } else {
            if (iconWrap) iconWrap.style.background = "rgba(16, 185, 129, 0.12)";
            if (icon) {
                icon.style.color = "#10b981";
                icon.setAttribute("data-lucide", "download-cloud");
            }
            if (okBtn) {
                okBtn.style.background = "var(--color-primary)";
                okBtn.style.borderColor = "var(--color-primary)";
                okBtn.style.color = "#ffffff";
                okBtn.innerText = confirmText ? (window.t ? window.t(confirmText, confirmText) : confirmText) : "";
            }
        }

        confirmModalAction = onConfirm;

        // Ensure event listener is hooked
        if (okBtn) {
            okBtn.onclick = () => {
                const action = confirmModalAction;
                closeConfirmModal();
                if (typeof action === 'function') action();
            };
        }

        modal.classList.add("active");
        if (window.lucide) lucide.createIcons();
    }

    function closeConfirmModal() {
        const modal = document.getElementById("action-confirm-modal");
        if (modal) modal.classList.remove("active");
        confirmModalAction = null;
    }

    // Protocol operations
    async function installProtocol(proto) {
        let port = null;
        let ad_tag = "";
        const input = document.getElementById(`install-port-${proto}`);
        if (input) port = parseInt(input.value);
        if (proto === "mtproto") {
            ad_tag = prompt("Enter MTProto advertising tag from @MTProxybot (optional):", "") || "";
        }
        
        toggleLoading(true, `Installing ${proto}... Please wait up to a minute.`);
        try {
            const res = await fetch("/api/protocols/install", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto, port, ad_tag })
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`Successfully deployed ${proto}!`, "success");
                fetchProtocols();
            } else {
                showToast(`Installation failed: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("Connection error during install", "error");
        }
        toggleLoading(false);
    }

    async function executeBatchProtocolInstall() {
        const cbs = document.querySelectorAll(".batch-proto-cb:checked");
        if (cbs.length === 0) {
            showToast("لطفاً حداقل یک پروتکل را برای نصب انتخاب کنید", "warning");
            return;
        }

        const selected = Array.from(cbs).map(cb => cb.value);
        const progressBox = document.getElementById("batch-install-progress");
        const startBtn = document.getElementById("start-batch-install-btn");
        if (startBtn) startBtn.disabled = true;
        if (progressBox) {
            progressBox.style.display = "block";
            progressBox.innerHTML = `<div>🚀 شروع فرآیند نصب گروهی ${selected.length} پروتکل...</div>`;
        }

        for (let i = 0; i < selected.length; i++) {
            const proto = selected[i];
            const meta = PROTOCOL_META[proto] || { title: proto };
            if (progressBox) {
                progressBox.innerHTML += `<div>⏳ [${i + 1}/${selected.length}] در حال نصب ${meta.title} (${proto})... لطفاً صبور باشید.</div>`;
                progressBox.scrollTop = progressBox.scrollHeight;
            }

            try {
                const res = await fetch("/api/protocols/install", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ protocol: proto })
                });
                const data = await res.json();
                if (res.ok) {
                    if (progressBox) progressBox.innerHTML += `<div style="color: #16a34a;">✓ نصب موفقیت‌آمیز ${meta.title}</div>`;
                } else {
                    if (progressBox) progressBox.innerHTML += `<div style="color: #dc2626;">✗ خطا در نصب ${meta.title}: ${data.error || 'Unknown error'}</div>`;
                }
            } catch (err) {
                if (progressBox) progressBox.innerHTML += `<div style="color: #dc2626;">✗ خطای ارتباطی در نصب ${meta.title}</div>`;
            }
            if (progressBox) progressBox.scrollTop = progressBox.scrollHeight;
        }

        if (progressBox) progressBox.innerHTML += `<div style="font-weight:700; color:#4f46e5; margin-top:8px;">🏁 فرآیند نصب به پایان رسید. در حال بروزرسانی وضعیت...</div>`;
        fetchProtocols();
        showToast("فرآیند نصب گروهی پروتکل‌ها تکمیل شد", "success");
        setTimeout(() => {
            closeBatchInstallModal();
        }, 3000);
    }

        toggleLoading(true, "Updating MTProto advertising tag...");
        try {

                headers: { "Content-Type": "application/json" },

            if (res.ok) {
                showToast("MTProto advertising tag updated", "success");

                showToast(`Failed: ${data.error}`, "error");

            showToast("Connection error", "error");

    async function uninstallProtocol(proto) {
        toggleLoading(true, `در حال حذف پروتکل ${proto}... لطفاً صبر کنید.`);

            const res = await fetch("/api/protocols/uninstall", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto })
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`Uninstalled ${proto} successfully`, "success");
                fetchProtocols();
            } else {
                showToast(`Uninstall failed: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("Connection error during uninstall", "error");
        }
        toggleLoading(false);
    }

    function closeProtocolSettingsModal() {
        document.getElementById("protocol-settings-modal").classList.remove("active");
        document.getElementById("protocol-settings-form").reset();
    }
    
    async function saveProtocolSettings(event) {
        event.preventDefault();
        const proto = document.getElementById("settings-proto-name").value;
        
        const payload = {};
        const inputs = document.querySelectorAll("#protocol-settings-form input, #protocol-settings-form select");
        inputs.forEach(input => {
            if (input.id && input.id.startsWith("setting_")) {
                const key = input.id.replace("setting_", "");
                payload[key] = input.value;
            }
        });
        
        toggleLoading(true, `Saving settings for ${proto}...`);
        try {
            const resSave = await fetch("/api/protocols/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            if (!resSave.ok) {
                const dataSave = await resSave.json();
                showToast(`Failed to save settings: ${dataSave.error}`, "error");
                toggleLoading(false);
                return;
            }
            
            toggleLoading(true, `Applying new settings & restarting ${proto}...`);
            const resReconfig = await fetch("/api/protocols/reconfigure", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto })
            });
            
            const dataReconfig = await resReconfig.json();
            if (resReconfig.ok) {
                showToast(`${proto} configured and restarted successfully`, "success");
                closeProtocolSettingsModal();
                fetchProtocols();
            } else {
                showToast(`Reconfiguration failed: ${dataReconfig.error}`, "error");
            }
        } catch (err) {
            console.error(err);
            showToast("Connection error during save", "error");
        }
        toggleLoading(false);
    }

    async function toggleService(proto, action) {

        toggleLoading(true, `${action === 'start' ? 'Starting' : 'Stopping'} ${proto}...`);
        try {
            const res = await fetch("/api/protocols/control", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto, action })
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`Service ${proto} ${action}ed successfully`, "success");
                fetchProtocols();
            } else {
                showToast(`Failed: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("Connection error", "error");
        }
        toggleLoading(false);
    }

    async function changePort(proto) {
        const port = parseInt(document.getElementById(`port-change-${proto}`).value);
        if (!port) return;
        
        toggleLoading(true, `Updating port to ${port}...`);
        try {
            const res = await fetch("/api/protocols/set-port", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto, port })
            });
            const data = await res.json();
            if (res.ok) {
                showToast(`Successfully updated ${proto} port to ${port}`, "success");
                fetchProtocols();
            } else {
                showToast(`Failed: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("Connection error", "error");
        }
        toggleLoading(false);
    }

    // View logs modal helper
    let activeLogProto = null;
    let currentLogs = [];
    let currentLogFilter = 'all';

    function formatLogTimestamp(ts) {
        const d = new Date(ts * 1000);
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit', second:'2-digit' });
    }

    function renderLogs() {
        const container = document.getElementById("log-console");
        container.innerHTML = "";
        
        let filteredLogs = currentLogs;
        if (currentLogFilter === 'error') {
            filteredLogs = currentLogs.filter(l => l.priority <= 3 || l.message.toLowerCase().includes("error") || l.message.toLowerCase().includes("fail"));
        } else if (currentLogFilter === 'auth') {
            const authKeywords = ["login", "auth", "connect", "disconnect", "session", "accepted", "handshake", "established", "peer", "client"];
            filteredLogs = currentLogs.filter(l => authKeywords.some(k => l.message.toLowerCase().includes(k)));
        }
        
        if (filteredLogs.length === 0) {
            container.innerHTML = `<div style="padding: 24px; text-align:center; color:var(--text-muted);">No logs match the current filter.</div>`;
            return;
        }
        
        filteredLogs.forEach(log => {
            const isError = log.priority <= 3 || log.message.toLowerCase().includes("error") || log.message.toLowerCase().includes("fail");
            const isWarning = log.priority === 4 || log.message.toLowerCase().includes("warning");
            
            let levelHtml = `<span style="color:#6366f1;">INFO</span>`;
            if (isError) levelHtml = `<span style="color:var(--color-rose); font-weight:bold;">ERROR</span>`;
            else if (isWarning) levelHtml = `<span style="color:#f59e0b;">WARN</span>`;
            
            const logRow = document.createElement("div");
            logRow.style.cssText = `display:flex; padding:6px 24px; border-bottom:1px solid rgba(255,255,255,0.02); transition:background 0.2s;`;
            logRow.onmouseover = () => logRow.style.background = "rgba(255,255,255,0.02)";
            logRow.onmouseout = () => logRow.style.background = "transparent";
            
            logRow.innerHTML = `
                <div style="width:140px; flex-shrink:0; color:var(--text-dim);">${formatLogTimestamp(log.timestamp)}</div>
                <div style="width:80px; flex-shrink:0;">${levelHtml}</div>
                <div style="flex:1; word-break:break-all; color:${isError ? '#fecdd3' : '#a5b4fc'};">${log.message}</div>
            `;
            container.appendChild(logRow);
        });
        
        // Scroll to bottom
        container.scrollTop = container.scrollHeight;
    }

    async function viewLogs(proto) {
        activeLogProto = proto;
        document.getElementById("log-modal-title").innerText = `${proto.toUpperCase()} Logs`;
        document.getElementById("log-modal").classList.add("active");
        
        const loading = document.getElementById("log-loading");
        if (loading) loading.style.display = "flex";
        
        try {
            const res = await fetch(`/api/protocols/advanced_logs/${proto}`);
            const data = await res.json();
            if (res.ok) {
                currentLogs = data.logs || [];
                renderLogs();
            } else {
                currentLogs = [];
                document.getElementById("log-console").innerHTML = `<div style="padding:24px; color:var(--color-rose);">Error: ${data.error}</div>`;
            }
        } catch (e) {
            currentLogs = [];
            document.getElementById("log-console").innerHTML = `<div style="padding:24px; color:var(--color-rose);">Failed to load logs.</div>`;
        } finally {
            if (loading) loading.style.display = "none";
        }
    }
    
    document.querySelectorAll(".log-tab").forEach(tab => {
        tab.addEventListener("click", (e) => {
            document.querySelectorAll(".log-tab").forEach(t => {
                t.classList.remove("active");
                t.style.background = "transparent";
                if(t.dataset.filter === 'all' || t.dataset.filter === 'auth') t.style.color = "var(--text-muted)";
            });
            e.target.classList.add("active");
            e.target.style.background = "rgba(255,255,255,0.1)";
            if(e.target.dataset.filter === 'all' || e.target.dataset.filter === 'auth') e.target.style.color = "#fff";
            
            currentLogFilter = e.target.dataset.filter;
            renderLogs();
        });
    });
    
    document.getElementById("log-refresh-btn")?.addEventListener("click", () => {
        if (activeLogProto) viewLogs(activeLogProto);
    });
    
    document.getElementById("log-close-btn")?.addEventListener("click", () => {
        document.getElementById("log-modal").classList.remove("active");
        activeLogProto = null;
    });

    // =========================================================================
    // Sidebar Collapsible State Handler
    // =========================================================================
    function toggleSidebarCollapse(force) {
        const sidebar = document.getElementById("app-sidebar");
        if (!sidebar) return;
        const isCollapsed = (force !== undefined) ? force : !sidebar.classList.contains("collapsed");
        if (isCollapsed) {
            sidebar.classList.add("collapsed");
            localStorage.setItem("sidebar_collapsed", "true");
        } else {
            sidebar.classList.remove("collapsed");
            localStorage.setItem("sidebar_collapsed", "false");
        }

        const icon = document.getElementById("sidebar-collapse-icon");
        if (icon) {
            const isRtl = document.documentElement.dir === "rtl";
            icon.setAttribute("data-lucide", isCollapsed ? (isRtl ? "chevrons-left" : "chevrons-right") : "sidebar");
        }
        if (window.lucide) lucide.createIcons();
    }

    // Auto-restore sidebar state on page load
    (function restoreSidebarState() {
        if (localStorage.getItem("sidebar_collapsed") === "true") {
            const sidebar = document.getElementById("app-sidebar");
            if (sidebar) sidebar.classList.add("collapsed");
        }
    })();

    // Comprehensive FreeRADIUS Hub & Mikrotik-Style User Manager Module
    // =========================================================================
    currentRadiusUsers = {};
    let currentRadiusGroups = {};
    let currentOnlineSessions = [];
    let selectedRadiusUsers = new Set();
    let revealedPasswords = new Set();

    function switchRadiusSubTab(subTabName) {
        const subTabs = ['users', 'groups', 'online', 'server'];
        subTabs.forEach(name => {
            const btn = document.getElementById(`subtab-btn-${name}`);
            const pane = document.getElementById(`rad-subpane-${name}`);
            if (btn) btn.classList.toggle('active', name === subTabName);
            if (pane) pane.style.display = (name === subTabName) ? 'flex' : 'none';
        });

        if (subTabName === 'online') {
            fetchRadiusData(true);
        } else if (subTabName === 'server') {
            fetchRadiusConfig();
        }

        if (window.lucide) lucide.createIcons();
    }

    async function fetchRadiusData(refreshOnly = false) {
        try {
            const res = await fetch("/api/radius/users");
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "خطا در دریافت اطلاعات ردیوس");

            currentRadiusUsers = data.users || {};
            currentRadiusGroups = data.groups || {};
            currentOnlineSessions = data.online_sessions || [];

            // Update Header Pills & Stats
            const userKeys = Object.keys(currentRadiusUsers);
            const totalUsers = userKeys.length;
            const groupKeys = Object.keys(currentRadiusGroups);
            const totalGroups = groupKeys.length;
            const onlineCount = currentOnlineSessions.length;

            let activeCount = 0;
            let expiredCount = 0;
            const todayStr = new Date().toISOString().slice(0, 10);

            userKeys.forEach(k => {
                const u = currentRadiusUsers[k];
                const isExpired = u.expire_date && u.expire_date < todayStr;
                if (u.active !== false && !isExpired) {
                    activeCount++;
                } else {
                    expiredCount++;
                }
            });

            // Update Counters in DOM
            const pillUsers = document.getElementById("rad-pill-users-count");
            if (pillUsers) pillUsers.innerText = totalUsers;
            const pillGroups = document.getElementById("rad-pill-groups-count");
            if (pillGroups) pillGroups.innerText = totalGroups;
            const pillOnline = document.getElementById("rad-pill-online-count");
            if (pillOnline) pillOnline.innerText = onlineCount;
            const liveOnlineHeader = document.getElementById("live-online-pill-header");
            if (liveOnlineHeader) liveOnlineHeader.innerText = `${onlineCount} اتصال`;

            const statTotal = document.getElementById("stat-rad-total");
            if (statTotal) statTotal.innerText = totalUsers;
            const statActive = document.getElementById("stat-rad-active");
            if (statActive) statActive.innerText = activeCount;
            const statOnline = document.getElementById("stat-rad-online");
            if (statOnline) statOnline.innerText = onlineCount;
            const statExpired = document.getElementById("stat-rad-expired");
            if (statExpired) statExpired.innerText = expiredCount;

            const radTotalDisplay = document.getElementById("rad-total-users");
            if (radTotalDisplay) radTotalDisplay.innerText = `${totalUsers} کاربر`;

            // Populate group dropdowns
            populateRadiusGroupDropdowns();

            // Render tables and grids
            renderRadiusUsersTable();
            renderRadiusGroupsGrid();
            renderRadiusOnlineSessions();

            if (!refreshOnly) {
                fetchRadiusConfig();
            }
        } catch (err) {
            console.error("fetchRadiusData error:", err);
            const tbody = document.getElementById("radius-users-tbody");
            if (tbody) tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#ef4444;">خطا در دریافت اطلاعات ردیوس: ${err.message}</td></tr>`;
        }
    }

    // Alias for existing callers
    function fetchRadiusUsers() {
        fetchRadiusData();
    }

    function populateRadiusGroupDropdowns() {
        const filterSelect = document.getElementById("filter-rad-group");
        const newGroupSelect = document.getElementById("new-rad-group");
        const batchGroupSelect = document.getElementById("batch-rad-group");

        const groupEntries = Object.entries(currentRadiusGroups);

        if (filterSelect) {
            const currentVal = filterSelect.value;
            filterSelect.innerHTML = `<option value="">همه بسته‌ها / گروه‌ها (${groupEntries.length})</option>` +
                groupEntries.map(([id, g]) => `<option value="${id}">${g.name} (${g.simultaneous_use || 2} اتصال - ${g.traffic_gb ? g.traffic_gb + 'GB' : 'نامحدود'})</option>`).join("");
            filterSelect.value = currentVal;
        }

        if (newGroupSelect) {
            const currentVal = newGroupSelect.value;
            newGroupSelect.innerHTML = groupEntries.map(([id, g]) => `<option value="${id}">${g.name}</option>`).join("");
            if (currentVal && currentRadiusGroups[currentVal]) newGroupSelect.value = currentVal;
        }

        if (batchGroupSelect) {
            const currentVal = batchGroupSelect.value;
            batchGroupSelect.innerHTML = groupEntries.map(([id, g]) => `<option value="${id}">${g.name}</option>`).join("");
            if (currentVal && currentRadiusGroups[currentVal]) batchGroupSelect.value = currentVal;
        }
    }

    function renderRadiusUsersTable() {
        const tbody = document.getElementById("radius-users-tbody");
        if (!tbody) return;

        const searchVal = (document.getElementById("search-rad-user")?.value || "").toLowerCase().trim();
        const groupFilter = document.getElementById("filter-rad-group")?.value || "";
        const statusFilter = document.getElementById("filter-rad-status")?.value || "all";
        const todayStr = new Date().toISOString().slice(0, 10);

        let filteredUsernames = Object.keys(currentRadiusUsers).filter(uname => {
            const u = currentRadiusUsers[uname];
            if (searchVal && !uname.toLowerCase().includes(searchVal)) return false;
            if (groupFilter && u.group !== groupFilter) return false;

            const isExpired = u.expire_date && u.expire_date < todayStr;
            const isOnline = (u.online_count || 0) > 0;
            const isActive = (u.active !== false) && !isExpired;

            if (statusFilter === "active" && !isActive) return false;
            if (statusFilter === "disabled" && isActive) return false;
            if (statusFilter === "online" && !isOnline) return false;

            return true;
        });

        if (filteredUsernames.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" style="text-align: center; padding: 40px; color: #94a3b8;">
                        <i data-lucide="user-x" style="width: 32px; height: 32px; margin-bottom: 8px; opacity: 0.6;"></i>
                        <p style="margin: 0; font-size: 13.5px;">${window.t("common_no_users_found")}</p>
                    </td>
                </tr>
            `;
            if (window.lucide) lucide.createIcons();
            updateBulkDeleteButton();
            return;
        }

        let html = "";
        filteredUsernames.forEach(uname => {
            const u = currentRadiusUsers[uname];
            const isChecked = selectedRadiusUsers.has(uname);
            const isRevealed = revealedPasswords.has(uname);
            const isExpired = u.expire_date && u.expire_date < todayStr;
            const isActive = (u.active !== false) && !isExpired;
            const onlineCount = u.online_count || 0;
            const simLimit = u.simultaneous_use || 2;

            // Connection indicator
            let connBadge = "";
            if (onlineCount > 0) {
                connBadge = `<span style="display:inline-flex; align-items:center; gap:5px; font-weight:700; color:#059669; background:rgba(16,185,129,0.1); padding:3px 9px; border-radius:6px; font-size:12px;">
                    <span class="status-dot active"></span> ${onlineCount} / ${simLimit} ${window.t("common_connections")}
                </span>`;
            } else {
                connBadge = `<span style="display:inline-flex; align-items:center; gap:5px; color:#64748b; background:#f1f5f9; padding:3px 9px; border-radius:6px; font-size:12px;">
                    0 / ${simLimit} ${window.t("common_connections")}
                </span>`;
            }

            // Status badge
            const statusHtml = isActive 
                ? `<span style="padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(16, 185, 129, 0.12); color: #059669; display:inline-flex; align-items:center; gap:4px;">
                    <span class="status-dot active"></span> ${window.t("common_active")}
                   </span>`
                : `<span style="padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: rgba(239, 68, 68, 0.12); color: #dc2626; display:inline-flex; align-items:center; gap:4px;">
                    <span class="status-dot inactive"></span> ${isExpired ? window.t('common_expired') : window.t('common_disabled')}
                   </span>`;

            // Group badge
            const grpName = u.group_name || currentRadiusGroups[u.group]?.name || (typeof window.t === "function" ? window.t("استاندارد") : "استاندارد");
            const grpBadge = `<span style="background: rgba(99, 102, 241, 0.1); color: #4f46e5; padding: 3px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600;">
                ${grpName}
            </span>`;

            // Used Traffic: Download & Upload separated (Requirement 5)
            const rxFmt = formatTrafficBytes(u.upload_bytes || (u.used_upload_gb ? u.used_upload_gb * (1024**3) : 0));
            const txFmt = formatTrafficBytes(u.download_bytes || (u.used_download_gb ? u.used_download_gb * (1024**3) : 0));
            const totFmt = formatTrafficBytes((u.upload_bytes || 0) + (u.download_bytes || 0));

            const usedTrafficHtml = `
                <div style="display:flex; flex-direction:column; gap:2px; font-size:11.5px; font-family:'JetBrains Mono';">
                    <span style="color:#0284c7; display:flex; align-items:center; gap:4px;" title="حجم دانلود شده"><i data-lucide="arrow-down" style="width:12px; height:12px;"></i> ${txFmt} <span style="font-size:10px; color:#64748b;">(دانلود)</span></span>
                    <span style="color:#d97706; display:flex; align-items:center; gap:4px;" title="حجم آپلود شده"><i data-lucide="arrow-up" style="width:12px; height:12px;"></i> ${rxFmt} <span style="font-size:10px; color:#64748b;">(آپلود)</span></span>
                    <span style="color:#334155; font-weight:700; margin-top:2px; font-size:11px;">مجموع: ${totFmt}</span>
                </div>
            `;

            // Quotas (Download, Upload, Total)
            let quotaHtml = `<div style="display:flex; flex-direction:column; gap:2px; font-size:11px; font-family:'JetBrains Mono'; color:#475569;">`;
            if (u.download_limit_gb && u.download_limit_gb > 0) quotaHtml += `<div>دانلود: <strong style="color:#0284c7;">${u.download_limit_gb} GB</strong></div>`;
            if (u.upload_limit_gb && u.upload_limit_gb > 0) quotaHtml += `<div>آپلود: <strong style="color:#d97706;">${u.upload_limit_gb} GB</strong></div>`;
            if (u.limit_gb && u.limit_gb > 0) quotaHtml += `<div>کل: <strong>${u.limit_gb} GB</strong></div>`;
            if (!u.download_limit_gb && !u.upload_limit_gb && (!u.limit_gb || u.limit_gb <= 0)) quotaHtml += `<span style="color:#64748b;">نامحدود</span>`;
            quotaHtml += `</div>`;

            // Bandwidth Rate Limit (MikroTik Rate-Limit)
            const rateLimitHtml = (u.rate_limit && u.rate_limit.trim())
                ? `<span style="background:rgba(217,119,6,0.12); color:#b45309; padding:3px 8px; border-radius:6px; font-size:11.5px; font-weight:700; font-family:'JetBrains Mono';" title="محدودیت پهنای باند میکروتیک">⚡ ${escapeHtml(u.rate_limit)}</span>`
                : `<span style="color:#64748b; font-size:11px;">نامحدود</span>`;

            // Schedule info (Login-Time badge)
            let schedText = "24/7";
            if (u.start_time && u.end_time && (u.start_time !== "00:00" || u.end_time !== "24:00")) {
                schedText = `${u.start_time}-${u.end_time}`;
            }
            if (u.allowed_days === "weekdays") schedText += ` (${window.t("radius_allowed_days_weekdays", "کاری")})`;
            else if (u.allowed_days === "weekends") schedText += ` (${window.t("radius_allowed_days_weekends", "تعطیل")})`;

            html += `
                <tr style="border-bottom: 1px solid #f1f5f9; transition: background 0.15s; ${isChecked ? 'background: rgba(99, 102, 241, 0.04);' : ''}">
                    <td style="padding: 12px 16px; text-align: center;">
                        <input type="checkbox" class="rad-table-check rad-user-cb" value="${uname}" onchange="toggleSelectRadiusUser('${uname}', this.checked)" ${isChecked ? 'checked' : ''}>
                    </td>
                    <td style="padding: 12px 16px; font-weight: 700; color: #0f172a; font-family: 'JetBrains Mono', monospace;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div style="width:28px; height:28px; border-radius:8px; background:rgba(79,70,229,0.08); color:#4f46e5; display:flex; align-items:center; justify-content:center; font-size:12px;">
                                <i data-lucide="user" style="width:14px; height:14px;"></i>
                            </div>
                            <span>${uname}</span>
                        </div>
                    </td>
                    <td style="padding: 12px 16px; font-family: 'JetBrains Mono', monospace; color: #475569;">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="background: #f8fafc; border:1px solid #e2e8f0; padding: 2px 7px; border-radius: 5px; font-size:12px; letter-spacing: ${isRevealed ? 'normal' : '2px'};">
                                ${isRevealed ? u.password : '••••••'}
                            </span>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleRevealRadiusPassword('${uname}')" style="padding:2px 6px; height:24px; width:auto; border:none; background:transparent;" title="${isRevealed ? window.t('common_hide_password') : window.t('common_show_password')}">
                                <i data-lucide="${isRevealed ? 'eye-off' : 'eye'}" style="width:13px; height:13px; color:#64748b;"></i>
                            </button>
                        </div>
                    </td>
                    <td style="padding: 12px 16px;">${grpBadge}</td>
                    <td style="padding: 12px 16px;">${usedTrafficHtml}</td>
                    <td style="padding: 12px 16px;">${quotaHtml}</td>
                    <td style="padding: 12px 16px;">${rateLimitHtml}</td>
                    <td style="padding: 12px 16px;">${connBadge}</td>
                    <td style="padding: 12px 16px;">
                        <div style="font-size:12px; font-family:'JetBrains Mono'; color:#0f172a;">${u.expire_date || `<span style="color:#64748b;">${window.t("common_no_expiration")}</span>`}</div>
                        <div style="font-size:10.5px; color:#94a3b8; margin-top:2px;">${window.t("common_time_label")} ${schedText}</div>
                    </td>
                    <td style="padding: 12px 16px; text-align: center;">${statusHtml}</td>
                    <td style="padding: 12px 16px; text-align: center;">
                        <div style="display: inline-flex; gap: 4px; align-items: center;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleRadiusUser('${uname}')" style="padding: 5px 8px; width:auto; color: ${isActive ? '#dc2626' : '#10b981'};" title="${isActive ? window.t('common_deactivate') : window.t('common_activate')}">
                                <i data-lucide="${isActive ? 'power' : 'check'}" style="width:13px; height:13px;"></i>
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="changeRadiusUserPassword('${uname}')" style="padding: 5px 8px; width:auto;" title="${window.t('common_change_password')}">
                                <i data-lucide="key" style="width:13px; height:13px;"></i>
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="editSingleRadiusUser('${uname}')" style="padding: 5px 8px; width:auto;" title="${window.t('common_edit_user')}">
                                <i data-lucide="edit-3" style="width:13px; height:13px;"></i>
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="showRadiusUserSubModal('${uname}')" style="padding: 5px 8px; width:auto; color: #6366f1;" title="${window.t('common_user_sub_link')}">
                                <i data-lucide="qr-code" style="width:13px; height:13px;"></i>
                            </button>
                            <button type="button" class="btn-proto-delete" onclick="deleteSingleRadiusUser('${uname}')" style="padding: 5px 8px; font-size:11px;" title="${window.t('common_delete_user')}">
                                <i data-lucide="trash-2" style="width:12px; height:12px;"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
        if (window.lucide) lucide.createIcons();
        updateBulkDeleteButton();
    }

    function toggleRevealRadiusPassword(uname) {
        if (revealedPasswords.has(uname)) {
            revealedPasswords.delete(uname);
        } else {
            revealedPasswords.add(uname);
        }
        renderRadiusUsersTable();
    }

    function filterRadiusUsersTable() {
        renderRadiusUsersTable();
    }

    // Bulk Delete Selection Handlers
    function toggleSelectAllRadiusUsers(checked) {
        const cbs = document.querySelectorAll(".rad-user-cb");
        cbs.forEach(cb => {
            cb.checked = checked;
            if (checked) {
                selectedRadiusUsers.add(cb.value);
            } else {
                selectedRadiusUsers.delete(cb.value);
            }
        });
        renderRadiusUsersTable();
    }

    function toggleSelectRadiusUser(uname, checked) {
        if (checked) {
            selectedRadiusUsers.add(uname);
        } else {
            selectedRadiusUsers.delete(uname);
        }
        const selectAllCb = document.getElementById("check-select-all-rad");
        if (selectAllCb) {
            const allCbs = document.querySelectorAll(".rad-user-cb");
            selectAllCb.checked = allCbs.length > 0 && selectedRadiusUsers.size === allCbs.length;
        }
        updateBulkDeleteButton();
    }

    function updateBulkDeleteButton() {
        const btn = document.getElementById("btn-rad-bulk-delete");
        const countSpan = document.getElementById("bulk-selected-count");
        if (btn && countSpan) {
            countSpan.innerText = selectedRadiusUsers.size;
            btn.style.display = selectedRadiusUsers.size > 0 ? "inline-flex" : "none";
        }
    }

    function confirmBulkDeleteRadiusUsers() {
        const count = selectedRadiusUsers.size;
        if (count === 0) return;

        const usersList = Array.from(selectedRadiusUsers);
        openConfirmModal({
            title: `تایید حذف دسته‌جمعی ${count} کاربر`,
            subtitle: `حذف دائمی کاربران از هسته ردیوس و تمامی پروتکل‌ها`,
            message: `
                <div style="display:flex; flex-direction:column; gap:12px;">
                    <p style="margin:0; font-size:14px; color:#dc2626; font-weight:700;">
                        آیا از حذف دسته‌جمعی ${count} کاربر انتخاب‌شده اطمینان دارید؟
                    </p>
                    <div style="background:rgba(254, 242, 242, 0.95); border:1px solid rgba(239, 68, 68, 0.25); padding:10px 14px; border-radius:10px; font-size:12.5px; color:#991b1b; max-height:120px; overflow-y:auto; line-height:1.6;">
                        <strong>کاربران انتخابی:</strong> ${usersList.slice(0, 10).join(', ')}${usersList.length > 10 ? ` و ${usersList.length - 10} کاربر دیگر...` : ''}
                    </div>
                </div>
            `,
            isDanger: true,
            confirmText: `بله، همه (${count}) را حذف کن`,
            cancelText: "انصراف (رد)",
            onConfirm: async () => {
                toggleLoading(true, `در حال حذف دسته‌جمعی ${count} کاربر از ردیوس...`);
                try {
                    const res = await fetch("/api/radius/users/bulk-delete", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ usernames: usersList })
                    });
                    const data = await res.json();
                    toggleLoading(false);
                    if (res.ok) {
                        showToast(`${data.deleted_count || count} کاربر با موفقیت حذف شدند`, "success");
                        selectedRadiusUsers.clear();
                        fetchRadiusData();
                    } else {
                        showToast(data.error || "خطا در حذف دسته‌جمعی کاربران", "error");
                    }
                } catch (e) {
                    toggleLoading(false);
                    showToast("خطا در ارتباط با سرور", "error");
                }
            }
        });
    }

    // Single User Add/Edit Box
    function toggleAddRadiusUserBox(show) {
        const box = document.getElementById("add-radius-user-box");
        if (!box) return;
        const willShow = (show !== undefined) ? show : (box.style.display === "none");
        box.style.display = willShow ? "block" : "none";
        if (willShow) {
            document.getElementById("radius-user-form-title").innerText = "مشخصات کاربر جدید ردیوس";
            document.getElementById("new-rad-user").removeAttribute("readonly");
            document.getElementById("form-add-radius-user").reset();
            populateRadiusGroupDropdowns();
            onSingleUserGroupSelect(document.getElementById("new-rad-group")?.value);
            document.getElementById("new-rad-user")?.focus();
        }
        if (window.lucide) lucide.createIcons();
    }

    function generateRandomPassForInput(inputId) {
        const chars = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let pass = "";
        for (let i = 0; i < 8; i++) {
            pass += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const el = document.getElementById(inputId);
        if (el) el.value = pass;
    }

    function onSingleUserGroupSelect(groupId) {
        const grp = currentRadiusGroups[groupId];
        if (!grp) return;
        const simInput = document.getElementById("new-rad-sim-use");
        if (simInput && !simInput.value) simInput.value = grp.simultaneous_use || 2;
        const limitInput = document.getElementById("new-rad-limit");
        if (limitInput && !limitInput.value && grp.traffic_gb) limitInput.value = grp.traffic_gb;
        const daysSelect = document.getElementById("new-rad-days");
        if (daysSelect && grp.allowed_days) daysSelect.value = grp.allowed_days;
        const stInput = document.getElementById("new-rad-start-time");
        if (stInput && grp.start_time) stInput.value = grp.start_time;
        const etInput = document.getElementById("new-rad-end-time");
        if (etInput && grp.end_time) etInput.value = grp.end_time;
    }

    async function submitSingleRadiusUser(e) {
        e.preventDefault();
        const username = document.getElementById("new-rad-user").value.trim();
        const password = document.getElementById("new-rad-pass").value.trim();
        const group = document.getElementById("new-rad-group").value;
        const simultaneous_use = parseInt(document.getElementById("new-rad-sim-use").value || 2);
        const expire_date = document.getElementById("new-rad-expire").value || null;
        const limit_gb = document.getElementById("new-rad-limit").value ? parseFloat(document.getElementById("new-rad-limit").value) : null;
        const download_limit_gb = document.getElementById("new-rad-download-limit").value ? parseFloat(document.getElementById("new-rad-download-limit").value) : null;
        const upload_limit_gb = document.getElementById("new-rad-upload-limit").value ? parseFloat(document.getElementById("new-rad-upload-limit").value) : null;
        const rate_limit = (document.getElementById("new-rad-rate-limit")?.value || "").trim();
        const allowed_days = document.getElementById("new-rad-days").value;
        const start_time = document.getElementById("new-rad-start-time").value || "00:00";
        const end_time = document.getElementById("new-rad-end-time").value || "24:00";

        if (!username || !password) {
            showToast("نام کاربری و رمز عبور الزامی است", "warning");
            return;
        }

        toggleLoading(true, `در حال ثبت کاربر ${username} و همگام‌سازی در FreeRADIUS...`);
        try {
            const res = await fetch("/api/radius/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username, password, group, simultaneous_use,
                    expire_date, limit_gb, download_limit_gb, upload_limit_gb, rate_limit, allowed_days, start_time, end_time
                })
            });
            const data = await res.json();
            toggleLoading(false);
            if (res.ok) {
                showToast(`کاربر ${username} با سقف ${simultaneous_use} اتصال در ردیوس فعال شد!`, "success");
                toggleAddRadiusUserBox(false);
                fetchRadiusData();
            } else {

    async function submitBatchRadiusUsers(e) {
        e.preventDefault();
        const prefix = document.getElementById("batch-rad-prefix").value.trim() || "user_";
        const count = parseInt(document.getElementById("batch-rad-count").value || 10);
        const password_type = document.getElementById("batch-rad-pwd-type").value;
        const custom_password = document.getElementById("batch-rad-custom-pass")?.value || "";
        const group = document.getElementById("batch-rad-group").value;
        const simultaneous_use = parseInt(document.getElementById("batch-rad-sim-use").value || 2);
        const validity_days = parseInt(document.getElementById("batch-rad-validity").value || 30);
        const limit_gb = document.getElementById("batch-rad-limit").value ? parseFloat(document.getElementById("batch-rad-limit").value) : null;
        const allowed_days = document.getElementById("batch-rad-days").value;
        const start_time = document.getElementById("batch-rad-start-time").value || "00:00";
        const end_time = document.getElementById("batch-rad-end-time").value || "24:00";

        closeBatchRadiusModal();
        toggleLoading(true, `در حال تولید خودکار ${count} اکانت سراسری ردیوس...`);

        try {
            const res = await fetch("/api/radius/users/batch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    prefix, count, password_type, custom_password, group,
                    simultaneous_use, validity_days, limit_gb, allowed_days,
                    start_time, end_time
                })
            });
            const data = await res.json();
            toggleLoading(false);

            if (res.ok) {
                showToast(`${data.count || count} کاربر با موفقیت ساخته و در ردیوس ثبت شدند!`, "success");
                
                // Format output for download / copy
                const created = data.created || [];
                let txt = `# MH Panel - FreeRADIUS Generated Accounts (${new Date().toLocaleString()})\n`;
                txt += `# Group: ${group} | Simultaneous-Use: ${simultaneous_use} | Validity: ${validity_days} Days\n`;
                txt += `------------------------------------------------------------\n`;
                txt += `Username\tPassword\tSimultaneous\tExpires\n`;
                txt += `------------------------------------------------------------\n`;
                created.forEach(u => {
                    txt += `${u.username}\t${u.password}\t${u.simultaneous_use} Max\t${u.expire_date}\n`;
                });

                batchCreatedUsersText = txt;
                const textBox = document.getElementById("batch-created-text-box");
                if (textBox) textBox.innerText = txt;

                const resultModal = document.getElementById("batch-created-result-modal");
                if (resultModal) resultModal.classList.add("active");

                fetchRadiusData();
            } else {
                showToast(data.error || "خطا در تولید دسته‌جمعی اکانت‌ها", "error");
            }
        } catch (err) {
            toggleLoading(false);
            showToast("خطا در ارتباط با سرور", "error");
        }
    }

    function copyBatchResults() {
        if (!batchCreatedUsersText) return;
        navigator.clipboard.writeText(batchCreatedUsersText).then(() => {
            showToast("مشخصات کاربران با موفقیت کپی شد", "success");
        }).catch(() => {
            showToast("خطا در دسترسی به کلیپ‌بورد", "error");
        });
    }

    function downloadBatchResults() {
        if (!batchCreatedUsersText) return;
        const blob = new Blob([batchCreatedUsersText], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `mhpanel_radius_users_${new Date().toISOString().slice(0, 10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast("فایل با موفقیت دانلود شد", "success");
    }
