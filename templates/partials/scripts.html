    async function fetchSshConfig() {
        try {
            const res = await fetch("/api/ssh/config");
            if (!res.ok) return;
            const data = await res.json();
            
            const badge = document.getElementById("ssh-status-badge");
            if (badge) {
                const s = data.services || {};
                const allActive = s.ssh && s.stunnel && s.ws;
                if (allActive) {
                    badge.innerHTML = `<span class="status-dot active"></span> ${window.t("تمامی سرویس‌ها فعال و آماده اتصال")}`;
                    badge.style.color = "#059669";
                } else {
                    badge.innerHTML = `<span class="status-dot warning"></span> ${window.t("بررسی وضعیت")} (SSH: ${s.ssh ? window.t('فعال') : window.t('قطع')} | TLS: ${s.stunnel ? window.t('فعال') : window.t('قطع')} | WS: ${s.ws ? window.t('فعال') : window.t('قطع')})`;
                    badge.style.color = "#d97706";
                }
            }

            if (data.direct_ports && document.getElementById("ssh-stat-direct-ports")) {
                document.getElementById("ssh-stat-direct-ports").innerText = data.direct_ports.join(", ");
            }
            if (data.ws_ports && document.getElementById("ssh-stat-ws-ports")) {
                document.getElementById("ssh-stat-ws-ports").innerText = `${data.ws_ports.join(", ")} (/ssh)`;
            }
            if (data.stunnel_ports && document.getElementById("ssh-stat-tls-ports")) {
                document.getElementById("ssh-stat-tls-ports").innerText = data.stunnel_ports.join(", ");
            }
            if (data.udpgw_port && document.getElementById("ssh-stat-udpgw-port")) {
                document.getElementById("ssh-stat-udpgw-port").innerText = `${data.udpgw_port} (${data.services?.udpgw ? 'فعال' : 'غیرفعال'})`;
            }
            if (data.slowdns?.pubkey && document.getElementById("ssh-box-slowdns-key")) {
                document.getElementById("ssh-box-slowdns-key").innerText = data.slowdns.pubkey;
            }
        } catch (err) {
            console.error("fetchSshConfig error:", err);
        }
    }

    async function fetchSshClients() {
        try {
            const res = await fetch("/api/ssh/users");
            if (!res.ok) return;
            const data = await res.json();
            
            const container = document.getElementById("ssh-clients");
            if (!container) return;
            container.innerHTML = "";
            
            const users = data.users || {};
            const userKeys = Object.keys(users);
            
            const countBadge = document.getElementById("ssh-client-count-badge");
            if (countBadge) countBadge.innerText = `${userKeys.length} ${window.t("common_users_unit", "کاربر")}`;
            
            if (userKeys.length === 0) {
                container.innerHTML = `<div style='text-align:center; padding:30px; color:var(--text-muted); font-size:13px;'>${window.t("no_users_found_create_form", "هیچ کاربری یافت نشد. می‌توانید با فرم روبرو یک اکانت جدید بسازید.")}</div>`;
                return;
            }
            
            for (const [username, info] of Object.entries(users)) {
                const rxGb = ((info.rx || 0) / (1024**3)).toFixed(2);
                const txGb = ((info.tx || 0) / (1024**3)).toFixed(2);
                const totalGb = (parseFloat(rxGb) + parseFloat(txGb)).toFixed(2);
                const limitText = info.limit_gb ? `${info.limit_gb} GB` : window.t("common_unlimited", "نامحدود");
                const expireText = info.expire_date || window.t("common_unlimited", "نامحدود");
                const isOnline = !!info.online;
                const statusClass = info.active ? "active" : "inactive";
                const onlineBadge = isOnline ? 
                    `<span style="background:#dcfce7; color:#166534; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; display:inline-flex; align-items:center; gap:3px;"><span style="width:6px; height:6px; border-radius:50%; background:#22c55e;"></span> آنلاین</span>` :
                    `<span style="background:#f1f5f9; color:#64748b; font-size:10px; font-weight:600; padding:2px 6px; border-radius:4px;">آفلاین</span>`;
                
                const authSourceBadge = info.is_default ?
                    `<span style="background:#fef3c7; color:#b45309; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;">ردیوس (کاربر پیش‌فرض)</span>` :
                    `<span style="background:#ede9fe; color:#6d28d9; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;">FreeRADIUS</span>`;

                const card = document.createElement("div");
                card.className = "client-item";
                card.style.background = info.active ? "var(--bg-surface)" : "var(--bg-base)";
                card.style.border = "1px solid " + (info.active ? "rgba(99, 102, 241, 0.25)" : "var(--border-glow)");
                card.style.padding = "14px 16px";
                card.style.borderRadius = "10px";
                card.style.boxShadow = "0 1px 3px rgba(0,0,0,0.03)";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                        <div style="flex:1; min-width:220px;">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                                <span class="status-dot ${statusClass}"></span>
                                <strong style="font-size:15px; color:var(--text-main); font-family:'JetBrains Mono',monospace;">${username}</strong>
                                ${onlineBadge}
                                ${authSourceBadge}
                            </div>
                            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:6px; font-size:11px; color:var(--text-muted);">
                                <div><i data-lucide="hard-drive" style="width:12px; height:12px; vertical-align:-2px;"></i> سقف: <strong>${limitText}</strong></div>
                                <div><i data-lucide="calendar" style="width:12px; height:12px; vertical-align:-2px;"></i> انقضا: <strong>${expireText}</strong></div>
                                <div><i data-lucide="activity" style="width:12px; height:12px; vertical-align:-2px;"></i> مصرف: <strong>${totalGb} GB</strong></div>
                            </div>
                        </div>
                        <div style="display:flex; gap:6px; align-items:center;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="copyUserSshConnection('${username}')" title="کپی اطلاعات اتصال این کاربر" style="padding:6px 10px;">
                                <i data-lucide="copy" style="width:13px; height:13px;"></i>
                            </button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleSshClient('${username}')" title="${info.active ? 'غیرفعال‌سازی اکانت' : 'فعال‌سازی اکانت'}" style="padding:6px 10px;">
                                <i data-lucide="${info.active ? 'pause' : 'play'}" style="width:13px; height:13px; color:${info.active ? '#d97706' : '#059669'};"></i>
                            </button>
                            ${info.is_default ? '' : `
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteSshClient('${username}')" title="${window.t('common_delete_user')}" style="padding:6px 10px;">
                                <i data-lucide="trash-2" style="width:13px; height:13px;"></i>
                            </button>`}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (err) {
            console.error("fetchSshClients error:", err);
        }
    }

    async function fetchSshSessions() {
        try {
            const res = await fetch("/api/ssh/sessions");
            if (!res.ok) return;
            const data = await res.json();
            const tbody = document.getElementById("ssh-sessions-tbody");
            if (!tbody) return;
            tbody.innerHTML = "";

            const sessions = data.sessions || [];
            if (sessions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center; padding:24px; color:var(--text-muted); font-size:12px;">
                            هیچ نشست فعالی در حال حاضر وجود ندارد.
                        </td>
                    </tr>
                `;
                return;
            }

            for (const sess of sessions) {
                const tr = document.createElement("tr");
                tr.style.borderBottom = "1px solid #f1f5f9";
                tr.innerHTML = `
                    <td style="padding:10px 14px; font-weight:700; color:var(--text-main); font-family:'JetBrains Mono',monospace;">
                        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-left:6px;"></span>
                        ${sess.username}
                    </td>
                    <td style="padding:10px 14px; direction:ltr; text-align:right; font-family:'JetBrains Mono',monospace; color:#475569;">
                        ${sess.peer_ip}
                    </td>
                    <td style="padding:10px 14px; direction:ltr; text-align:right; font-family:'JetBrains Mono',monospace; color:#64748b;">
                        ${sess.pid}
                    </td>
                    <td style="padding:10px 14px; color:var(--text-muted); font-size:12px; direction:ltr; text-align:right;">
                        ${sess.started_at}
                    </td>
                    <td style="padding:10px 14px; text-align:center;">
                        <button type="button" class="btn btn-danger btn-sm" onclick="killSshSession(${sess.pid}, '${sess.username}')" style="padding:4px 10px; font-size:11px;">
                            <i data-lucide="power" style="width:12px; height:12px; vertical-align:-2px; margin-left:3px;"></i> قطع ارتباط
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (err) {
            console.error("fetchSshSessions error:", err);
        }
    }

    async function createSshClient(e) {
        if (e) e.preventDefault();
        const username = document.getElementById("ssh-client-username").value.trim();
        const password = document.getElementById("ssh-client-password").value.trim();
        const limit_gb = document.getElementById("ssh-client-limit").value ? parseFloat(document.getElementById("ssh-client-limit").value) : null;
        const expire_date = document.getElementById("ssh-client-expire").value || null;
        
        if (!username || !password) {
            showToast("نام کاربری و کلمه عبور الزامی است", "error");
            return;
        }
        
        toggleLoading(true, "در حال ایجاد کاربر در FreeRADIUS و سیستم لینوکس...");
        try {
            const res = await fetch("/api/ssh/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, limit_gb, expire_date })
            });
            const data = await res.json();
            if (res.ok) {
                showToast("کاربر با موفقیت به ردیوس و لینوکس اضافه شد", "success");
                document.getElementById("ssh-client-username").value = "";
                document.getElementById("ssh-client-password").value = "";
                document.getElementById("ssh-client-limit").value = "";
                document.getElementById("ssh-client-expire").value = "";
                fetchSshClients();
            } else {
                showToast(`خطا: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("خطا در برقراری ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    async function deleteSshClient(username) {
        if (!confirm(`آیا از حذف اکانت "${username}" از ردیوس و سرور اطمینان دارید؟`)) return;
        
        toggleLoading(true, "در حال حذف اکانت...");
        try {
            const res = await fetch(`/api/ssh/users/${username}`, { method: "DELETE" });
            const data = await res.json();
            if (res.ok) {
                showToast("اکانت با موفقیت حذف شد", "success");
                fetchSshClients();
                fetchSshSessions();
            } else {
                showToast(data.error || "خطا در حذف اکانت", "error");
            }
        } catch (err) {
            showToast("خطا در برقراری ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    async function toggleSshClient(username) {
        toggleLoading(true, "در حال تغییر وضعیت کاربر...");

            const res = await fetch(`/api/ssh/users/${username}/toggle`, { method: "POST" });

        }
        toggleLoading(false);
    }

    async function killSshSession(pid, username) {
        if (!confirm(`آیا می‌خواهید اتصال کاربر "${username}" (PID: ${pid}) قطع شود؟`)) return;
        toggleLoading(true, "در حال قطع اتصال نشست...");
        try {
            const res = await fetch("/api/ssh/sessions/kill", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pid, username })
            });
            const data = await res.json();
            if (res.ok) {
                showToast("نشست با موفقیت قطع شد", "success");
                fetchSshSessions();
                fetchSshClients();
            } else {
                showToast(data.error || "خطا در بستن نشست", "error");
            }
        } catch (err) {
            showToast("خطا در ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    async function restartSshServices() {
        toggleLoading(true, "در حال راه‌اندازی مجدد سرویس‌های SSH (OpenSSH, Stunnel, WebSocket, SlowDNS)...");
        try {
            const res = await fetch("/api/ssh/services/restart", { method: "POST" });
            const data = await res.json();
            if (res.ok) {
                showToast("تمامی سرویس‌های SSH با موفقیت ری‌استارت شدند", "success");
                fetchSshConfig();
                fetchSshSessions();
            } else {
                showToast("برخی سرویس‌ها با خطا مواجه شدند", "error");
            }
        } catch (err) {
            showToast("خطا در ارسال درخواست", "error");
        }
        toggleLoading(false);
    }

    function copySshText(text, label) {

            navigator.clipboard.writeText(text).then(() => {

            }).catch(() => {
                prompt(`لطفاً متن زیر را به صورت دستی کپی کنید:`, text);
            });
        } else {
            prompt(`لطفاً متن زیر را به صورت دستی کپی کنید:`, text);
        }
    }

    async function fetchOcservClients() {
        try {
            const res = await fetch("/api/ocserv/users");
            if (!res.ok) return;
            const data = await res.json();
            
            const container = document.getElementById("ocserv-clients");
            if (!container) return;
            container.innerHTML = "";
            
            const users = data.users || {};
            if (Object.keys(users).length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted); font-size:13px;'>No clients found.</p>";
                return;
            }
            
            for (const [username, info] of Object.entries(users)) {
                const rxGb = ((info.rx || 0) / (1024**3)).toFixed(2);
                const txGb = ((info.tx || 0) / (1024**3)).toFixed(2);
                const totalGb = (parseFloat(rxGb) + parseFloat(txGb)).toFixed(2);
                const limitText = info.limit_gb ? `${info.limit_gb} GB` : 'Unlimited';
                const expireText = info.expire_date || 'Never';
                const statusClass = info.active ? "active" : "inactive";
                
                const sourceBadge = (info.source === 'local') 
                    ? `<span style="font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(234,179,8,0.15); color:#ca8a04; font-weight:600;">لوکال OCServ</span>`
                    : `<span style="font-size:11px; padding:2px 8px; border-radius:12px; background:rgba(79,70,229,0.15); color:#4f46e5; font-weight:600;">FreeRADIUS (سراسری)</span>`;
                
                const card = document.createElement("div");
                card.className = "client-item";
                card.style.background = "rgba(255,255,255,0.02)";
                card.style.border = "1px solid rgba(255,255,255,0.05)";
                card.style.padding = "16px";
                card.style.borderRadius = "8px";
                card.style.marginBottom = "8px";
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px;">
                        <div style="flex:1; min-width:200px;">
                            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                                <span class="status-dot ${statusClass}"></span>
                                <strong style="font-size:15px; color:var(--text-main); font-family:'JetBrains Mono', monospace;">${username}</strong>
                                ${sourceBadge}
                            </div>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px; color:var(--text-muted);">
                                <div><i data-lucide="hard-drive" style="width:12px; vertical-align:-2px;"></i> Limit: ${limitText}</div>
                                <div><i data-lucide="calendar" style="width:12px; vertical-align:-2px;"></i> Expire: ${expireText}</div>
                                <div style="grid-column: span 2; margin-top:4px;">
                                    <i data-lucide="activity" style="width:12px; vertical-align:-2px;"></i> Usage: ${totalGb} GB (Rx: ${rxGb} GB / Tx: ${txGb} GB)
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <button class="btn btn-secondary btn-sm" onclick="toggleOcservClient('${username}')" title="Toggle Active">
                                <i data-lucide="${info.active ? 'pause' : 'play'}" style="width:14px; height:14px;"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteOcservClient('${username}')" title="Delete">
                                <i data-lucide="trash-2" style="width:14px; height:14px;"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (err) {
            console.error(err);
        }
    }

    async function createOcservClient() {
        const username = document.getElementById("ocserv-client-username").value.trim();
        const password = document.getElementById("ocserv-client-password").value;
        const limit_gb = document.getElementById("ocserv-client-limit").value ? parseFloat(document.getElementById("ocserv-client-limit").value) : null;
        const expire_date = document.getElementById("ocserv-client-expire").value || null;
        
        if (!username || !password) {
            showToast("Username and password are required", "error");
            return;
        }
        
        toggleLoading(true, "Creating account...");
        try {
            const res = await fetch("/api/ocserv/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, limit_gb, expire_date })
            });
            const data = await res.json();
            if (res.ok) {
                showToast("Account created successfully", "success");
                document.getElementById("ocserv-client-username").value = "";
                document.getElementById("ocserv-client-password").value = "";
                document.getElementById("ocserv-client-limit").value = "";
                document.getElementById("ocserv-client-expire").value = "";
                fetchOcservClients();
            } else {
                showToast(`Failed: ${data.error}`, "error");
            }
        } catch (err) {
            showToast("Connection error", "error");
        }
        toggleLoading(false);
    }

    async function deleteOcservClient(username) {
        if (!confirm(`Are you sure you want to delete ${username}?`)) return;
        
        toggleLoading(true, "Deleting account...");
        try {
            const res = await fetch(`/api/ocserv/users/${username}`, { method: "DELETE" });
            if (res.ok) {

                fetchOcservClients();
            } else {
                showToast("Failed to delete account", "error");
            }
        } catch (err) {
            showToast("Connection error", "error");
        }
        toggleLoading(false);
    }

            if (topPort) {

            const topCamo = document.getElementById('ocserv-top-camo-status');

                    topCamo.style.color = 'var(--text-muted)';
                }
            }

            const topAuth = document.getElementById('ocserv-top-auth');
            if (topAuth) {
                topAuth.innerText = data.auth_mode === 'radius' ? 'FreeRADIUS (ردیوس متمرکز)' : 'اکانت‌های محلی (Local)';
            }

            const topSessions = document.getElementById('ocserv-top-sessions');
            if (topSessions) {
                const activeCount = data.stats && data.stats['Active sessions'] !== undefined ? data.stats['Active sessions'] : 0;
                topSessions.innerText = `${activeCount} کاربر آنلاین`;
            }

            // Populate Form inputs
            if (document.getElementById('ocserv-tcp-port')) document.getElementById('ocserv-tcp-port').value = data.tcp_port || 10443;
            if (document.getElementById('ocserv-udp-port')) document.getElementById('ocserv-udp-port').value = data.udp_port || 10443;

                document.getElementById('ocserv-camo-enable').checked = !!data.camouflage;
                toggleCamoInputs();
            }
            if (document.getElementById('ocserv-camo-secret')) document.getElementById('ocserv-camo-secret').value = data.camouflage_secret || 'secure_npu_bypass';
            if (document.getElementById('ocserv-camo-realm')) document.getElementById('ocserv-camo-realm').value = data.camouflage_realm || 'Restricted Area';

            if (document.getElementById('ocserv-domain')) document.getElementById('ocserv-domain').value = data.default_domain || 'vpn.kigaping.com';

            // Cert radios
            if (data.cert_type === 'letsencrypt') {
                const r = document.getElementById('cert-type-le');
                if (r) r.checked = true;
            } else {
                const r = document.getElementById('cert-type-self');
                if (r) r.checked = true;
            }

            if (document.getElementById('ocserv-ipv4-network')) document.getElementById('ocserv-ipv4-network').value = data.ipv4_network || '10.30.30.0';
            if (document.getElementById('ocserv-ipv4-netmask')) document.getElementById('ocserv-ipv4-netmask').value = data.ipv4_netmask || '255.255.255.0';
            if (document.getElementById('ocserv-dns1')) document.getElementById('ocserv-dns1').value = data.dns1 || '8.8.8.8';
            if (document.getElementById('ocserv-dns2')) document.getElementById('ocserv-dns2').value = data.dns2 || '1.1.1.1';
            if (document.getElementById('ocserv-mtu')) document.getElementById('ocserv-mtu').value = data.mtu || 1200;

            if (document.getElementById('ocserv-max-same-clients')) document.getElementById('ocserv-max-same-clients').value = data.max_same_clients || 4;
            if (document.getElementById('ocserv-dpd')) document.getElementById('ocserv-dpd').value = data.dpd || 90;

            if (document.getElementById('ocserv-cisco-compat')) document.getElementById('ocserv-cisco-compat').checked = !!data.cisco_compat;

    async function saveOcservConfig(e) {
        if (e) e.preventDefault();
        const btn = document.getElementById('btn-save-ocserv-config');
        if (btn) btn.disabled = true;
        toggleLoading(true, "در حال ذخیره و اعمال کانفیگ OCServ...");

        const certType = document.querySelector('input[name="ocserv-cert-type"]:checked')?.value || 'letsencrypt';

        const payload = {
            tcp_port: parseInt(document.getElementById('ocserv-tcp-port').value),
            udp_port: parseInt(document.getElementById('ocserv-udp-port').value),
            enable_udp: document.getElementById('ocserv-enable-udp').checked,
            camouflage: document.getElementById('ocserv-camo-enable').checked,
            camouflage_secret: document.getElementById('ocserv-camo-secret').value.trim(),
            camouflage_realm: document.getElementById('ocserv-camo-realm').value.trim(),
            cert_type: certType,
            default_domain: document.getElementById('ocserv-domain').value.trim(),
            ipv4_network: document.getElementById('ocserv-ipv4-network').value.trim(),
            ipv4_netmask: document.getElementById('ocserv-ipv4-netmask').value.trim(),
            dns1: document.getElementById('ocserv-dns1').value.trim(),
            dns2: document.getElementById('ocserv-dns2').value.trim(),
            mtu: parseInt(document.getElementById('ocserv-mtu').value),
            max_clients: parseInt(document.getElementById('ocserv-max-clients').value),
            max_same_clients: parseInt(document.getElementById('ocserv-max-same-clients').value),
            dpd: parseInt(document.getElementById('ocserv-dpd').value),
            cisco_compat: document.getElementById('ocserv-cisco-compat').checked,
            compression: document.getElementById('ocserv-compression').checked
        };

        try {
            const res = await fetch('/api/ocserv/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message || 'تنظیمات OCServ با موفقیت ذخیره شد!', 'success');

            showToast('خطا در برقراری ارتباط با سرور', 'error');

            toggleLoading(false);
            if (btn) btn.disabled = false;
        }

    function syncL2tpCheckboxesFromProposals(ike, esp) {
        if (!ike) ike = "aes256-sha256-modp2048,aes128-sha256-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024!";
        if (!esp) esp = "aes256-sha256,aes128-sha256,aes256-sha1,aes128-sha1,3des-sha1!";

        document.querySelectorAll(".l2tp-ike-cipher-cb").forEach(cb => {
            cb.checked = ike.includes(cb.value);
        });
        document.querySelectorAll(".l2tp-ike-hash-cb").forEach(cb => {
            cb.checked = ike.includes(cb.value);
        });
        document.querySelectorAll(".l2tp-ike-dh-cb").forEach(cb => {
            cb.checked = ike.includes(cb.value);
        });

        document.querySelectorAll(".l2tp-esp-cipher-cb").forEach(cb => {
            cb.checked = esp.includes(cb.value);
        });
        document.querySelectorAll(".l2tp-esp-hash-cb").forEach(cb => {
            cb.checked = esp.includes(cb.value);
        });

        syncL2tpProposalsFromCheckboxes();
    }

    function syncL2tpProposalsFromCheckboxes() {
        const ikeCiphers = Array.from(document.querySelectorAll(".l2tp-ike-cipher-cb:checked")).map(c => c.value);
        const ikeHashes = Array.from(document.querySelectorAll(".l2tp-ike-hash-cb:checked")).map(c => c.value);
        const ikeDhs = Array.from(document.querySelectorAll(".l2tp-ike-dh-cb:checked")).map(c => c.value);

        const espCiphers = Array.from(document.querySelectorAll(".l2tp-esp-cipher-cb:checked")).map(c => c.value);
        const espHashes = Array.from(document.querySelectorAll(".l2tp-esp-hash-cb:checked")).map(c => c.value);

        const ikeCombinations = [];
        for (const c of (ikeCiphers.length ? ikeCiphers : ['aes256'])) {
            for (const h of (ikeHashes.length ? ikeHashes : ['sha256'])) {
                for (const dh of (ikeDhs.length ? ikeDhs : ['modp2048'])) {
                    ikeCombinations.push(`${c}-${h}-${dh}`);
                }
            }
        }

        const espCombinations = [];
        for (const c of (espCiphers.length ? espCiphers : ['aes256'])) {
            for (const h of (espHashes.length ? espHashes : ['sha256'])) {
                espCombinations.push(`${c}-${h}`);
            }
        }

        const ikeStr = ikeCombinations.join(",") + "!";
        const espStr = espCombinations.join(",") + "!";

        const ikeInput = document.getElementById("l2tp-ike-proposal-input");
        if (ikeInput) ikeInput.value = ikeStr;

        const espInput = document.getElementById("l2tp-esp-proposal-input");
        if (espInput) espInput.value = espStr;
    }

    async function fetchL2tpClients() {
        try {
            const res = await fetch("/api/l2tp/users");
            if (!res.ok) return;
            const data = await res.json();
            
            const container = document.getElementById("l2tp-clients");
            if (!container) return;
            container.innerHTML = "";
            
            const users = data.users || {};
            if (Object.keys(users).length === 0) {
                container.innerHTML = `<p style='color:var(--text-muted); font-size:13px; text-align:center; padding:16px;'>${window.t("common_no_users_found", "هیچ کاربری ثبت نشده است.")}</p>`;
                return;
            }

    function toggleManualProposalInputs() {
        const box = document.getElementById("manual-proposals-box");
        if (!box) return;

    function syncProposalsFromCheckboxes() {
        const ikeCiphers = Array.from(document.querySelectorAll('.ike-cipher-cb:checked')).map(cb => cb.value);
        const ikeHashes = Array.from(document.querySelectorAll('.ike-hash-cb:checked')).map(cb => cb.value);
        const ikeDhs = Array.from(document.querySelectorAll('.ike-dh-cb:checked')).map(cb => cb.value);

        const espCiphers = Array.from(document.querySelectorAll('.esp-cipher-cb:checked')).map(cb => cb.value);
        const espHashes = Array.from(document.querySelectorAll('.esp-hash-cb:checked')).map(cb => cb.value);

        // Build IKE proposals
        const ikeProposals = [];
        ikeCiphers.forEach(cipher => {
            if (cipher.includes('gcm') || cipher.includes('poly1305')) {
                ikeDhs.forEach(dh => {
                    ikeProposals.push(`${cipher}-${dh}`);
                });
            } else {
                ikeHashes.forEach(hash => {
                    ikeDhs.forEach(dh => {
                        ikeProposals.push(`${cipher}-${hash}-${dh}`);
                    });
                });
            }
        });

        const ikeString = (ikeProposals.length > 0 ? ikeProposals.join(',') : 'aes256-sha256-modp2048') + '!';

        // Build ESP proposals
        const espProposals = [];
        espCiphers.forEach(cipher => {
            if (cipher.includes('gcm') || cipher.includes('poly1305')) {
                espProposals.push(cipher);
            } else {
                espHashes.forEach(hash => {
                    espProposals.push(`${cipher}-${hash}`);
                });
            }
        });

        const espString = (espProposals.length > 0 ? espProposals.join(',') : 'aes256-sha256') + '!';

        const ikeInput = document.getElementById('ike-proposal-input');
        const espInput = document.getElementById('esp-proposal-input');
        if (ikeInput) ikeInput.value = ikeString;
        if (espInput) espInput.value = espString;

        const ikePreview = document.getElementById('ike-preview-text');
        const espPreview = document.getElementById('esp-preview-text');
        if (ikePreview) ikePreview.textContent = ikeString;
        if (espPreview) espPreview.textContent = espString;

        // Toggle active style on pills
        document.querySelectorAll('.algo-pill').forEach(pill => {
            const cb = pill.querySelector('input[type="checkbox"]');
            if (cb && cb.checked) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });
    }

    function syncCheckboxesFromProposals(ikeStr, espStr) {
        if (!ikeStr) ikeStr = "";
        if (!espStr) espStr = "";

        document.querySelectorAll('.ike-cipher-cb').forEach(cb => {
            cb.checked = ikeStr.includes(cb.value);
        });
        document.querySelectorAll('.ike-hash-cb').forEach(cb => {
            cb.checked = ikeStr.includes(cb.value);
        });
        document.querySelectorAll('.ike-dh-cb').forEach(cb => {
            cb.checked = ikeStr.includes(cb.value);
        });

        document.querySelectorAll('.esp-cipher-cb').forEach(cb => {
            cb.checked = espStr.includes(cb.value);
        });
        document.querySelectorAll('.esp-hash-cb').forEach(cb => {
            cb.checked = espStr.includes(cb.value);
        });

        const ikeInput = document.getElementById('ike-proposal-input');
        const espInput = document.getElementById('esp-proposal-input');
        if (ikeInput) ikeInput.value = ikeStr;
        if (espInput) espInput.value = espStr;

        const ikePreview = document.getElementById('ike-preview-text');
        const espPreview = document.getElementById('esp-preview-text');
        if (ikePreview) ikePreview.textContent = ikeStr;
        if (espPreview) espPreview.textContent = espStr;

        document.querySelectorAll('.algo-pill').forEach(pill => {
            const cb = pill.querySelector('input[type="checkbox"]');
            if (cb && cb.checked) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });
    }

        try {

            const services = data.services || {};
            
            const badge = document.getElementById("sstp-status-badge");
            if (badge) {
                const isRunning = services.sstpd || services.vpnserver;
                const engineName = services.sstpd && services.vpnserver ? "sstpd + SoftEther" : (services.sstpd ? "sstpd (Kernel)" : (services.vpnserver ? "SoftEther MS-SSTP" : window.t("غیرفعال")));
                if (isRunning) {
                    badge.innerHTML = `<span class="status-dot active"></span> ${window.t("common_active")} (${window.t("در حال اجرا:")} ${engineName})`;
                } else {
                    badge.innerHTML = `<span class="status-dot inactive"></span> ${window.t("غیرفعال / متوقف")}`;
                }
            }

            const pPort = cfg.port || 4443;

            if (document.getElementById("sstp-stat-direct-port")) {

            if (document.getElementById("sstp-stat-sni")) {

            }
            if (document.getElementById("sstp-box-direct-target")) {
                document.getElementById("sstp-box-direct-target").innerText = `${domain}:${pPort}`;
            }
            if (document.getElementById("sstp-box-sni-target")) {
                document.getElementById("sstp-box-sni-target").innerText = `${pSni}:443`;
            }

            // Populate form
            if (document.getElementById("sstp-cfg-engine")) document.getElementById("sstp-cfg-engine").value = cfg.engine || "sstpd";
            if (document.getElementById("sstp-cfg-port")) document.getElementById("sstp-cfg-port").value = pPort;
            if (document.getElementById("sstp-cfg-sni")) document.getElementById("sstp-cfg-sni").value = pSni;
            if (document.getElementById("sstp-cfg-mtu")) document.getElementById("sstp-cfg-mtu").value = cfg.mtu || "1400";

            if (document.getElementById("sstp-cfg-dns1")) document.getElementById("sstp-cfg-dns1").value = cfg.dns1 || "8.8.8.8";
            if (document.getElementById("sstp-cfg-dns2")) document.getElementById("sstp-cfg-dns2").value = cfg.dns2 || "1.1.1.1";
            if (document.getElementById("sstp-cfg-ciphers")) document.getElementById("sstp-cfg-ciphers").value = cfg.ciphers || SSTP_CIPHER_PRESETS["all_aes_sha"];
            if (document.getElementById("sstp-cfg-cipher-preset")) {

    // --- Clipboard Utility ---
    function copyText(text) {
        if (!text || text === '-') return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("در کلیپ‌بورد کپی شد!", "success");
            }).catch(() => {
                legacyCopy(text);
            });
        } else {
            legacyCopy(text);
        }
    }

    function legacyCopy(text) {
        try {
            const el = document.createElement("textarea");
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand("copy");
            document.body.removeChild(el);
            showToast("در کلیپ‌بورد کپی شد!", "success");
        } catch (e) {
            showToast("خطا در کپی کردن متن", "error");
        }
    }

    // --- Protocol Control Helpers ---
    async function controlProtocol(proto, action) {
        const actionLabel = action === 'restart' ? 'راه‌اندازی مجدد' : (action === 'start' ? 'روشن کردن' : 'خاموش کردن');
        toggleLoading(true, `در حال ${actionLabel} سرویس ${proto}...`);
        try {
            const res = await fetch("/api/protocols/control", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocol: proto, action: action })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(`عملیات ${actionLabel} با موفقیت انجام شد.`, "success");
                if (proto === 'dnstt') fetchDnsttConfig();
                else if (proto === 'vaydns') fetchVaydnsConfig();
                else if (proto === 'slipstream') fetchSlipstreamConfig();
                else fetchProtocols();
            } else {

        const portInput = document.getElementById("panel-port-input");
        const path = pathInput ? pathInput.value.trim() : "";
        const port = portInput ? parseInt(portInput.value) || 9090 : 9090;

            showToast("شماره پورت باید عددی بین ۱ تا ۶۵۵۳۵ باشد", "error");

            const res = await fetch("/api/system/panel-access", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path, port })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                const preview = document.getElementById("panel-url-preview");
                if (preview && data.new_url) preview.textContent = data.new_url;
                
                if (data.port_changed) {
                    showToast(`پورت پنل به ${data.port} تغییر یافت! سرویس پنل در حال بازنشانی است. در حال انتقال به آدرس جدید...`, "warning");
                    setTimeout(() => {
                        window.location.href = data.new_url;
                    }, 3500);
                } else {
                    showToast("تنظیمات مسیر اختصاصی پنل با موفقیت ذخیره شد.", "success");
                    fetchPanelAccess();
                }
            } else {
                showToast(`خطا: ${data.error || 'عدم موفقیت در ذخیره'}`, "error");
            }
        } catch (err) {
            showToast("خطای ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    // Panel Access Live URL Preview updates
    document.addEventListener("DOMContentLoaded", () => {
        const pathIn = document.getElementById("panel-path-input");
        const portIn = document.getElementById("panel-port-input");
        function updateUrlPreview() {
            const preview = document.getElementById("panel-url-preview");
            if (!preview) return;
            const p = pathIn ? pathIn.value.trim() : "";
            const prt = portIn ? portIn.value.trim() : (window.location.port || '443');
            let formattedPath = p;
            if (formattedPath && !formattedPath.startsWith("/")) formattedPath = "/" + formattedPath;
            const host = window.location.hostname;
            preview.textContent = `https://${host}:${prt}${formattedPath}`;
        }
        if (pathIn) pathIn.addEventListener("input", updateUrlPreview);
        if (portIn) portIn.addEventListener("input", updateUrlPreview);
    });

        if (!tbody) return;
        try {
            const res = await fetch("/api/proxy/clients");
            if (!res.ok) return;
            const data = await res.json();
            const clients = data.clients || [];
            
            if (clients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:18px; color:var(--text-muted);">هیچ کاربر محلی تعریف نشده است. برای ایجاد روی «افزودن کاربر پروکسی» کلیک کنید.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = "";
            clients.forEach(c => {
                const tr = document.createElement("tr");
                tr.style.borderBottom = "1px solid #e2e8f0";
                const protosLabel = Array.isArray(c.protocols) ? c.protocols.join(" + ") : (c.protocols || "all");
                tr.innerHTML = `
                    <td style="padding:8px 10px; font-weight:600; color:#1e293b;">${c.username}</td>
                    <td style="padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:11.5px; direction:ltr; text-align:start; color:#475569;">${c.password}</td>
                    <td style="padding:8px 10px;"><span style="font-size:11px; background:#e0f2fe; color:#0369a1; padding:2px 8px; border-radius:6px; font-weight:600;">${protosLabel}</span></td>
                    <td style="padding:8px 10px; font-size:11.5px; color:var(--text-muted);">${c.created_at || '-'}</td>
                    <td style="padding:8px 10px; text-align:center;">
                        <button type="button" class="btn btn-secondary btn-sm" onclick="copyText('${c.socks_link}')" style="padding:3px 8px; font-size:11px;">
                            <i data-lucide="copy" style="width:11px; height:11px; margin-left:3px;"></i> SOCKS
                        </button>
                    </td>
                    <td style="padding:8px 10px; text-align:center;">
                        <button type="button" class="btn btn-secondary btn-sm" onclick="copyText('${c.http_link}')" style="padding:3px 8px; font-size:11px;">
                            <i data-lucide="copy" style="width:11px; height:11px; margin-left:3px;"></i> HTTP
                        </button>
                    </td>
                    <td style="padding:8px 10px; text-align:center;">
                        <button type="button" class="btn btn-danger btn-sm" onclick="deleteProxyClient('${c.username}')" style="padding:3px 8px; font-size:11px;">
                            <i data-lucide="trash-2" style="width:12px; height:12px;"></i>

                    </td>
                `;
                tbody.appendChild(tr);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        } catch (err) {
            console.error("fetchProxyClients error:", err);
        }
    }

    async function submitAddProxyClient(e) {
        if (e) e.preventDefault();
        const username = document.getElementById("proxy-client-username-input").value.trim();
        const password = document.getElementById("proxy-client-password-input").value.trim();
        const protoChoice = document.getElementById("proxy-client-proto-select").value;
        const protocols = protoChoice === "all" ? ["socks5", "http"] : [protoChoice];
        if (!username || !password) return;

    function formatTrafficBytes(bytes) {
        if (!bytes || bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    async function runTunnelCompatibilityTest() {
        const srcIp = (document.getElementById("tun-test-src-ip")?.value || "").trim();
        const dstIp = (document.getElementById("tun-test-dst-ip")?.value || "").trim();
        const btn = document.getElementById("btn-run-tun-test");

        toggleLoading(true, "در حال بررسی و پروب تمامی پروتکل‌های تونل بین سرور مبدا و مقصد...");

        try {
            const res = await fetch(`/api/tunnels/test-compatibility?source_ip=${encodeURIComponent(srcIp)}&dest_ip=${encodeURIComponent(dstIp)}`);

            toggleLoading(false);
            showToast("خطای ارتباط با سرور: " + err.message, "error");
        }

        if (btn) btn.disabled = false;
        if (icon) icon.classList.remove("spin");

    function onRelayTunnelSelectChange() {
        const sel = document.getElementById("relay-tunnel-select");
        if (!sel) return;
        const opt = sel.options[sel.selectedIndex];
        const remIp = opt.getAttribute("data-remote-ip");
        if (remIp) {
            const cleanIp = remIp.split("/")[0];
            const targetIpInput = document.getElementById("relay-target-ip");
            if (targetIpInput) targetIpInput.value = cleanIp;
        }

    function openCreateTunnelModal() {
        if (currentTunnelsData && currentTunnelsData.server_ip) {
            const locEl = document.getElementById("tun-local-ip");
            if (locEl) locEl.value = currentTunnelsData.server_ip;
        }
        onTunnelTypeChange();
        const modal = document.getElementById("modal-create-tunnel");
        if (modal) modal.classList.add("active");
    }

    function closeCreateTunnelModal() {
        const modal = document.getElementById("modal-create-tunnel");
        if (modal) modal.classList.remove("active");
    }

    function onTunnelTypeChange() {
        const typeRadios = document.getElementsByName("tunnel_type");
        let selectedType = "gre";
        for (const r of typeRadios) {
            const card = document.getElementById(`type-card-${r.value}`);
            if (r.checked) {
                selectedType = r.value;
                if (card) {
                    card.style.borderColor = "var(--color-primary)";
                    card.style.background = "rgba(99, 102, 241, 0.12)";
                }
            } else {
                if (card) {
                    card.style.borderColor = "var(--border-glow)";
                    card.style.background = "var(--bg-surface)";
                }
            }
        }

        const count = (currentTunnelsData?.tunnels || []).filter(t => t.type === selectedType).length + 1;
        const nameInput = document.getElementById("tun-name");
        const mtuInput = document.getElementById("tun-mtu");
        const innerLocalInput = document.getElementById("tun-inner-local");
        const innerRemoteInput = document.getElementById("tun-inner-remote");

        const defaults = {
            gre: { name: `gre${count}`, mtu: 1476, local: `10.10.${count}.1/30`, remote: `10.10.${count}.2` },
            ip6gre: { name: `ip6gre${count}`, mtu: 1456, local: `2001:db8:${count}::1/64`, remote: `2001:db8:${count}::2` },
            ipip: { name: `ipip${count}`, mtu: 1480, local: `10.20.${count}.1/30`, remote: `10.20.${count}.2` },
            ip6tnl: { name: `ip6tnl${count}`, mtu: 1460, local: `2001:db8:${count + 10}::1/64`, remote: `2001:db8:${count + 10}::2` },
            vxlan: { name: `vxlan${count}`, mtu: 1450, local: `10.30.${count}.1/24`, remote: `10.30.${count}.2` },
            wireguard: { name: `wg_tun${count}`, mtu: 1420, local: `10.50.${count}.1/30`, remote: `10.50.${count}.2` },
            l2tp: { name: `l2tp${count}`, mtu: 1400, local: `10.60.${count}.1/30`, remote: `10.60.${count}.2` },
            openvpn: { name: `ovpn${count}`, mtu: 1500, local: `10.70.${count}.1/30`, remote: `10.70.${count}.2` },
            sstp: { name: `sstp${count}`, mtu: 1450, local: `10.80.${count}.1/30`, remote: `10.80.${count}.2` },
            sit: { name: `sit${count}`, mtu: 1480, local: `2001:db8:${count}::1/64`, remote: `2001:db8:${count}::2` },
            pptp: { name: `pptp${count}`, mtu: 1400, local: `10.90.${count}.1/30`, remote: `10.90.${count}.2` }
        };

        const conf = defaults[selectedType] || defaults.gre;
        if (nameInput) nameInput.value = conf.name;
        if (mtuInput) mtuInput.value = conf.mtu;
        if (innerLocalInput) innerLocalInput.value = conf.local;
        if (innerRemoteInput) innerRemoteInput.value = conf.remote;

        const locEl = document.getElementById("tun-local-ip");
        if (locEl && currentTunnelsData) {
            if ((selectedType === "ip6gre" || selectedType === "ip6tnl") && currentTunnelsData.server_ipv6) {
                locEl.value = currentTunnelsData.server_ipv6;
            } else if (currentTunnelsData.server_ip) {
                locEl.value = currentTunnelsData.server_ip;
            }
        }

        const vxlanBox = document.getElementById("tun-vxlan-fields");
        const wgBox = document.getElementById("tun-wireguard-fields");
        const greBox = document.getElementById("tun-gre-fields");
        const l2tpBox = document.getElementById("tun-l2tp-fields");
        const ovpnBox = document.getElementById("tun-openvpn-fields");
        const sstpBox = document.getElementById("tun-sstp-fields");

        if (vxlanBox) vxlanBox.style.display = selectedType === "vxlan" ? "block" : "none";
        if (wgBox) wgBox.style.display = selectedType === "wireguard" ? "block" : "none";
        if (greBox) greBox.style.display = (selectedType === "gre" || selectedType === "ip6gre") ? "block" : "none";
        if (l2tpBox) l2tpBox.style.display = selectedType === "l2tp" ? "block" : "none";
        if (ovpnBox) ovpnBox.style.display = selectedType === "openvpn" ? "block" : "none";
        if (sstpBox) sstpBox.style.display = (selectedType === "sstp" || selectedType === "pptp") ? "block" : "none";

        if (selectedType === "wireguard") {
            const privInput = document.getElementById("tun-wg-privkey");
            if (privInput && !privInput.value) {
                generateWgTunnelKeys();
            }
        }
        if (selectedType === "openvpn") {
            const ovpnSec = document.getElementById("tun-ovpn-secret");
            if (ovpnSec && !ovpnSec.value) {
                generateOpenVpnP2pKey();
            }
        }
    }

    async function generateWgTunnelKeys() {
        try {
            const res = await fetch("/api/tunnels/generate-wg-keys");
            const data = await res.json();
            if (res.ok && data.success) {
                const privInput = document.getElementById("tun-wg-privkey");
                const pubInput = document.getElementById("tun-wg-pubkey");
                if (privInput) privInput.value = data.privkey;
                if (pubInput) pubInput.value = data.pubkey;
                showToast("کلیدهای جدید وایرگارد تولید شدند.", "success");
            }
        } catch (e) {
            console.error("Error generating WG keys:", e);
        }
    }

    async function generateOpenVpnP2pKey() {
        try {
            const res = await fetch("/api/tunnels/generate-ovpn-key");
            const data = await res.json();
            if (res.ok && data.success) {
                const secEl = document.getElementById("tun-ovpn-secret");
                if (secEl) secEl.value = data.key;
                showToast("کلید متقارن OpenVPN با موفقیت تولید شد.", "success");
            }
        } catch (e) {
            console.error("Error generating OVPN key:", e);
        }
    }

    async function submitCreateTunnel() {
        const typeRadios = document.getElementsByName("tunnel_type");
        let selectedType = "gre";
        for (const r of typeRadios) {
            if (r.checked) selectedType = r.value;
        }

        const name = (document.getElementById("tun-name")?.value || "").trim().toLowerCase();
        const localIp = (document.getElementById("tun-local-ip")?.value || "").trim();

    async function pingTunnel(id) {
        const pingBox = document.getElementById(`ping-res-${id}`);
        const pingBtn = document.getElementById(`btn-ping-${id}`);
        if (pingBox) pingBox.innerHTML = `<span style="color:#0284c7;">در حال تست...</span>`;
        if (pingBtn) pingBtn.disabled = true;

        try {
            const res = await fetch(`/api/tunnels/${id}/ping`, { method: "POST" });
            const data = await res.json();
            if (res.ok && data.success) {
                if (data.packet_loss === 0) {
                    pingBox.innerHTML = `<span style="color:#059669; font-weight:700;">${data.latency_ms} ms</span> <span style="color:#64748b; font-size:10px;">(0% loss)</span>`;
                } else if (data.packet_loss === 100) {
                    pingBox.innerHTML = `<span style="color:#ef4444; font-weight:700;">Timeout</span> <span style="color:#ef4444; font-size:10px;">(100% loss)</span>`;
                } else {
                    pingBox.innerHTML = `<span style="color:#d97706; font-weight:700;">${data.latency_ms} ms</span> <span style="color:#d97706; font-size:10px;">(${data.packet_loss}% loss)</span>`;
                }
            } else {
                pingBox.innerHTML = `<span style="color:#ef4444; font-size:11px;">خطا در تست</span>`;
            }
        } catch (err) {
            if (pingBox) pingBox.innerHTML = `<span style="color:#ef4444; font-size:11px;">خطای ارتباط</span>`;
        } finally {
            if (pingBtn) pingBtn.disabled = false;
        }
    }

    async function checkPanelUpdate(silent = false) {
        const statusEl = document.getElementById("update-modal-status-text");
        const latVerEl = document.getElementById("update-modal-latver");
        const curVerEl = document.getElementById("update-modal-curver");
        const applyBtn = document.getElementById("update-modal-apply-btn");
        const badge = document.getElementById("header-update-badge");

        if (!silent && statusEl) {
            statusEl.innerText = "در حال ارتباط با گیت‌هاب و بررسی نسخه‌ها...";
            statusEl.style.color = "var(--text-main)";
        }

        try {
            const res = await fetch("/api/system/check_update");
            const data = await res.json();
            if (res.ok && data.success) {
                if (curVerEl) curVerEl.innerText = "v" + (data.current_version || "1.0.0");
                if (latVerEl) latVerEl.innerText = "v" + (data.latest_version || "1.0.0");

                if (data.has_update) {
                    if (badge) badge.style.display = "inline-flex";
                    if (applyBtn) applyBtn.style.display = "inline-flex";
                    if (statusEl) {
                        statusEl.innerText = `نسخه جدید (${data.latest_version}) در گیت‌هاب منتشر شده است! برای نصب و بروزرسانی خودکار روی دکمه زیر بزنید.`;
                        statusEl.style.color = "#059669";
                    }
                    if (silent) {
                        showToast("نسخه جدیدی از پنل در گیت‌هاب موجود است! (v" + data.latest_version + ")", "info");
                    }
                } else {
                    if (badge) badge.style.display = "none";
                    if (applyBtn) applyBtn.style.display = "none";
                    if (statusEl) {
                        statusEl.innerText = "شما در حال حاضر از جدیدترین نسخه پایدار MH Panel استفاده می‌فرمایید.";
                        statusEl.style.color = "var(--text-muted)";
                    }
                }
            } else {
                if (!silent && statusEl) {
                    statusEl.innerText = "خطا در بررسی بروزرسانی: " + (data.error || "عدم ارتباط");
                    statusEl.style.color = "var(--color-rose)";
                }
            }
        } catch (err) {
            if (!silent && statusEl) {
                statusEl.innerText = "خطا در ارتباط با سرور یا گیت‌هاب: " + err.message;
                statusEl.style.color = "var(--color-rose)";
            }
        }
    }

            applyBtn.disabled = true;
            applyBtn.innerHTML = '<i data-lucide="loader-2" class="btn-icon spin"></i> در حال بروزرسانی...';
            if (window.lucide) lucide.createIcons();
        }
        if (statusEl) {
            statusEl.innerText = "در حال دریافت آخرین نسخه و بروزرسانی فایل‌های پنل... لطفاً چند ثانیه شکیبا باشید.";
            statusEl.style.color = "var(--color-primary)";
        }

        try {
            const res = await fetch("/api/system/update_panel", { method: "POST" });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast("پنل با موفقیت به آخرین نسخه ارتقا یافت! در حال بارگذاری مجدد...", "success");
                if (statusEl) {
                    statusEl.innerText = "بروزرسانی با موفقیت کامل شد. در حال بارگذاری مجدد...";
                    statusEl.style.color = "#059669";
                }
                setTimeout(() => {
                    window.location.reload();
                }, 2500);
            } else {
                showToast("خطا در بروزرسانی: " + (data.error || "ناموفق"), "error");
                if (applyBtn) {
                    applyBtn.disabled = false;
                    applyBtn.innerHTML = '<i data-lucide="download-cloud"></i> تلاش مجدد بروزرسانی';
                    if (window.lucide) lucide.createIcons();
                }
            }
        } catch (err) {
            showToast("خطا در ارتباط با سرور: " + err.message, "error");
            if (applyBtn) applyBtn.disabled = false;
        }
    }

    // ==========================================
    // TWO-FACTOR AUTHENTICATION (2FA) HANDLERS
    // ==========================================
    let isTwoFactorActive = false;
    async function openTwoFactorModal() {
        const m = document.getElementById("twoFactorModal");
        if (m) {
            m.classList.add("active");
            m.style.display = "flex";
        }
        await refreshTwoFactorStatus();
    }

    function closeTwoFactorModal() {
        const m = document.getElementById("twoFactorModal");
        if (m) {
            m.classList.remove("active");
            m.style.display = "none";
        }
    }

    async function refreshTwoFactorStatus() {
        const statusEl = document.getElementById("twofa-current-status");
        const setupBox = document.getElementById("twofa-setup-box");
        const disableBox = document.getElementById("twofa-disable-box");
        const toggleBtn = document.getElementById("twofa-toggle-btn");

        try {
            const res = await fetch("/api/2fa/status");
            const data = await res.json();
            if (res.ok && data.success) {
                isTwoFactorActive = !!data.twofa_enabled;
                if (statusEl) {
                    statusEl.innerText = isTwoFactorActive ? "فعال و محافظت‌شده ✅" : "غیرفعال ❌";
                    statusEl.style.color = isTwoFactorActive ? "#059669" : "#dc2626";
                }
                const tabSysText = document.getElementById("tab-sys-twofa-status-text");
                const tabSysBadge = document.getElementById("tab-sys-twofa-badge");
                const sideTwofaBadge = document.getElementById("sidebar-twofa-badge");
                if (tabSysText) {
                    tabSysText.innerText = isTwoFactorActive ? "فعال و محافظت‌شده ✅" : "غیرفعال ❌";
                    tabSysText.style.color = isTwoFactorActive ? "#059669" : "#dc2626";
                }
                if (tabSysBadge) {
                    tabSysBadge.className = isTwoFactorActive ? "sidebar-badge sidebar-badge-green" : "sidebar-badge sidebar-badge-blue";
                    tabSysBadge.innerText = isTwoFactorActive ? "فعال" : "غیرفعال";
                }
                if (sideTwofaBadge) {
                    sideTwofaBadge.className = isTwoFactorActive ? "sidebar-badge sidebar-badge-green" : "sidebar-badge sidebar-badge-blue";
                    sideTwofaBadge.innerText = isTwoFactorActive ? "فعال" : "2FA";
                }

                if (isTwoFactorActive) {
                    if (setupBox) setupBox.style.display = "none";
                    if (disableBox) disableBox.style.display = "none";
                    if (toggleBtn) toggleBtn.innerText = "غیرفعال‌سازی ورود ۲ مرحله‌ای";
                } else {
                    if (disableBox) disableBox.style.display = "none";
                    if (toggleBtn) toggleBtn.innerText = "راه‌اندازی و فعال‌سازی";
                    await startTwoFactorSetup();
                }
            }
        } catch (err) {
            console.error("2FA status error:", err);
        }
    }

    async function startTwoFactorSetup() {
        const setupBox = document.getElementById("twofa-setup-box");
        const disableBox = document.getElementById("twofa-disable-box");
        const qrContainer = document.getElementById("twofa-qr-container");
        const secretDisplay = document.getElementById("twofa-secret-display");

        try {
            const res = await fetch("/api/2fa/setup");
            const data = await res.json();
            if (res.ok && data.success) {
                if (secretDisplay) secretDisplay.value = data.secret || "";
                if (qrContainer) {
                    qrContainer.innerHTML = "";
                    const otpUrl = data.otpauth_url || "";
                    if (typeof QRCode !== 'undefined' && QRCode.toCanvas) {
                        QRCode.toCanvas(otpUrl, { width: 170, margin: 1 }, (err, canvas) => {
                            if (err) {
                                qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(otpUrl)}" style="width:170px;height:170px;display:block;">`;
                            } else {
                                qrContainer.appendChild(canvas);
                            }
                        });
                    } else {
                        qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(otpUrl)}" style="width:170px;height:170px;display:block;">`;
                    }
                }
                if (setupBox) setupBox.style.display = "flex";
                if (disableBox) disableBox.style.display = "none";
                if (window.lucide) lucide.createIcons();
            }
        } catch (err) {
            showToast("خطا در دریافت اطلاعات 2FA: " + err.message, "error");
        }
    }

    function toggleTwoFactorFlow() {
        const setupBox = document.getElementById("twofa-setup-box");
        const disableBox = document.getElementById("twofa-disable-box");

        if (isTwoFactorActive) {
            if (disableBox) {
                disableBox.style.display = disableBox.style.display === "none" ? "flex" : "none";
            }
        } else {
            if (setupBox) {
                setupBox.style.display = setupBox.style.display === "none" ? "flex" : "none";
            }
        }
    }

    async function confirmEnableTwoFactor() {
        const codeInput = document.getElementById("twofa-verify-code");
        const secretDisplay = document.getElementById("twofa-secret-display");
        const code = (codeInput?.value || "").trim();
        const secret = (secretDisplay?.value || "").trim();

        if (!code || code.length !== 6) {
            showToast("لطفاً کد ۶ رقمی تولیدشده در اپلیکیشن را وارد نمایید.", "warning");
            return;
        }

        try {
            const res = await fetch("/api/2fa/enable", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code, secret })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast("ورود دو مرحله‌ای با موفقیت فعال شد! از این پس ورود نیازمند کد تایید است.", "success");
                closeTwoFactorModal();
                await refreshTwoFactorStatus();
            } else {
                showToast(`خطا: ${data.error || 'کد احراز هویت نادرست است'}`, "error");
            }
        } catch (err) {
            showToast("خطای ارتباط با سرور: " + err.message, "error");
        }
    }

    async function confirmDisableTwoFactor() {
        const pwInput = document.getElementById("twofa-disable-pw");
        const password = (pwInput?.value || "").trim();

        if (!password) {
            showToast("لطفاً رمز عبور پنل یا کد تایید را وارد کنید.", "warning");
            return;
        }

        try {
            const res = await fetch("/api/2fa/disable", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast("ورود دو مرحله‌ای با موفقیت غیرفعال شد.", "info");
                closeTwoFactorModal();
                await refreshTwoFactorStatus();
            } else {
                showToast(`خطا: ${data.error || 'رمز عبور نامعتبر است'}`, "error");
            }
        } catch (err) {
            showToast("خطای ارتباط با سرور: " + err.message, "error");
        }
    }

    // ==========================================
    // RADIUS SUBSCRIPTION MODAL & SETTINGS
    // ==========================================
    function showRadiusUserSubModal(uname) {
        const u = (typeof currentRadiusUsers !== 'undefined' && currentRadiusUsers) ? currentRadiusUsers[uname] : null;
        const subToken = (u && u.sub_token) ? u.sub_token : uname;
        const origin = window.location.origin;
        const subUrl = (u && u.sub_url) ? (u.sub_url.startsWith("http") ? u.sub_url : `${origin}${u.sub_url}`) : `${origin}/sub/${subToken}`;

        const nameEl = document.getElementById("sub-modal-username");
        if (nameEl) nameEl.innerText = `کاربر: ${uname}`;

        const inputEl = document.getElementById("sub-modal-url-input");
        if (inputEl) inputEl.value = subUrl;

        const openLink = document.getElementById("sub-modal-open-link");
        if (openLink) openLink.href = subUrl;

        const container = document.getElementById("sub-qrcode-container");
        if (container) {
            container.innerHTML = "";
            if (typeof QRCode !== 'undefined' && QRCode.toCanvas) {
                QRCode.toCanvas(subUrl, { width: 180, margin: 1 }, (err, canvas) => {
                    if (err) {
                        container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(subUrl)}" style="width:180px;height:180px;display:block;">`;
                    } else {
                        container.appendChild(canvas);
                    }
                });
            } else {
                container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(subUrl)}" style="width:180px;height:180px;display:block;">`;
            }
        }

        const modal = document.getElementById("subQrModal");
        if (modal) {
            modal.classList.add("active");
            modal.style.display = "flex";
        }
        if (window.lucide) lucide.createIcons();
    }

    function closeSubQrModal() {
        const modal = document.getElementById("subQrModal");
        if (modal) {
            modal.classList.remove("active");
            modal.style.display = "none";
        }
    }

    function updateSubLogoPreview(url) {
        const img = document.getElementById("sub-logo-preview-img");
        const placeholder = document.getElementById("sub-logo-preview-placeholder");
        if (!img || !placeholder) return;
        if (url && url.trim()) {
            img.src = url.trim();
            img.style.display = "block";
            placeholder.style.display = "none";
        } else {
            img.src = "";
            img.style.display = "none";
            placeholder.style.display = "block";
        }
    }

    function setSubColorPreset(color) {
        const txt = document.getElementById("subset-accent-color");
        const picker = document.getElementById("subset-color-picker");
        if (txt) txt.value = color;
        if (picker) picker.value = color;
    }

    function handleSubLogoFileSelect(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = async function(e) {
            const b64 = e.target.result;
            updateSubLogoPreview(b64);
            // Auto-upload
            toggleLoading(true, "در حال آپلود لوگوی مجموعه...");
            try {
                const res = await fetch("/api/sub/logo/upload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image_base64: b64 })
                });
                const data = await res.json();
                toggleLoading(false);
                if (res.ok && data.success) {
                    showToast("لوگو با موفقیت در سرور ذخیره گردید.", "success");
                    const urlInput = document.getElementById("subset-logo-url");
                    if (urlInput) urlInput.value = data.logo_url;
                    updateSubLogoPreview(data.logo_url);
                } else {
                    showToast(data.error || "خطا در آپلود لوگو", "error");
                }
            } catch (err) {
                toggleLoading(false);
                showToast("خطا در آپلود لوگو: " + err.message, "error");
            }
        };
        reader.readAsDataURL(file);
    }

    async function removeSubLogo() {
        const urlInput = document.getElementById("subset-logo-url");
        if (urlInput) urlInput.value = "";
        updateSubLogoPreview("");
        try {
            await fetch("/api/sub/logo/remove", { method: "POST" });
            showToast("لوگو حذف شد و آیکون پیش‌فرض فعال گردید.", "success");
        } catch (err) {}
    }

    async function openSubSettingsModal() {
        const modal = document.getElementById("subSettingsModal");
        if (modal) {
            modal.classList.add("active");
            modal.style.display = "flex";
        }

        try {
            const res = await fetch("/api/sub/settings");
            const data = await res.json();
            if (res.ok && data.success && data.settings) {
                const s = data.settings;
                const titleEl = document.getElementById("subset-title");
                if (titleEl) titleEl.value = s.brand_name || s.title || "";

                const subTitleEl = document.getElementById("subset-brand-subtitle");
                if (subTitleEl) subTitleEl.value = s.brand_subtitle || "";

                const logoUrlEl = document.getElementById("subset-logo-url");
                if (logoUrlEl) logoUrlEl.value = s.logo_url || "";
                updateSubLogoPreview(s.logo_url || "");

                const color = s.accent_color || "#6366f1";
                setSubColorPreset(color);

                const annEl = document.getElementById("subset-announcement");
                if (annEl) annEl.value = s.announcement || "";

                const supEl = document.getElementById("subset-support");
                if (supEl) supEl.value = s.support_contact || s.support_telegram || "";

                const chanEl = document.getElementById("subset-channel");
                if (chanEl) chanEl.value = s.channel_link || "";

                const footEl = document.getElementById("subset-custom-footer");
                if (footEl) footEl.value = s.custom_footer || "";

                const protos = s.enabled_protocols || s.protocols || {};
                ["ocserv", "openvpn", "wireguard", "sstp", "ikev2", "l2tp", "ssh", "tuic"].forEach(p => {
                    const cb = document.getElementById(`subset-proto-${p}`);
                    if (cb) cb.checked = protos[p] !== false;
                });
            }
        } catch (err) {
            console.error("Fetch sub settings error:", err);
        }
        if (window.lucide) lucide.createIcons();
    }

    function closeSubSettingsModal() {
        const modal = document.getElementById("subSettingsModal");
        if (modal) {
            modal.classList.remove("active");
            modal.style.display = "none";
        }
    }

    async function saveSubSettingsForm(e) {
        if (e) e.preventDefault();

        const protos = {};
        ["ocserv", "openvpn", "wireguard", "sstp", "ikev2", "l2tp", "ssh", "tuic"].forEach(p => {
            const cb = document.getElementById(`subset-proto-${p}`);
            protos[p] = cb ? cb.checked : true;
        });

        const payload = {
            title: (document.getElementById("subset-title")?.value || "").trim(),
            brand_name: (document.getElementById("subset-title")?.value || "").trim(),
            brand_subtitle: (document.getElementById("subset-brand-subtitle")?.value || "").trim(),
            logo_url: (document.getElementById("subset-logo-url")?.value || "").trim(),
            accent_color: (document.getElementById("subset-accent-color")?.value || "#6366f1").trim(),
            announcement: (document.getElementById("subset-announcement")?.value || "").trim(),
            support_telegram: (document.getElementById("subset-support")?.value || "").trim(),
            channel_link: (document.getElementById("subset-channel")?.value || "").trim(),
            custom_footer: (document.getElementById("subset-custom-footer")?.value || "").trim(),
            enabled_protocols: protos
        };

        try {
            const res = await fetch("/api/sub/settings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast("تنظیمات صفحه سابسکرایب با موفقیت ذخیره گردید.", "success");
                closeSubSettingsModal();
            } else {
                showToast(`خطا: ${data.error || 'عدم موفقیت'}`, "error");
            }
        } catch (err) {
            showToast("خطای ارتباط با سرور: " + err.message, "error");
        }
    }

    // Check updates quietly in background on page load
    setTimeout(() => {
        checkPanelUpdate(true);
    }, 4000);
</script>
