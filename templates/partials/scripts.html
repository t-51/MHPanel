    // =========================================================================
    async function fetchRadiusConfig() {
        const radForm = document.getElementById("radius-form");
        if (!radForm) return;
        
        try {
            const res = await fetch("/api/radius");
            const data = await res.json();
            if (res.ok) {
                document.getElementById("rad-ip").value = data.server_ip || "127.0.0.1";
                document.getElementById("rad-secret").value = data.shared_secret || "testing123";

    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    let terminalCwd = "/root";

    function initTerminal() {
        const termInput = document.getElementById("terminal-input");
        const termContainer = document.getElementById("terminal-container");
        if (!termInput) return;
        
        termContainer.addEventListener("click", () => {
            termInput.focus();
        });

        termInput.addEventListener("keydown", async (e) => {
            if (e.key === "Enter") {
                const cmd = termInput.value.trim();
                termInput.value = "";
                if (!cmd) return;
                
                commandHistory.push(cmd);
                historyIndex = commandHistory.length;
                
                printTerminalLine(`root@server:${terminalCwd}# ${cmd}`, "#abb2bf", true);
                
                if (cmd.toLowerCase() === "clear") {
                    clearTerminal();
                    return;
                } else if (cmd.toLowerCase() === "help") {
                    printTerminalLine("Available actions: Run any bash command (e.g. ls, pwd, cat, netstat). Folder context is maintained.", "#5c6370");
                    return;
                }

                try {
                    const res = await fetch("/api/terminal/execute", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ command: cmd, cwd: terminalCwd })
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        if (data.output) {
                            printTerminalLine(data.output, "#abb2bf");
                        }
                        if (data.cwd) {
                            terminalCwd = data.cwd;
                            document.getElementById("terminal-prompt").innerText = `root@server:${terminalCwd}#`;
                        }
                    } else {
                        printTerminalLine(data.output || "Error executing command", "#e06c75");
                    }
                } catch (err) {
                    printTerminalLine("Connection error: " + err.message, "#e06c75");
                }
                
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    termInput.value = commandHistory[historyIndex];
                }
            } else if (e.key === "ArrowDown") {
                e.preventDefault();
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    termInput.value = commandHistory[historyIndex];
                } else {
                    historyIndex = commandHistory.length;
                    termInput.value = "";
                }
            }
        });
    }

    function printTerminalLine(text, color = "#abb2bf", isCommand = false) {

        const line = document.createElement("div");

        line.innerText = text;
        if (isCommand) {
            line.style.fontWeight = "bold";
        }
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    }

    // --- SSL & Certificates Management ---
    function renderSSLStatus(data) {
        if (!data) return;
        const issuerSpan = document.getElementById("ssl-issuer");
        const subjectSpan = document.getElementById("ssl-subject");
        const expirySpan = document.getElementById("ssl-expiry");
        const sanSpan = document.getElementById("ssl-san");
        const certPathSpan = document.getElementById("ssl-cert-path");
        const ipInput = document.getElementById("ssl-server-ip");
        const badgeSpan = document.getElementById("ssl-badge");
        
        if (data.exists) {
            if (issuerSpan) {
                issuerSpan.removeAttribute("data-i18n");
                issuerSpan.innerText = data.issuer || "Local CA";
            }
            if (subjectSpan) {
                subjectSpan.removeAttribute("data-i18n");
                subjectSpan.innerText = data.subject || "N/A";
            }
            if (expirySpan) {
                expirySpan.removeAttribute("data-i18n");
                expirySpan.innerText = data.expiry || "Active";
            }
            if (sanSpan) {
                sanSpan.removeAttribute("data-i18n");
                sanSpan.innerText = data.san || (data.subject || "N/A");
            }
            if (badgeSpan) {
                badgeSpan.removeAttribute("data-i18n");
                const isLE = data.issuer && data.issuer.includes("Let's Encrypt");
                const leText = window.t ? window.t("let_s_encrypt_official_certificate_", "گواهی رسمی Let's Encrypt فعال است") : "گواهی رسمی Let's Encrypt فعال است";
                const httpsText = window.t ? window.t("ssl_https", "HTTPS فعال است") : "HTTPS فعال است";
                badgeSpan.innerText = isLE ? leText : httpsText;
                badgeSpan.style.background = "rgba(16, 185, 129, 0.1)";
                badgeSpan.style.color = "#059669";
            }
        } else {
            if (issuerSpan) {
                issuerSpan.removeAttribute("data-i18n");
                issuerSpan.innerText = "Self-Signed (Local CA)";
            }
            if (subjectSpan) {
                subjectSpan.removeAttribute("data-i18n");
                subjectSpan.innerText = "Local";
            }
            if (expirySpan) {
                expirySpan.removeAttribute("data-i18n");
                expirySpan.innerText = "N/A";
            }
            if (badgeSpan) {
                badgeSpan.removeAttribute("data-i18n");
                badgeSpan.innerText = window.t ? window.t("self_signed_certificate", "گواهی خودامضا") : "گواهی خودامضا";
                badgeSpan.style.background = "rgba(245, 158, 11, 0.1)";
                badgeSpan.style.color = "#d97706";
            }
        }
        
        if (certPathSpan) {
            let certText = data.cert_path || "/etc/vpnpanel/ssl/panel.crt";
            if (data.real_cert_path && data.real_cert_path !== data.cert_path) {
                certText += ` -> ${data.real_cert_path}`;
            }
            certPathSpan.innerText = certText;
        }

        // Pre-fill server IP field
        if (ipInput && !ipInput.value) {
            const host = window.location.hostname;
            ipInput.value = host || "212.227.143.16";
        }
    }

    // --- Sidebar Tab Switching ---
    function toggleDropdown(btn) {
        const submenu = btn.nextElementSibling;
        const icon = btn.querySelector('.dropdown-icon');
        if (submenu.style.display === 'none' || !submenu.style.display) {
            submenu.style.display = 'flex';
            if (icon) icon.style.transform = 'rotate(180deg)';
        } else {
            submenu.style.display = 'none';
            if (icon) icon.style.transform = 'rotate(0deg)';
        }
    }

    function switchTab(tabId) {
        // Automatically close mobile sidebar if open
        toggleMobileSidebar(false);

        // Hide all tab panes
        const panes = document.querySelectorAll(".tab-pane");
        panes.forEach(pane => {
            pane.classList.remove("active");
        });

        // Show selected tab pane
        const targetPane = document.getElementById("tab-" + tabId);
        if (targetPane) {
            targetPane.classList.add("active");
        }

        // Update active sidebar nav item
        const navItems = document.querySelectorAll(".sidebar-nav-item");
        navItems.forEach(item => {
            item.classList.remove("active");
        });
        // Update active state on sidebar links
        const links = document.querySelectorAll(".sidebar-nav-item");
        links.forEach(link => link.classList.remove("active"));
        const targetLink = document.querySelector(`.sidebar-nav-item[onclick="switchTab('${tabId}')"]`);
        if (targetLink) {
            targetLink.classList.add("active");
            const parentSubmenu = targetLink.closest('.sidebar-submenu');
            if (parentSubmenu) {
                parentSubmenu.style.display = 'flex';
                const parentDropdownBtn = parentSubmenu.previousElementSibling;
                if (parentDropdownBtn) {
                    const icon = parentDropdownBtn.querySelector('.dropdown-icon');
                    if (icon) icon.style.transform = 'rotate(180deg)';
                }
            }
        }

        // Save active tab in localStorage
        localStorage.setItem("active_tab", tabId);
        const currentLang = localStorage.getItem("panel_language") || "fa";
        if (currentLang !== "fa" && targetPane) {
            _isTranslating = true;
            try {
                translateDom(targetPane, currentLang);
            } finally {
                _isTranslating = false;
            }
        }

        // Trigger specific page fetches on switch
        if (tabId === "overview") {
            fetchStats();
        } else if (tabId === "protocols") {
            fetchProtocols();
        } else if (tabId === "wireguard") {
            fetchWireGuardClients();
            fetchWgCloudflareConfig();
        } else if (tabId === "amneziawg") {
            checkAmneziaWGStatus();
            fetchAmneziaWGClients();
            fetchAwgVersion();
            fetchAwgWarpStatus();
        } else if (tabId === "servers") {
            fetchServers();
        } else if (tabId === "tuic") {
            fetchTuicConfig();
        } else if (tabId === "shadowsocks") {
            fetchShadowsocksConfig();
            fetchShadowsocksClients();
        } else if (tabId === "mtproto") {
            fetchMtprotoInstances();
            fetchProxyClients();
        } else if (tabId === 'ssh') { fetchSshConfig(); fetchSshClients(); fetchSshSessions(); }
        else if (tabId === 'ocserv') { fetchOcservConfig(); fetchOcservClients(); fetchOcservSessions(); }
        else if (tabId === 'l2tp') { fetchL2tpConfig(); fetchL2tpClients(); fetchL2tpSessions(); fetchL2tpV3Tunnels(); }
        else if (tabId === 'ikev2') { fetchIkev2Config(); fetchIkev2Clients(); }
        else if (tabId === 'sstp') { fetchSstpConfig(); fetchSstpClients(); fetchSstpSessions(); }
        else if (tabId === 'dns-tunnels') {

    // --- Port Multiplexer & Multi-Port Engine Logic ---
    let currentListenPorts = [443];

    function renderListenPortTags() {
        const container = document.getElementById("mpx-listen-ports-container");
        if (!container) return;
        container.innerHTML = "";
        if (currentListenPorts.length === 0) {
            container.innerHTML = `<span style="font-size:12.5px; color:var(--text-muted); font-style:italic;">هیچ پورتی اضافه نشده است (حداقل یک پورت مانند ۴۴۳ اضافه کنید).</span>`;
            return;
        }
        currentListenPorts.forEach(port => {
            const tag = document.createElement("div");
            tag.style.cssText = "display:inline-flex; align-items:center; gap:6px; background:rgba(2, 132, 199, 0.1); color:#0284c7; border:1px solid rgba(2, 132, 199, 0.25); padding:4px 10px; border-radius:8px; font-size:13px; font-weight:600; font-family:monospace;";
            tag.innerHTML = `
                <span>${port}</span>
                <span style="cursor:pointer; opacity:0.7; font-weight:bold; margin-right:2px;" onclick="removeListenPort(${port})" title="حذف پورت">&times;</span>
            `;
            container.appendChild(tag);
        });
        const badge = document.getElementById("mpx-active-ports-badge");
        if (badge) {
            badge.innerText = currentListenPorts.join(", ");
        }
    }

    function addListenPort() {
        const input = document.getElementById("mpx-new-port-input");
        if (!input) return;
        const val = parseInt(input.value.trim(), 10);
        if (isNaN(val) || val < 1 || val > 65535) {
            showToast("لطفاً یک شماره پورت معتبر بین ۱ تا ۶۵۵۳۵ وارد کنید.", "warning");
            return;
        }
        if (currentListenPorts.includes(val)) {
            showToast("این پورت قبلاً در لیست وجود دارد.", "info");
            return;
        }
        currentListenPorts.push(val);
        currentListenPorts.sort((a, b) => a - b);
        input.value = "";
        renderListenPortTags();
    }

    function removeListenPort(port) {
        currentListenPorts = currentListenPorts.filter(p => p !== port);
        renderListenPortTags();
    }

    function addPortPreset(presetPorts) {
        let added = 0;
        presetPorts.forEach(p => {
            if (!currentListenPorts.includes(p)) {
                currentListenPorts.push(p);
                added++;
            }
        });
        currentListenPorts.sort((a, b) => a - b);
        renderListenPortTags();
        if (added > 0) {
            showToast(`${added} پورت به لیست اضافه شد.`, "success");
        }
    }

    async function fetchMultiplexerConfig() {
        try {
            const res = await fetch("/api/multiplexer/config");
            if (!res.ok) return;
            const data = await res.json();
            const cfg = data.config || {};
            const status = data.status || {};

            // Status badges
            const haproxyStatus = document.getElementById("mpx-status-haproxy");
            const haproxyDot = document.getElementById("mpx-dot-haproxy");
            if (haproxyStatus && haproxyDot) {
                if (status.haproxy) {
                    haproxyStatus.innerText = "فعال و در حال اجرا (Active)";
                    haproxyStatus.style.color = "#059669";
                    haproxyDot.className = "status-dot active";
                } else {
                    haproxyStatus.innerText = "غیرفعال (Stopped)";
                    haproxyStatus.style.color = "#dc2626";
                    haproxyDot.className = "status-dot inactive";
                }
            }

            const webStatus = document.getElementById("mpx-status-web");
            if (webStatus) {
                let wsText = [];
                if (status.apache) wsText.push("Apache آنلاین");
                if (status.nginx) wsText.push("Nginx آنلاین");
                if (wsText.length === 0) wsText.push("آنلاین (8444)");
                webStatus.innerText = wsText.join(" | ");
            }

            // Master toggle
            const masterToggle = document.getElementById("mpx-master-toggle");
            if (masterToggle) {
                masterToggle.checked = cfg.enabled !== false;
                handleMasterToggleChange();
            }

            // Listen ports
            currentListenPorts = Array.isArray(cfg.listen_ports) && cfg.listen_ports.length > 0 ? cfg.listen_ports : [443];
            renderListenPortTags();

            // Protocols
            const protocols = cfg.protocols || [];
            protocols.forEach(p => {
                const id = p.id;
                const enEl = document.getElementById(`mpx-proto-${id}-enabled`);
                const sniEl = document.getElementById(`mpx-proto-${id}-sni`);
                const targetEl = document.getElementById(`mpx-proto-${id}-target`);

                if (enEl) enEl.checked = p.enabled !== false;
                if (sniEl && p.sni) sniEl.value = p.sni;
                if (targetEl) targetEl.value = `${p.backend_ip || "127.0.0.1"}:${p.backend_port || ""}`;
            });

            // Web Server Type
            const webServerType = document.getElementById("mpx-web-server-type");
            if (webServerType && cfg.web_server_type) {
                webServerType.value = cfg.web_server_type;
            }

            // Custom rules
            const customContainer = document.getElementById("mpx-custom-rules-container");
            if (customContainer) {
                customContainer.innerHTML = "";
                const customRules = cfg.custom_rules || [];
                customRules.forEach(r => addCustomSniRow(r));
            }

            // UDP Multiports
            const udpRules = cfg.udp_multiports || [];
            udpRules.forEach(u => {
                const id = u.id === "cisco_dtls" ? "cisco" : u.id;
                const enEl = document.getElementById(`mpx-udp-${id}-enabled`);
                const portsEl = document.getElementById(`mpx-udp-${id}-ports`);
                if (enEl) enEl.checked = u.enabled === true;
                if (portsEl && Array.isArray(u.listen_ports)) {
                    portsEl.value = u.listen_ports.join(", ");
                }
            });

            if (window.lucide) lucide.createIcons();
        } catch (err) {
            console.error("Failed to fetch multiplexer config:", err);
        }
    }

    async function saveMultiplexerConfig() {
        toggleLoading(true, "در حال ذخیره‌سازی و اعمال کانفیگ HAProxy و فایروال...");

        // Parse custom rules
        const customRows = document.querySelectorAll(".mpx-custom-rule-row");
        const customRules = [];
        customRows.forEach(row => {
            const name = row.querySelector(".custom-name")?.value.trim() || "";
            const sni = row.querySelector(".custom-sni")?.value.trim() || "";
            const target = row.querySelector(".custom-target")?.value.trim() || "";
            const enabled = row.querySelector(".custom-enabled")?.checked || false;
            if (sni && target) {
                customRules.push({ name, sni, backend_target: target, enabled });
            }
        });

        function parseTarget(inputVal, defaultPort) {
            let host = "127.0.0.1";
            let port = defaultPort;
            if (inputVal && inputVal.includes(":")) {
                const parts = inputVal.split(":");
                host = parts[0].trim();
                port = parseInt(parts[1].trim(), 10) || defaultPort;
            } else if (inputVal && !isNaN(parseInt(inputVal, 10))) {
                port = parseInt(inputVal, 10);
            }
            return { host, port };
        }

        const webTarget = parseTarget(document.getElementById("mpx-proto-web-target")?.value, 8444);
        const ocservTarget = parseTarget(document.getElementById("mpx-proto-ocserv-target")?.value, 10443);
        const sshTarget = parseTarget(document.getElementById("mpx-proto-ssh-target")?.value, 4444);
        const openvpnTarget = parseTarget(document.getElementById("mpx-proto-openvpn-target")?.value, 1194);
        const sstpTarget = parseTarget(document.getElementById("mpx-proto-sstp-target")?.value, 4443);

        function parsePortsCsv(val) {
            if (!val) return [];
            return val.split(",").map(p => parseInt(p.trim(), 10)).filter(p => !isNaN(p) && p > 0 && p <= 65535);
        }

        const payload = {
            enabled: document.getElementById("mpx-master-toggle")?.checked ?? true,
            listen_ports: currentListenPorts.length > 0 ? currentListenPorts : [443],
            web_server_type: document.getElementById("mpx-web-server-type")?.value || "apache",
            default_backend: "web",
            protocols: [
                {
                    id: "web",
                    name: "وب سرور و پنل مدیریت (Web / MHPanel)",
                    enabled: document.getElementById("mpx-proto-web-enabled")?.checked ?? true,
                    sni: document.getElementById("mpx-proto-web-sni")?.value.trim() || "mhpanel.kigaping.com",
                    backend_ip: webTarget.host,
                    backend_port: webTarget.port,
                    is_default: true,
                    protocol_type: "web"
                },
                {
                    id: "ocserv",
                    name: "سیسکو AnyConnect (Cisco OCServ)",
                    enabled: document.getElementById("mpx-proto-ocserv-enabled")?.checked ?? true,
                    sni: document.getElementById("mpx-proto-ocserv-sni")?.value.trim() || "vpn.kigaping.com",
                    backend_ip: ocservTarget.host,
                    backend_port: ocservTarget.port,
                    is_default: false,
                    protocol_type: "cisco"
                },
                {
                    id: "ssh",
                    name: "تونل امن SSH بر بستر TLS (Stunnel)",
                    enabled: document.getElementById("mpx-proto-ssh-enabled")?.checked ?? true,
                    sni: document.getElementById("mpx-proto-ssh-sni")?.value.trim() || "ssh.kigaping.com",
                    backend_ip: sshTarget.host,
                    backend_port: sshTarget.port,
                    is_default: false,
                    protocol_type: "ssh"
                },
                {
                    id: "openvpn",
                    name: "اوپن‌وی‌پی‌ان (OpenVPN TCP)",
                    enabled: document.getElementById("mpx-proto-openvpn-enabled")?.checked ?? false,
                    sni: document.getElementById("mpx-proto-openvpn-sni")?.value.trim() || "ovpn.kigaping.com",
                    backend_ip: openvpnTarget.host,
                    backend_port: openvpnTarget.port,
                    is_default: false,
                    protocol_type: "openvpn"
                },
                {
                    id: "sstp",
                    name: "پروتکل SSTP ویندوز (Accel-PPP)",
                    enabled: document.getElementById("mpx-proto-sstp-enabled")?.checked ?? false,
                    sni: document.getElementById("mpx-proto-sstp-sni")?.value.trim() || "sstp.kigaping.com",
                    backend_ip: sstpTarget.host,
                    backend_port: sstpTarget.port,
                    is_default: false,
                    protocol_type: "sstp"
                }
            ],
            custom_rules: customRules,
            udp_multiports: [
                {
                    id: "wireguard",
                    name: "وایرگارد معمولی (WireGuard UDP)",
                    enabled: document.getElementById("mpx-udp-wireguard-enabled")?.checked ?? false,
                    target_port: 904,
                    protocol: "udp",
                    listen_ports: parsePortsCsv(document.getElementById("mpx-udp-wireguard-ports")?.value)
                },
                {
                    id: "amneziawg",
                    name: "امنزیا وایرگارد (AmneziaWG Anti-DPI UDP)",
                    enabled: document.getElementById("mpx-udp-amneziawg-enabled")?.checked ?? false,
                    target_port: 51820,
                    protocol: "udp",
                    listen_ports: parsePortsCsv(document.getElementById("mpx-udp-amneziawg-ports")?.value)
                },
                {
                    id: "cisco_dtls",
                    name: "سیسکو AnyConnect DTLS (UDP)",
                    enabled: document.getElementById("mpx-udp-cisco-enabled")?.checked ?? false,
                    target_port: 10443,
                    protocol: "udp",
                    listen_ports: parsePortsCsv(document.getElementById("mpx-udp-cisco-ports")?.value)
                }
            ]
        };

        try {
            const res = await fetch("/api/multiplexer/config", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message || "تنظیمات با موفقیت اعمال شد.", "success");
                await fetchMultiplexerConfig();
            } else {
                showToast(data.error || "خطا در اعمال تنظیمات.", "error");
            }
        } catch (err) {
            showToast("خطا در برقراری ارتباط با سرور: " + err, "error");
        }
        toggleLoading(false);
    }

                        const url = new URL(window.location.href);
                        url.hostname = data.domain;

            showToast("Connection timed out. Checking server restart...", "info");

    // --- MikroTik Migration & Custom SSL Hub ---
    function handleCertFileUpload(input, targetId) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const el = document.getElementById(targetId);
            if (el) el.value = e.target.result;
            showToast(`فایل ${file.name} بارگذاری شد`, "info");
        };
        reader.readAsText(file);
    }

    function toggleOptionalClientFields() {
        const fields = document.getElementById("mkt-client-fields");
        const icon = document.getElementById("mkt-client-toggle-icon");
        if (!fields) return;
        if (fields.style.display === "none" || !fields.style.display) {
            fields.style.display = "grid";
            if (icon) icon.style.transform = "rotate(180deg)";
        } else {
            fields.style.display = "none";
            if (icon) icon.style.transform = "rotate(0deg)";
        }
    }

    async function submitMikrotikCert(event) {
        event.preventDefault();
        const name = document.getElementById("mkt-cert-name").value.trim();
        const ca_crt = document.getElementById("mkt-ca-crt").value.trim();
        const server_crt = document.getElementById("mkt-server-crt").value.trim();
        const server_key = document.getElementById("mkt-server-key").value.trim();
        const client_crt = document.getElementById("mkt-client-crt") ? document.getElementById("mkt-client-crt").value.trim() : "";
        const client_key = document.getElementById("mkt-client-key") ? document.getElementById("mkt-client-key").value.trim() : "";

        const protos = [];
        document.querySelectorAll("input[name='mkt-proto']:checked").forEach(cb => {
            protos.push(cb.value);
        });

        if (!ca_crt || !server_crt || !server_key) {
            showToast("گواهی Root CA، گواهی سرور و کلید خصوصی الزامی هستند", "warning");
            return;
        }

        toggleLoading(true, "در حال بررسی و وارد کردن گواهی‌های میکروتیک...");
        try {
            const res = await fetch("/api/ssl/import-mikrotik", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name, ca_crt, server_crt, server_key, client_crt, client_key,
                    assign_protocols: protos
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message, "success");
                document.getElementById("ssl-mikrotik-form").reset();
                fetchImportedCertificates();
                fetchSSLStatus();
            } else {
                showToast(data.error || "خطا در وارد کردن گواهی", "error");
            }
        } catch (err) {
            showToast("خطا در ارسال درخواست: " + err.message, "error");
        }
        toggleLoading(false);
    }

        toggleLoading(true, "در حال ثبت و تخصیص گواهی سفارشی...");

                method: "POST",
                headers: { "Content-Type": "application/json" },

    let globalCertRegistry = [];
    async function fetchImportedCertificates() {
        const tbody = document.getElementById("imported-certs-tbody");
        if (!tbody) return;

        try {
            const res = await fetch("/api/ssl/certificates");
            const data = await res.json();
            if (!res.ok || !data.success) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:18px; color:#ef4444;">خطا در دریافت لیست گواهی‌ها</td></tr>`;
                return;
            }

            globalCertRegistry = data.certificates || [];
            if (globalCertRegistry.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-muted);">هیچ گواهی ثبت‌شده‌ای یافت نشد. می‌توانید از کادر بالا گواهی میکروتیک یا سفارشی اضافه کنید.</td></tr>`;
                return;
            }

            let html = "";
            const protoMap = {
                sstp: { name: "SSTP", badge: "sidebar-badge-cyan" },
                ocserv: { name: "Cisco AnyConnect", badge: "sidebar-badge-blue" },
                openvpn: { name: "OpenVPN", badge: "sidebar-badge-yellow" },
                ikev2: { name: "IKEv2", badge: "sidebar-badge-purple" },
                panel: { name: "HTTPS پنل", badge: "sidebar-badge-green" }
            };

            globalCertRegistry.forEach(cert => {
                const isMkt = cert.type === "mikrotik";
                const typeBadge = isMkt 
                    ? `<span style="background:rgba(217, 119, 6, 0.12); color:#b45309; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700;">میکروتیک (CA)</span>`
                    : `<span style="background:rgba(2, 132, 199, 0.12); color:#0284c7; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700;">گواهی SSL</span>`;

                const days = cert.days_remaining || 0;
                let daysBadge = "";
                if (cert.is_expired) {
                    daysBadge = `<span style="color:#ef4444; font-weight:700;">منقضی شده</span>`;
                } else if (days < 30) {
                    daysBadge = `<span style="color:#d97706; font-weight:700;">${days} روز باقیمانده</span>`;
                } else {
                    daysBadge = `<span style="color:#059669; font-weight:700;">${days} روز اعتبار</span>`;
                }

                let protoBadges = "";
                const assigned = cert.assigned_protocols || [];
                if (assigned.length === 0) {
                    protoBadges = `<span style="color:#94a3b8; font-size:11.5px;">تخصیص نیافته</span>`;
                } else {
                    protoBadges = assigned.map(p => {
                        const pm = protoMap[p] || { name: p, badge: "sidebar-badge-blue" };
                        return `<span class="sidebar-badge ${pm.badge}" style="margin:2px; font-size:11px;">${pm.name}</span>`;
                    }).join(" ");
                }

                const safeName = (cert.name || "گواهی").replace(/'/g, "\\'");
                html += `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 12px 14px;">
                        <div style="font-weight: 700; color: #1e293b; font-size: 13px;">${escapeHtml(cert.name || "بدون نام")}</div>
                        <div style="margin-top: 4px; display:flex; gap:6px; align-items:center;">
                            ${typeBadge}
                            <span style="font-size:10.5px; color:#64748b; font-family:'JetBrains Mono';">${cert.id}</span>
                        </div>
                    </td>
                    <td style="padding: 12px 14px;">
                        <div style="font-weight:600; color:#334155; font-family:'JetBrains Mono'; direction:ltr; text-align:right;">${escapeHtml(cert.common_name || cert.subject || "N/A")}</div>
                        <div style="font-size:11px; color:#64748b; margin-top:2px;">صادرکننده: ${escapeHtml(cert.issuer || "نامشخص")}</div>
                    </td>
                    <td style="padding: 12px 14px;">
                        <div>${daysBadge}</div>
                        <div style="font-size:10.5px; color:#64748b; margin-top:2px; font-family:'JetBrains Mono';">${escapeHtml(cert.valid_until || "")}</div>
                    </td>
                    <td style="padding: 12px 14px;">
                        <div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">
                            ${protoBadges}
                        </div>
                    </td>
                    <td style="padding: 12px 14px; text-align: left;">
                        <div style="display:inline-flex; gap:6px; align-items:center;">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="openAssignModal('${cert.id}', '${safeName}', ${JSON.stringify(assigned).replace(/"/g, '&quot;')})" style="padding:4px 10px; font-size:11.5px;" title="تخصیص به پروتکل‌ها">
                                <i data-lucide="layers" style="width:12px; height:12px; margin-left:3px;"></i> تخصیص
                            </button>
                            ${cert.ca_path ? `
                            <a href="/api/ssl/certificates/${cert.id}/download/ca" class="btn btn-secondary btn-sm" style="padding:4px 8px; font-size:11px; text-decoration:none;" title="دانلود Root CA برای کلاینت‌ها">
                                <i data-lucide="download" style="width:12px; height:12px; margin-left:2px;"></i> CA
                            </a>` : ''}
                            ${cert.has_client ? `
                            <a href="/api/ssl/certificates/${cert.id}/download/client_crt" class="btn btn-secondary btn-sm" style="padding:4px 8px; font-size:11px; text-decoration:none;" title="دانلود گواهی کلاینت">
                                <i data-lucide="user" style="width:12px; height:12px; margin-left:2px;"></i> کلاینت
                            </a>` : ''}
                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteImportedCert('${cert.id}', '${safeName}')" style="padding:4px 8px; font-size:11px;" title="حذف">
                                <i data-lucide="trash-2" style="width:12px; height:12px;"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:18px; color:#ef4444;">خطا: ${err.message}</td></tr>`;
        }
    }

    function openAssignModal(certId, certName, currentProtos) {
        document.getElementById("assign-cert-id").value = certId;
        document.getElementById("assign-cert-title").innerText = certName;
        const currentList = Array.isArray(currentProtos) ? currentProtos : [];
        document.querySelectorAll("input[name='assign-proto-chk']").forEach(cb => {
            cb.checked = currentList.includes(cb.value);
        });
        openModal("modal-assign-cert-protocol");
    }

    function closeAssignCertModal() {
        closeModal("modal-assign-cert-protocol");
    }

    async function submitCertAssignment() {
        const certId = document.getElementById("assign-cert-id").value;
        if (!certId) return;

        const protocols = [];
        document.querySelectorAll("input[name='assign-proto-chk']:checked").forEach(cb => {
            protocols.push(cb.value);
        });

        toggleLoading(true, "در حال تخصیص گواهی به پروتکل‌ها و راه‌اندازی مجدد سرویس‌ها...");
        try {
            const res = await fetch(`/api/ssl/certificates/${certId}/assign`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ protocols })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message, "success");
                closeAssignCertModal();
                fetchImportedCertificates();
                fetchSSLStatus();
            } else {
                showToast(data.error || "خطا در تخصیص گواهی", "error");
            }
        } catch (err) {
            showToast("خطا در ارسال درخواست: " + err.message, "error");
        }
        toggleLoading(false);
    }

    async function deleteImportedCert(certId, certName) {
        if (!confirm(`آیا از حذف گواهی «${certName}» اطمینان دارید؟`)) return;

        toggleLoading(true, "در حال حذف گواهی...");
        try {
            const res = await fetch(`/api/ssl/certificates/${certId}`, {
                method: "DELETE"
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message, "success");
                fetchImportedCertificates();
            } else {
                showToast(data.error || "خطا در حذف گواهی", "error");
            }
        } catch (err) {
            showToast("خطا: " + err.message, "error");
        }
        toggleLoading(false);
    }

    // --- Professional Network Radar & Censorship Inspector ---
    let lastRadarData = null;
    let currentRadarCountry = 'auto';

    function changeRadarCountry(country) {
        currentRadarCountry = country || 'auto';
        runRadarScan('quick');
    }

    async function runRadarScan(mode = 'full') {
        const scanBtn = document.getElementById("radar-scan-btn");
        const scanIcon = document.getElementById("radar-scan-icon");
        if (scanBtn) scanBtn.disabled = true;
        if (scanIcon) scanIcon.classList.add("spin");

        const countryVal = document.getElementById("radar-country-select")?.value || currentRadarCountry || 'auto';
        const langVal = (typeof window.currentLang !== "undefined") ? window.currentLang : (localStorage.getItem("mhpanel_lang") || "fa");

        try {
            const res = await fetch(`/api/network/radar?mode=${mode}&country=${encodeURIComponent(countryVal)}&lang=${encodeURIComponent(langVal)}`);
            const data = await res.json();
            if (res.ok && data.success) {
                lastRadarData = data;
                renderRadarResults(data);
                showToast("اسکن جامع رادار با موفقیت انجام شد.", "success");
            } else {
                showToast("خطا در دریافت نتایج اسکن رادار", "error");
            }
        } catch (err) {
            showToast("خطا در اجرای آزمون رادار: " + err.message, "error");
        }

        if (scanBtn) scanBtn.disabled = false;
        if (scanIcon) scanIcon.classList.remove("spin");
    }

    function renderRadarResults(data) {
        const score = data.overall_score || 0;
        const scoreVal = document.getElementById("radar-score-value");
        const scoreBar = document.getElementById("radar-score-bar");
        const scoreDesc = document.getElementById("radar-score-desc");
        if (scoreVal) scoreVal.innerText = score;
        if (scoreBar) {
            scoreBar.style.width = score + "%";
            if (score >= 80) scoreBar.style.background = "#10b981";
            else if (score >= 50) scoreBar.style.background = "#f59e0b";
            else scoreBar.style.background = "#ef4444";
        }
        if (scoreDesc) {
            if (score >= 85) scoreDesc.innerText = "کیفیت عالی و پایدار بدون فیلترینگ عمومی";
            else if (score >= 60) scoreDesc.innerText = "کیفیت مناسب با برخی اختلالات موضعی";
            else scoreDesc.innerText = "هشدار: اختلال شدید یا فیلترینگ در برخی مسیرها";
        }

        const countryFlagEl = document.getElementById("radar-country-flag");
        if (countryFlagEl && data.country_flag) countryFlagEl.innerText = data.country_flag;

        const statLabelEl = document.getElementById("radar-country-stat-label");
        if (statLabelEl && data.country_name) statLabelEl.innerText = `وضعیت اپراتورهای ${data.country_name}:`;

        const tableTitleEl = document.getElementById("radar-country-table-title");
        if (tableTitleEl && data.country_name) tableTitleEl.innerText = `وضعیت دسترسی و کیفیت اتصال در اپراتورهای ${data.country_name} (Telecom & ISPs)`;

        const cleanIran = document.getElementById("radar-iran-clean-count");
        const totalIran = document.getElementById("radar-iran-total-count");
        if (cleanIran) cleanIran.innerText = (data.clean_country_count ?? data.clean_iran_count ?? "--");
        if (totalIran) totalIran.innerText = `/ ${data.total_country_count || data.total_iran_count || 8} اپراتور فعال`;

        const avgIran = document.getElementById("radar-avg-iran-ping");
        if (avgIran) avgIran.innerText = data.avg_iran_latency !== null ? data.avg_iran_latency : "--";

        const avgGlobal = document.getElementById("radar-avg-global-ping");
        if (avgGlobal) avgGlobal.innerText = data.avg_global_latency !== null ? data.avg_global_latency : "--";

        const actPorts = document.getElementById("radar-active-ports");
        const totPorts = document.getElementById("radar-total-ports");
        if (actPorts) actPorts.innerText = data.active_ports_count ?? "--";
        if (totPorts) totPorts.innerText = `/ ${data.total_ports_count || 15} پورت`;

        const lastUp = document.getElementById("radar-last-update");
        if (lastUp) lastUp.innerText = "آخرین اسکن: " + (data.timestamp || "لحظاتی پیش");

        const iranTbody = document.getElementById("radar-iran-tbody");
        const opList = data.country_operators || data.iran_operators;
        if (iranTbody && opList) {
            let html = "";
            opList.forEach(op => {
                let badgeClass = "sidebar-badge-green";
                let statusText = "سالم و متصل";
                if (op.status === "degraded") {
                    badgeClass = "sidebar-badge-yellow";
                    statusText = "اختلال یا تاخیر";
                } else if (op.status === "blocked") {
                    badgeClass = "sidebar-badge-red";
                    statusText = "مسدود / عدم پاسخ";
                }

                let pingDisplay = op.latency_ms !== null 
                    ? `<strong style="font-family:'JetBrains Mono'; font-size:13px; color:#1e293b;">${op.latency_ms}</strong> <span style="font-size:11px; color:#64748b;">ms</span>`
                    : `<span style="color:#ef4444; font-size:12px; font-weight:700;">Timeout</span>`;

                let lossDisplay = op.packet_loss === 0 
                    ? `<span style="color:#059669; font-weight:600; font-family:'JetBrains Mono';">0%</span>`
                    : `<span style="color:#ef4444; font-weight:700; font-family:'JetBrains Mono';">${op.packet_loss}%</span>`;

                html += `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 12px 14px;">
                        <strong style="color:#0f172a; font-size:13px;">${escapeHtml(op.name)}</strong>
                        <div style="font-size:11px; color:#64748b; margin-top:2px;">${escapeHtml(op.desc || "")}</div>
                    </td>
                    <td style="padding: 12px 14px;">${pingDisplay}</td>
                    <td style="padding: 12px 14px;">${lossDisplay}</td>
                    <td style="padding: 12px 14px;">
                        <span class="sidebar-badge ${badgeClass}" style="font-size:11.5px; padding:3px 10px;">${statusText}</span>
                    </td>
                    <td style="padding: 12px 14px;">
                        <span style="font-size:12px; color:#334155;">${escapeHtml(op.verdict_badge || "پایش طبیعی")}</span>
                    </td>
                </tr>`;
            });
            iranTbody.innerHTML = html;
        }

        const globalTbody = document.getElementById("radar-global-tbody");
        if (globalTbody && data.global_destinations) {
            let html = "";
            data.global_destinations.forEach(dest => {
                let badgeClass = "sidebar-badge-green";
                let statusText = "کیفیت مطلوب";
                if (dest.status === "degraded") {
                    badgeClass = "sidebar-badge-yellow";
                    statusText = "تاخیر بالا";
                } else if (dest.status === "blocked") {
                    badgeClass = "sidebar-badge-red";
                    statusText = "قطعی ارتباط";
                }

                let pingDisplay = dest.latency_ms !== null 
                    ? `<strong style="font-family:'JetBrains Mono'; font-size:13px; color:#1e293b;">${dest.latency_ms}</strong> <span style="font-size:11px; color:#64748b;">ms</span>`
                    : `<span style="color:#ef4444; font-size:12px; font-weight:700;">Timeout</span>`;

                html += `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 12px 14px;">
                        <strong style="color:#0f172a; font-size:13px;">${escapeHtml(dest.name)}</strong>
                    </td>
                    <td style="padding: 12px 14px;">
                        <span style="font-size:12px; color:#475569;">${escapeHtml(dest.region || dest.country || "")}</span>
                    </td>
                    <td style="padding: 12px 14px;">${pingDisplay}</td>
                    <td style="padding: 12px 14px;">
                        <span style="font-family:'JetBrains Mono'; color:${dest.packet_loss === 0 ? '#059669' : '#ef4444'}; font-weight:600;">${dest.packet_loss}%</span>
                    </td>
                    <td style="padding: 12px 14px;">
                        <span class="sidebar-badge ${badgeClass}" style="font-size:11px;">${statusText}</span>
                    </td>
                </tr>`;
            });
            globalTbody.innerHTML = html;
        }

        const portsGrid = document.getElementById("radar-ports-grid");
        if (portsGrid && data.ports_matrix) {
            let html = "";
            data.ports_matrix.forEach(p => {
                const isListen = p.is_listening;
                const borderClr = isListen ? "rgba(16, 185, 129, 0.3)" : "rgba(203, 213, 225, 0.6)";
                const bgClr = isListen ? "#f0fdf4" : "#f8fafc";
                const dotClr = isListen ? "#10b981" : "#94a3b8";

                html += `
                <div style="background:${bgClr}; border:1px solid ${borderClr}; border-radius:10px; padding:12px 14px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span style="width:8px; height:8px; border-radius:50%; background:${dotClr};"></span>
                            <strong style="font-size:13px; color:#1e293b; font-family:'JetBrains Mono';">${p.label}</strong>
                            <span style="font-size:10.5px; background:#e2e8f0; color:#475569; padding:1px 5px; border-radius:4px; font-weight:700;">${p.protocol}</span>
                        </div>
                        <div style="font-size:11.5px; color:#475569; margin-top:4px;">${escapeHtml(p.name)}</div>
                    </div>
                    <div style="text-align:left;">
                        <span style="font-size:11px; font-weight:700; color:${isListen ? '#15803d' : '#64748b'};">
                            ${p.status_label}
                        </span>
                    </div>
                </div>`;
            });
            portsGrid.innerHTML = html;
        }

        const verdictEl = document.getElementById("radar-verdict-text");
        if (verdictEl && data.dpi_analysis) {
            verdictEl.innerText = data.dpi_analysis.verdict || "سرور در وضعیت پایدار قرار دارد.";
        }

        const detailsList = document.getElementById("radar-dpi-details-list");
        if (detailsList && data.dpi_analysis && data.dpi_analysis.details) {
            let html = "";
            data.dpi_analysis.details.forEach(item => {
                html += `
                <div style="display:flex; align-items:center; gap:8px; font-size:12.5px; color:#334155; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; padding:10px 14px;">
                    <i data-lucide="check-circle" style="width:16px; height:16px; color:#10b981; flex-shrink:0;"></i>
                    <span>${escapeHtml(item)}</span>
                </div>`;
            });
            detailsList.innerHTML = html;
        }

        if (window.lucide) lucide.createIcons();
    }

    function copyRadarReport() {
        if (!lastRadarData) {
            showToast("لطفاً ابتدا اسکن رادار را اجرا کنید", "warning");
            return;

    async function createWgBulk(event) {
        event.preventDefault();

        const count = parseInt(document.getElementById("wg-bulk-count").value);
        const limit_gb = document.getElementById("wg-bulk-limit").value ? parseInt(document.getElementById("wg-bulk-limit").value) : null;

        toggleLoading(true, `Generating ${count} WireGuard profiles in bulk...`);

                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prefix, count, limit_gb, expire_days, start_on_first_connect })
            });
            const data = await res.json();

                document.getElementById("wg-bulk-result").style.display = "flex";
                document.getElementById("wg-bulk-success-count").innerText = data.clients.length;

                const listContainer = document.getElementById("wg-bulk-list");

                data.clients.forEach((client, index) => {

                    div.style.display = "flex";

    function copyClientConfigText(index) {
        const client = generatedWgBulkClients[index];
        if (!client) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(client.config).then(() => {
                showToast(`Copied config for ${client.name}!`, "success");
            });
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = client.config;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast(`Copied config for ${client.name}!`, "success");
        }
    }

    function downloadClientConfigText(index) {
        const client = generatedWgBulkClients[index];
        if (!client) return;
        const blob = new Blob([client.config], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${client.name}.conf`;
        a.click();
    }

    function downloadAllWgBulk() {
        if (generatedWgBulkClients.length === 0) return;
        generatedWgBulkClients.forEach((client, i) => {
            setTimeout(() => {
                const blob = new Blob([client.config], { type: "text/plain" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `${client.name}.conf`;
                a.click();
            }, i * 200); // Stagger downloads to prevent browser blocking
        });
    }

        let url = buildCustomOvpnDownloadUrl();
        if (url.includes("&user=")) {
            url = url.replace(/&user=[^&]*/, `&user=${encodeURIComponent(username)}`);

    async function fetchOvpnClients() {
        try {
            const res = await fetch("/api/openvpn/users");
            if (res.ok) {
                const data = await res.json();
                const users = data.users || {};

                const container = document.getElementById("ovpn-clients");
                if (container) {
                    container.innerHTML = "";
                    if (Object.keys(users).length === 0) {
                        container.innerHTML = `<p style='color:var(--text-muted); font-size:13px; text-align:center;'>${window.t("common_no_users_found", "هیچ کاربری یافت نشد.")}</p>`;
                    } else {
                        for (const [username, info] of Object.entries(users)) {
                            const rxGb = ((info.rx || 0) / (1024**3)).toFixed(2);
                            const txGb = ((info.tx || 0) / (1024**3)).toFixed(2);
                            const totalGb = (parseFloat(rxGb) + parseFloat(txGb)).toFixed(2);
                            const limitText = info.limit_gb ? `${info.limit_gb} GB` : window.t("common_unlimited", "نامحدود");
                            const expireText = info.expire_date || window.t("common_unlimited", "نامحدود");
                            const statusClass = info.active ? "active" : "inactive";
                            const authSource = info.auth_source || 'FreeRADIUS';

                            const card = document.createElement("div");
                            card.className = "client-item";
                            card.style.background = "var(--bg-base)";
                            card.style.border = "1px solid var(--border-glow)";
                            card.style.padding = "14px 16px";
                            card.style.borderRadius = "10px";
                            card.style.marginBottom = "10px";
                            card.innerHTML = `
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
                                    <div style="flex:1; min-width:200px;">
                                        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                                            <span class="status-dot ${statusClass}"></span>
                                            <strong style="font-size:14.5px; color:var(--text-main); font-family:'JetBrains Mono';">${username}</strong>
                                            <span class="sidebar-badge" style="font-size:10.5px; background:rgba(99,102,241,0.1); color:#4f46e5;">${authSource}</span>

                                        </div>

    async function fetchOpenvpnConfig() {
        try {
            const res = await fetch("/api/openvpn/config");
            const data = await res.json();
            if (res.ok && data.success) {
                const cfg = data.config || {};
                const st = data.status || {};
                const ca = data.ca_details || {};
                const serverIp = data.server_ip || "212.227.143.16";
                
                // Top Stats Bar
                const topServerId = document.getElementById("ovpn-top-server-id");
                if (topServerId) topServerId.textContent = serverIp;
                
                const topPorts = document.getElementById("ovpn-top-ports");
                if (topPorts) {
                    const uState = st.udp_active ? "UDP 1194" : "UDP Off";
                    const tState = st.tcp_active ? "TCP 1194" : "TCP Off";
                    topPorts.textContent = `${uState} / ${tState}`;
                }

                const topSummary = document.getElementById("ovpn-badge-summary");
                const topBadgeDot = document.querySelector("#ovpn-status-badge .status-dot");
                if (topSummary) {
                    if (st.udp_active && st.tcp_active) {
                        topSummary.textContent = window.t("هسته دوگانه UDP/TCP آنلاین");
                        if (topBadgeDot) topBadgeDot.className = "status-dot active";
                    } else if (st.udp_active || st.tcp_active) {
                        topSummary.textContent = window.t("سرویس نیمه‌فعال");
                        if (topBadgeDot) topBadgeDot.className = "status-dot active";
                    } else {
                        topSummary.textContent = window.t("سرویس‌های OpenVPN متوقف");
                        if (topBadgeDot) topBadgeDot.className = "status-dot inactive";
                    }
                }

                // Cert Details in Cryptography Card
                const certSubject = document.getElementById("ovpn-cert-subject-display");
                if (certSubject) certSubject.textContent = ca.subject || "CN = OpenVPN-CA";

                const certIssuer = document.getElementById("ovpn-cert-issuer-display");
                if (certIssuer) certIssuer.textContent = ca.issuer || "CN = OpenVPN-CA";

                const certExpiry = document.getElementById("ovpn-cert-expiry-display");
                if (certExpiry) certExpiry.textContent = ca.expiry || window.t("معتبر تا 2036");

                const certTc = document.getElementById("ovpn-cert-tc-display");
                if (certTc) {
                    certTc.textContent = ca.has_tc_key !== false ? "فعال (TLS-Crypt)" : "غیرفعال";
                }

                // Host inputs
                const hostInput = document.getElementById("ovpn-host-input");
                if (hostInput && !hostInput.value) hostInput.value = serverIp;

                const exportHost = document.getElementById("ovpn-export-host");
                if (exportHost && !exportHost.value) exportHost.value = serverIp;

                // Multiport Checkboxes & Inputs
                const udpCb = document.getElementById("ovpn-mp-udp-enabled");
                if (udpCb) udpCb.checked = cfg.udp_enabled !== false;
                
                const udpExtra = document.getElementById("ovpn-mp-extra-udp");
                if (udpExtra && cfg.extra_udp_ports) {
                    udpExtra.value = Array.isArray(cfg.extra_udp_ports) ? cfg.extra_udp_ports.join(", ") : cfg.extra_udp_ports;
                }
                
                const tcpCb = document.getElementById("ovpn-mp-tcp-enabled");
                if (tcpCb) tcpCb.checked = cfg.tcp_enabled !== false;
                
                const tcpExtra = document.getElementById("ovpn-mp-extra-tcp");
                if (tcpExtra && cfg.extra_tcp_ports) {
                    tcpExtra.value = Array.isArray(cfg.extra_tcp_ports) ? cfg.extra_tcp_ports.join(", ") : cfg.extra_tcp_ports;
                }
                
                const xorKeyInput = document.getElementById("ovpn-addon-xor-key");
                if (xorKeyInput && cfg.scramble_key) {
                    xorKeyInput.value = cfg.scramble_key;
                }

                if (cfg.dns_servers && document.getElementById("ovpn-dns-input")) {
                    document.getElementById("ovpn-dns-input").value = cfg.dns_servers;
                }

                // Toggles
                if (typeof cfg.mssfix === "boolean" && document.getElementById("ovpn-toggle-mssfix")) {
                    document.getElementById("ovpn-toggle-mssfix").checked = cfg.mssfix;
                }
                if (typeof cfg.fast_io === "boolean" && document.getElementById("ovpn-toggle-fastio")) {
                    document.getElementById("ovpn-toggle-fastio").checked = cfg.fast_io;
                }
                if (typeof cfg.block_outside_dns === "boolean" && document.getElementById("ovpn-toggle-dnsleak")) {
                    document.getElementById("ovpn-toggle-dnsleak").checked = cfg.block_outside_dns;
                }
                if (typeof cfg.tcp_nodelay === "boolean" && document.getElementById("ovpn-toggle-tcpnodelay")) {
                    document.getElementById("ovpn-toggle-tcpnodelay").checked = cfg.tcp_nodelay;
                }

                // Sync User Select in Export Box
                try {
                    const uRes = await fetch("/api/openvpn/users");
                    const uData = await uRes.json();
                    const userSelect = document.getElementById("ovpn-export-user-select");
                    if (userSelect && uData.users) {
                        const currentVal = userSelect.value;
                        userSelect.innerHTML = `<option value="">بدون ذخیره کاربر (ورود دستی در برنامه)</option>`;
                        for (const u of Object.keys(uData.users)) {
                            const opt = document.createElement("option");
                            opt.value = u;
                            opt.textContent = `${u} ${u.toUpperCase() === 'NPU' ? '(کاربر پیش‌فرض ردیوس)' : ''}`;
                            if (u === currentVal || (!currentVal && u.toUpperCase() === 'NPU')) {
                                opt.selected = true;
                            }
                            userSelect.appendChild(opt);
                        }
                    }
                } catch (e) {}

                // Update Linux CLI Command
                const hostVal = (exportHost ? exportHost.value : "") || serverIp;
                const cliBox = document.getElementById("ovpn-linux-cli-command");
                if (cliBox) {
                    cliBox.textContent = `sudo openvpn --config MHPanel-OpenVPN-UDP-1194-${hostVal}.ovpn`;
                }

                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        } catch (e) {
            console.error("Failed to fetch OpenVPN config", e);
        }
    }

    function applyOvpnPreset(preset) {
        const protoSelect = document.getElementById("ovpn-export-proto");
        const portInput = document.getElementById("ovpn-export-port");
        const mssfixCb = document.getElementById("ovpn-export-bypass-dpi");
        const dnsLeakCb = document.getElementById("ovpn-export-dns-leak");
        const xorCb = document.getElementById("ovpn-export-xor");
        const toggleXor = document.getElementById("ovpn-toggle-xor");

        if (preset === 'udp') {
            if (protoSelect) protoSelect.value = "udp";
            if (portInput) portInput.value = "1194";
            if (mssfixCb) mssfixCb.checked = true;
            if (dnsLeakCb) dnsLeakCb.checked = true;
            if (xorCb) xorCb.checked = false;
            if (toggleXor) toggleXor.checked = false;
            showToast("پروفایل ⚡ UDP توربو (سرعت و گیمینگ) اعمال شد", "success");
        } else if (preset === 'tcp') {
            if (protoSelect) protoSelect.value = "tcp";
            if (portInput) portInput.value = "1194";
            if (mssfixCb) mssfixCb.checked = true;
            if (dnsLeakCb) dnsLeakCb.checked = true;
            if (xorCb) xorCb.checked = false;
            if (toggleXor) toggleXor.checked = false;
            showToast("پروفایل 🛡️ TCP ضد فیلتر (پایدار) اعمال شد", "success");
        } else if (preset === 'multiport') {
            const udpCb = document.getElementById("ovpn-mp-udp-enabled");
            const tcpCb = document.getElementById("ovpn-mp-tcp-enabled");
            const udpExtra = document.getElementById("ovpn-mp-extra-udp");
            const tcpExtra = document.getElementById("ovpn-mp-extra-tcp");
            if (udpCb) udpCb.checked = true;
            if (tcpCb) tcpCb.checked = true;
            if (udpExtra) udpExtra.value = "53, 500, 4500";
            if (tcpExtra) tcpExtra.value = "9443, 2087, 2096";
            showToast("پروفایل 🔀 چند پورته (Multi-Port) در فرم تنظیم شد", "success");
        } else if (preset === 'xor') {
            if (xorCb) xorCb.checked = true;
            if (toggleXor) toggleXor.checked = true;
            showToast("پروفایل 🔒 پنهان‌ساز هدر (Scramble XOR) فعال شد", "success");
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function saveOpenvpnCoreConfig(e) {
        if (e && e.preventDefault) e.preventDefault();
        
        const host = document.getElementById("ovpn-host-input") ? document.getElementById("ovpn-host-input").value.trim() : "";
        const dns = document.getElementById("ovpn-dns-input") ? document.getElementById("ovpn-dns-input").value.trim() : "1.1.1.1, 8.8.8.8";
        const udpEnabled = document.getElementById("ovpn-mp-udp-enabled") ? document.getElementById("ovpn-mp-udp-enabled").checked : true;
        const extraUdp = document.getElementById("ovpn-mp-extra-udp") ? document.getElementById("ovpn-mp-extra-udp").value : "";
        const tcpEnabled = document.getElementById("ovpn-mp-tcp-enabled") ? document.getElementById("ovpn-mp-tcp-enabled").checked : true;
        const extraTcp = document.getElementById("ovpn-mp-extra-tcp") ? document.getElementById("ovpn-mp-extra-tcp").value : "";
        const xorKey = document.getElementById("ovpn-addon-xor-key") ? document.getElementById("ovpn-addon-xor-key").value.trim() : "openvpn_xor";
        const mssfix = document.getElementById("ovpn-toggle-mssfix") ? document.getElementById("ovpn-toggle-mssfix").checked : true;
        const fastio = document.getElementById("ovpn-toggle-fastio") ? document.getElementById("ovpn-toggle-fastio").checked : true;
        const dnsleak = document.getElementById("ovpn-toggle-dnsleak") ? document.getElementById("ovpn-toggle-dnsleak").checked : true;
        const tcpnodelay = document.getElementById("ovpn-toggle-tcpnodelay") ? document.getElementById("ovpn-toggle-tcpnodelay").checked : true;

        toggleLoading(true, "در حال ذخیره و اعمال تنظیمات OpenVPN در فایروال و سرویس‌ها...");
        try {
            const res = await fetch("/api/openvpn/config", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    host: host,
                    dns_servers: dns,
                    udp_enabled: udpEnabled,
                    extra_udp_ports: extraUdp,
                    tcp_enabled: tcpEnabled,
                    extra_tcp_ports: extraTcp,
                    scramble_key: xorKey,
                    mssfix: mssfix,
                    fast_io: fastio,
                    block_outside_dns: dnsleak,
                    tcp_nodelay: tcpnodelay
                })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message || "تنظیمات با موفقیت ذخیره و اعمال شد.", "success");
                fetchOpenvpnConfig();
            } else {
                showToast("خطا: " + (data.error || "خطای سرور"), "error");
            }
        } catch (err) {
            showToast("خطا در برقراری ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    async function saveOpenvpnMultiportConfig() {
        return saveOpenvpnCoreConfig();
    }

    function buildCustomOvpnDownloadUrl() {
        const protoSelect = document.getElementById("ovpn-export-proto");
        const protoVal = protoSelect ? protoSelect.value : "udp-1194";
        const portInput = document.getElementById("ovpn-export-port");
        
        let proto = "udp";
        if (protoVal.startsWith("tcp")) {
            proto = "tcp";
        } else if (protoVal.startsWith("udp")) {
            proto = "udp";
        } else {
            proto = (portInput && portInput.value === "443") ? "tcp" : "udp";
        }
        
        let port = portInput ? portInput.value.trim() : "1194";
        if (!port) {
            port = proto === "tcp" ? "443" : "1194";
        }

        const host = document.getElementById("ovpn-export-host") ? document.getElementById("ovpn-export-host").value.trim() : "";
        const user = document.getElementById("ovpn-export-user-select") ? document.getElementById("ovpn-export-user-select").value.trim() : "";
        const bypassDpi = document.getElementById("ovpn-export-bypass-dpi") && document.getElementById("ovpn-export-bypass-dpi").checked ? "1" : "0";
        const dnsLeak = document.getElementById("ovpn-export-dns-leak") && document.getElementById("ovpn-export-dns-leak").checked ? "1" : "0";
        const xorCb = document.getElementById("ovpn-export-xor");
        const xor = xorCb && xorCb.checked && !xorCb.disabled ? "1" : "0";
        const xorKey = document.getElementById("ovpn-addon-xor-key") ? document.getElementById("ovpn-addon-xor-key").value.trim() : "openvpn_xor";
        const udpCb = document.getElementById("ovpn-export-udpspeeder");
        const udpspeeder = udpCb && udpCb.checked && !udpCb.disabled ? "1" : "0";

        let url = `/api/openvpn/client/download?proto=${encodeURIComponent(proto)}&port=${encodeURIComponent(port)}&bypass_dpi=${bypassDpi}&dns_leak=${dnsLeak}&xor=${xor}&xor_key=${encodeURIComponent(xorKey)}&udpspeeder=${udpspeeder}`;
        if (host) url += `&host=${encodeURIComponent(host)}`;
        if (user) url += `&user=${encodeURIComponent(user)}`;
        return url;
    }

    function downloadCustomOvpnProfile() {
        const url = buildCustomOvpnDownloadUrl();
        window.location.href = url;
    }

    async function installOvpnAddon(addon) {
        toggleLoading(true, `در حال نصب و کامپایل ${addon}... (ممکن است چند دقیقه طول بکشد)`);
        try {
            const res = await fetch(`/api/openvpn/addons`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ addon: addon })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message || `${addon} با موفقیت نصب شد!`, "success");
                checkOvpnAddonStatus();
            } else {
                showToast(`خطا در نصب ${addon}: ` + (data.error || "خطای سرور"), "error");
            }
        } catch (e) {
            showToast("خطا در برقراری ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }

    async function uninstallOvpnAddon(addon) {
        if (!confirm(`آیا از حذف کامل افزونه ${addon} اطمینان دارید؟`)) return;
        toggleLoading(true, `در حال حذف ${addon}...`);
        try {
            const res = await fetch("/api/openvpn/addons", {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ addon: addon })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast(data.message || `افزونه ${addon} با موفقیت حذف شد.`, "success");
                checkOvpnAddonStatus();
            } else {
                showToast("خطا در حذف: " + (data.error || "خطای سرور"), "error");
            }
        } catch (e) {
            showToast("خطا در برقراری ارتباط با سرور", "error");
        }
        toggleLoading(false);
    }
