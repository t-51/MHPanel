<div class="login-container">
    <div class="glass-card login-card" style="position: relative;">
        <!-- Language & Theme Selector Bar on Login Page -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px;">
            <button type="button" class="theme-btn" onclick="toggleTheme()" id="login-theme-btn" style="background:rgba(255,255,255,0.06); border:1px solid var(--border-color); color:var(--text-main); padding:4px 10px; border-radius:14px; cursor:pointer; font-size:12px; display:flex; align-items:center; gap:5px;">
                <i data-lucide="moon" id="login-theme-icon" style="width:14px; height:14px;"></i>
                <span id="login-theme-label" data-i18n="wg_item_4">تم</span>
            </button>
            <div class="header-lang-pills" style="margin: 0;">
                <button type="button" class="lang-pill" data-lang="fa" onclick="changeLanguage('fa')" title="فارسی" data-i18n-title="sys_item_2">
                    <svg width="15" height="11" viewBox="0 0 18 13" fill="none" style="border-radius:2px; display:inline-block; vertical-align:middle; flex-shrink:0;">
                        <rect width="18" height="4.33" fill="#239F40"/>
                        <rect y="4.33" width="18" height="4.33" fill="#FFFFFF"/>
                        <rect y="8.67" width="18" height="4.33" fill="#DA0000"/>
                        <circle cx="9" cy="6.5" r="1.3" fill="#DA0000"/>
                    </svg>
                    <span>FA</span>
                </button>
                <button type="button" class="lang-pill" data-lang="en" onclick="changeLanguage('en')" title="English">
                    <svg width="15" height="11" viewBox="0 0 18 13" fill="none" style="border-radius:2px; display:inline-block; vertical-align:middle; flex-shrink:0;">
                        <rect width="18" height="13" fill="#012169"/>
                        <path d="M0 0L18 13M18 0L0 13" stroke="#FFFFFF" stroke-width="2.5"/>
                        <path d="M0 0L18 13M18 0L0 13" stroke="#C8102E" stroke-width="1.2"/>
                        <path d="M9 0V13M0 6.5H18" stroke="#FFFFFF" stroke-width="4.5"/>
                        <path d="M9 0V13M0 6.5H18" stroke="#C8102E" stroke-width="2.7"/>
                    </svg>
                    <span>EN</span>
                </button>
                <button type="button" class="lang-pill" data-lang="ru" onclick="changeLanguage('ru')" title="Русский">
                    <svg width="15" height="11" viewBox="0 0 18 13" fill="none" style="border-radius:2px; display:inline-block; vertical-align:middle; flex-shrink:0;">
                        <rect width="18" height="4.33" fill="#FFFFFF"/>
                        <rect y="4.33" width="18" height="4.33" fill="#0039A6"/>
                        <rect y="8.67" width="18" height="4.33" fill="#D52B1E"/>
                    </svg>
                    <span>RU</span>
                </button>
            </div>
            <select id="login-lang-select" style="display:none;" onchange="changeLanguage(this.value)">
                <option value="fa" data-i18n="sys_item_2">فارسی</option>
                <option value="en">English</option>
                <option value="ru">Русский</option>
            </select>
        </div>

        <div class="brand-logo">
            <i data-lucide="shield-alert" style="width: 32px; height: 32px;"></i>
        </div>
        <h1 class="login-title" data-i18n="login_title">MH Panel</h1>
        <p class="login-subtitle" data-i18n="login_subtitle">ورود به پنل مدیریت سرور و پروتکل‌های VPN</p>
        
        <div id="login-error" style="color: var(--color-rose); font-size: 14px; margin-bottom: 20px; display: none;" data-i18n="login_error">
            نام کاربری یا رمز عبور اشتباه است.
        </div>

        <form id="login-form">
            <div class="form-group" style="margin-bottom:16px;">
                <label class="form-label" for="username-input" data-i18n="login_username">نام کاربری</label>
                <div class="input-wrapper">
                    <i data-lucide="user" class="input-icon"></i>
                    <input class="form-input" type="text" id="username-input" value="{{ saved_username }}" placeholder="admin" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom:20px;">
                <label class="form-label" for="password-input" data-i18n="login_password">رمز عبور</label>
                <div class="input-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input class="form-input" type="password" id="password-input" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Two-Factor Authentication (2FA TOTP) Input Field -->
            <div class="form-group" id="login-2fa-group" style="display:none; margin-bottom:20px;">
                <label class="form-label" for="totp-input" style="color:var(--color-primary); font-weight:700;">
                    <i data-lucide="key" style="width:14px; height:14px; vertical-align:middle; margin-left:4px;"></i>
                    <span data-i18n="login_2fa_label">کد احراز هویت دو مرحله‌ای (2FA)</span>
                </label>
                <div class="input-wrapper">
                    <i data-lucide="shield-check" class="input-icon"></i>
                    <input class="form-input" type="text" id="totp-input" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="font-family:'JetBrains Mono', monospace; font-size:18px; letter-spacing:4px; text-align:center;">
                </div>
                <div style="font-size:11.5px; color:var(--text-muted); margin-top:5px;" data-i18n="login_2fa_help">کد ۶ رقمی نرم‌افزار Authenticator خود را وارد کنید.</div>
            </div>

            <button type="submit" class="btn" id="login-btn">
                <i data-lucide="log-in" class="btn-icon"></i> <span data-i18n="login_signin">ورود به پنل</span>
            </button>
        </form>
    </div>
</div>
